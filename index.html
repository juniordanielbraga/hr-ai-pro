<script>
const D = {"dzialy": [{"dzial_nr": 1, "dzial": "Rekrutacja i selekcja", "opis": "Cały proces rekrutacji od opisu stanowiska po ofertę i raport dla zarządu: ogłoszenia z widełkami, selekcja CV, rozmowy, zadania i informacja zwrotna. Ty podajesz fakty i kryteria, a dostajesz gotowe, neutralne płciowo i zgodne z RODO dokumenty do sprawdzenia.", "skills": [{"id": "1.01", "nazwa": "Opis stanowiska (job description)", "co_robi": "Zamienia luźne notatki managera w uporządkowany, neutralny płciowo opis stanowiska: cel roli, zadania, odpowiedzialność, wymagania konieczne i mile widziane oraz przedział wynagrodzenia. Taki opis jest potem bazą do ogłoszenia, rozmowy i oceny okresowej.", "kiedy": "Gdy manager mówi „potrzebuję kogoś do zespołu, zrób ogłoszenie”, a Ty nie masz jeszcze żadnego opisu roli albo ten z szuflady ma pięć lat.", "brief": [{"pole": "Stanowisko i dział", "opis": "Nazwa stanowiska, dział i komu podlega, np. „Specjalista/Specjalistka ds. księgowości, dział finansów, raportuje do głównej księgowej”."}, {"pole": "Cel stanowiska", "opis": "Po co ta rola istnieje, w jednym–dwóch zdaniach, np. „Terminowe księgowanie dokumentów zakupowych i rozliczanie delegacji dla 3 spółek z grupy”."}, {"pole": "Główne zadania", "opis": "Lista zadań od managera, nawet chaotyczna, np. „księgowanie faktur kosztowych, uzgadnianie sald z kontrahentami, pomoc przy zamknięciu miesiąca, JPK”."}, {"pole": "Wymagania", "opis": "Co jest naprawdę konieczne, a co miłe, np. „min. 2 lata w księgowości, znajomość Symfonii – konieczne; angielski B1 – mile widziany”."}, {"pole": "Wynagrodzenie i forma zatrudnienia", "opis": "Przedział i forma, np. „7 500–9 000 zł brutto miesięcznie, umowa o pracę, pełny etat”."}, {"pole": "Firma i warunki pracy", "opis": "Branża, wielkość, miejsce i tryb pracy, np. „firma dystrybucyjna, 120 osób, Poznań, model hybrydowy 3/2”."}], "prompt": "Jesteś doświadczoną specjalistką HR w polskiej firmie z sektora MŚP, która od lat tworzy opisy stanowisk zgodne z zasadami równego traktowania. Przygotuj opis stanowiska na podstawie moich danych.\n\nDANE:\nStanowisko i dział: [STANOWISKO I DZIAŁ]\nCel stanowiska: [CEL STANOWISKA]\nGłówne zadania: [GŁÓWNE ZADANIA]\nWymagania: [WYMAGANIA]\nWynagrodzenie i forma zatrudnienia: [WYNAGRODZENIE I FORMA ZATRUDNIENIA]\nFirma i warunki pracy: [FIRMA I WARUNKI PRACY]\n\nZASADY:\n1. Jeśli brakuje istotnych danych (np. komu rola podlega, zakres odpowiedzialności, przedział wynagrodzenia), zadaj mi maksymalnie 5 krótkich pytań i poczekaj na odpowiedź. Nie wymyślaj liczb, stawek, nazw systemów ani danych firmy – luki oznacz [DO UZUPEŁNIENIA], a założenia [ZAŁOŻENIE].\n2. Nazwa stanowiska i cały tekst mają być neutralne płciowo (np. forma „Specjalista/Specjalistka” albo nazwa neutralna).\n3. Rozdziel wymagania na konieczne i mile widziane. Usuń wymagania, które mogą dyskryminować lub nie mają związku z pracą (wiek, płeć, stan rodzinny, „młody zespół”, „native” zamiast poziomu języka).\n4. Zadania zapisz czasownikami w formie „odpowiada za”, „przygotowuje”, „koordynuje”, od najważniejszych.\n5. Wynagrodzenie podaj jako przedział oparty na obiektywnych kryteriach – zgodnie z zasadą jawności wynagrodzeń. Jeśli go nie podałam, zostaw [DO UZUPEŁNIENIA].\n6. Kwestie, które mogą mieć skutki prawne (forma umowy, wymiar etatu, praca zdalna), oznacz [DO WERYFIKACJI] z kadrami.\n\nFORMAT WYNIKU:\nA) Opis stanowiska: nazwa, dział, podległość, cel, zadania, odpowiedzialność, uprawnienia.\nB) Tabela wymagań: kompetencja – konieczne/mile widziane – jak to sprawdzimy w rekrutacji.\nC) Wynagrodzenie, forma zatrudnienia, miejsce i tryb pracy.\nD) Lista „sprawdź przed użyciem”: wszystkie założenia i luki.\nE) 3 pytania, które warto zadać managerowi, żeby doprecyzować rolę.", "polecenia": ["Skróć opis do jednej strony A4.", "Zrób z tego wersję do oceny okresowej z mierzalnymi oczekiwaniami.", "Dodaj kolumnę z poziomem oczekiwanym po 3 i po 12 miesiącach.", "Sprawdź, czy w tekście nie ma sformułowań dyskryminujących lub niejasnych.", "Przygotuj wersję dla stanowiska juniorskiego i seniorskiego.", "Zamień opis na tabelę kompetencji do arkusza ocen kandydatów.", "Przetłumacz opis na angielski, zachowując neutralność płciową.", "Wypisz zadania, które moglibyśmy przekazać innym osobom w zespole.", "Przygotuj krótkie podsumowanie roli dla zarządu w 5 punktach.", "Zaproponuj 3 neutralne płciowo nazwy stanowiska do wyboru."], "checklista": ["Nazwa stanowiska i treść są neutralne płciowo.", "Wymagania konieczne są naprawdę konieczne – każde da się uzasadnić zadaniami.", "Brak kryteriów dyskryminujących: wiek, płeć, stan rodzinny, zdrowie, wyznanie, pochodzenie.", "Przedział wynagrodzenia jest zgodny z regulaminem wynagradzania i zatwierdzony przez decydenta.", "Zadania i podległość potwierdził manager zespołu.", "Forma umowy, wymiar etatu i tryb pracy zweryfikowane przez kadry.", "Wszystkie [DO UZUPEŁNIENIA] i [ZAŁOŻENIE] zostały uzupełnione lub usunięte."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Opis stanowiska bywa później dowodem w sporach o zakres obowiązków czy równe wynagrodzenie, więc przed publikacją uzgodnij go z managerem i kadrami."}, {"id": "1.02", "nazwa": "Ogłoszenie o pracę z widełkami", "co_robi": "Pisze ogłoszenie o pracę z jawnym przedziałem wynagrodzenia i neutralną płciowo nazwą stanowiska, w wersjach dopasowanych do Pracuj.pl, LinkedIn, justjoin.it i OLX Praca. Każda wersja ma inny ton i długość, bo każdy portal czytają inni kandydaci.", "kiedy": "Gdy masz zatwierdzony opis stanowiska i budżet, a ogłoszenie ma wyjść jeszcze dziś na kilku portalach naraz.", "brief": [{"pole": "Stanowisko", "opis": "Neutralna płciowo nazwa i poziom, np. „Specjalista/Specjalistka ds. obsługi klienta (k/m/x), poziom mid”."}, {"pole": "Widełki wynagrodzenia", "opis": "Przedział, brutto/netto, okres i forma, np. „6 800–8 200 zł brutto/mies. na umowie o pracę + premia kwartalna do 10%”."}, {"pole": "Forma i miejsce pracy", "opis": "Umowa, etat, lokalizacja, tryb, np. „umowa o pracę, pełny etat, Wrocław Fabryczna, hybrydowo 2 dni w biurze”."}, {"pole": "Kluczowe zadania i wymagania", "opis": "3–6 zadań i wymagania konieczne/mile widziane, np. „obsługa zgłoszeń mailowych i telefonicznych, CRM; konieczne: rok w obsłudze klienta; mile widziany niemiecki”."}, {"pole": "Co oferujemy", "opis": "Benefity i atuty, np. „prywatna opieka medyczna, karta sportowa, szkolenia produktowe, stały grafik pn–pt 8–16”."}, {"pole": "Portale publikacji", "opis": "Gdzie publikujesz, np. „Pracuj.pl i OLX Praca” albo „LinkedIn i justjoin.it”."}], "prompt": "Jesteś doświadczoną rekruterką i specjalistką employer brandingu w polskiej firmie z sektora MŚP. Napisz ogłoszenie o pracę, które przyciągnie dopasowanych kandydatów i będzie zgodne z zasadami jawności wynagrodzeń.\n\nDANE:\nStanowisko: [STANOWISKO]\nWidełki wynagrodzenia: [WIDEŁKI WYNAGRODZENIA]\nForma i miejsce pracy: [FORMA I MIEJSCE PRACY]\nZadania i wymagania: [KLUCZOWE ZADANIA I WYMAGANIA]\nCo oferujemy: [CO OFERUJEMY]\nPortale: [PORTALE PUBLIKACJI]\n\nZASADY:\n1. Jeśli brakuje istotnych danych (zwłaszcza widełek, formy umowy lub lokalizacji), zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj stawek, benefitów ani danych firmy – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Nazwa stanowiska neutralna płciowo: forma „Specjalista/Specjalistka”, dopisek „(k/m/x)” albo nazwa neutralna. Treść zwraca się do kandydatów neutralnie.\n3. Widełki podaj wprost, z informacją brutto/netto, okres i formę umowy. Od 24.12.2025 art. 18³ca KP wymaga informacji o wynagrodzeniu lub jego przedziale na podstawie obiektywnych, neutralnych płciowo kryteriów; uwzględnij też dyrektywę UE 2023/970 i dopisz „sprawdź aktualny stan prawny” w notatce dla mnie.\n4. Nie pytaj w formularzu o obecne ani poprzednie wynagrodzenie. Bez wymagań dyskryminujących (wiek, płeć, stan rodzinny, „młody zespół”).\n5. Dopasuj wersje: Pracuj.pl – pełna i uporządkowana; LinkedIn – krótsza, osobista; justjoin.it – konkretna, stack i widełki na górze; OLX Praca – prosta, krótka, bez żargonu.\n6. Na końcu każdej wersji miejsce na klauzulę RODO i zgodę na przyszłe rekrutacje – oznacz je [DO WERYFIKACJI] z kadrami/prawnikiem.\n\nFORMAT WYNIKU:\nA) Wersja na każdy wskazany portal – gotowa do skopiowania.\nB) 3 propozycje tytułu ogłoszenia.\nC) Tabela: portal – długość – ton – co wyróżnić.\nD) Lista „sprawdź przed publikacją” z założeniami i lukami.", "polecenia": ["Skróć wersję na LinkedIn do 600 znaków.", "Przygotuj wersję B ogłoszenia do testu z innym nagłówkiem.", "Napisz post na LinkedIn dla managera, który udostępni ogłoszenie.", "Przetłumacz ogłoszenie na angielski dla kandydatów z zagranicy.", "Przygotuj wersję prostym językiem dla kandydatów z Ukrainy.", "Sprawdź tekst pod kątem neutralności płciowej i dyskryminacji.", "Zrób krótką wersję na grupę na Facebooku i do stopki maila.", "Dodaj sekcję „Jak wygląda proces rekrutacji” w 4 krokach.", "Zmień ton na bardziej luźny, ale bez infantylizowania.", "Wypisz 5 pytań kwalifikujących do formularza aplikacyjnego."], "checklista": ["Widełki są podane wprost, z informacją brutto/netto, okresem i formą umowy.", "Nazwa stanowiska jest neutralna płciowo – forma podwójna, „(k/m/x)” lub nazwa neutralna.", "Formularz nie pyta o obecne ani poprzednie wynagrodzenie.", "Brak wymagań dyskryminujących: wiek, płeć, stan rodzinny, zdrowie, pochodzenie.", "Benefity i warunki potwierdzone przez kadry i decydenta – nic nie jest obiecane na wyrost.", "Klauzula informacyjna RODO i osobna zgoda na przyszłe rekrutacje sprawdzone przez kadry/prawnika.", "Zgodność z art. 18³ca KP i stanem wdrożenia dyrektywy 2023/970 zweryfikowana – sprawdź aktualny stan prawny."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Treść ogłoszenia jest wiążącą informacją dla kandydatów, więc widełki i warunki publikuj dopiero po akceptacji osoby, która zatwierdza budżet."}, {"id": "1.03", "nazwa": "Selekcja CV (screening)", "co_robi": "Porównuje zanonimizowane CV z kryteriami stanowiska i zwraca tabelę dopasowania z uzasadnieniem każdej oceny. Pomaga szybko przejrzeć dużą liczbę aplikacji, ale wyłącznie na podstawie kryteriów związanych z pracą.", "kiedy": "Gdy po dwóch dniach od publikacji masz 140 aplikacji, a manager chce krótką listę na piątek.", "brief": [{"pole": "Stanowisko", "opis": "Nazwa i poziom, np. „Księgowy/Księgowa, poziom samodzielny, biuro rachunkowe”."}, {"pole": "Kryteria konieczne", "opis": "Wymagania, bez których kandydat odpada, np. „min. 3 lata pełnej księgowości, rozliczenia VAT i JPK, znajomość Optimy”."}, {"pole": "Kryteria mile widziane", "opis": "Atuty, np. „certyfikat księgowy, doświadczenie z klientami e-commerce, angielski B2”."}, {"pole": "Waga kryteriów", "opis": "Co jest ważniejsze, np. „doświadczenie 50%, narzędzia 30%, mile widziane 20%”."}, {"pole": "Zanonimizowane CV", "opis": "Wklej treść CV bez imienia, nazwiska, zdjęcia, daty urodzenia, adresu i danych kontaktowych, z kodem, np. „K-07: 2019–2024 biuro rachunkowe…”."}], "prompt": "Jesteś doświadczoną rekruterką w polskiej firmie, która prowadzi selekcję CV rzetelnie, zgodnie z zasadą równego traktowania i z poszanowaniem RODO. Oceń dopasowanie kandydatów do kryteriów stanowiska.\n\nDANE:\nStanowisko: [STANOWISKO]\nKryteria konieczne: [KRYTERIA KONIECZNE]\nKryteria mile widziane: [KRYTERIA MILE WIDZIANE]\nWaga kryteriów: [WAGA KRYTERIÓW]\nCV kandydatów (zanonimizowane, z kodami): [ZANONIMIZOWANE CV]\n\nZASADY:\n1. Jeśli kryteria są niejasne lub brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie dopowiadaj doświadczenia, którego nie ma w CV – brak informacji oznacz [DO UZUPEŁNIENIA], interpretacje [ZAŁOŻENIE].\n2. Oceniaj wyłącznie kryteria związane z pracą. Pomijaj i nie komentuj: wieku, płci, stanu rodzinnego, zdrowia, pochodzenia, wyznania, zdjęcia, przerw w zatrudnieniu bez związku z kompetencjami.\n3. Jeśli w CV zostały dane osobowe (imię, nazwisko, PESEL, adres, dane o zdrowiu), nie przetwarzaj ich – wskaż mi to na początku odpowiedzi jako problem RODO.\n4. Każdą ocenę uzasadnij konkretnym fragmentem CV. Nie oceniaj „stylu” ani „wrażenia”.\n5. Luki w doświadczeniu nie są minusem samym w sobie – zaznacz je jako temat do rozmowy.\n6. Wynik to rekomendacja dla człowieka, nie decyzja: kandydatów granicznych oznacz [DO WERYFIKACJI].\n\nFORMAT WYNIKU:\nA) Tabela: kod kandydata – każde kryterium konieczne (spełnia/częściowo/nie spełnia) – mile widziane – wynik ważony – uzasadnienie z CV.\nB) Podział: zaproszenie do rozmowy / do weryfikacji telefonicznej / odmowa – z jednym zdaniem uzasadnienia.\nC) Pytania do rozmowy telefonicznej dla kandydatów granicznych.\nD) Lista „sprawdź przed użyciem”: założenia, luki i ewentualne problemy z anonimizacją.", "polecenia": ["Posortuj tabelę od najwyższego wyniku ważonego.", "Pokaż tylko kandydatów spełniających wszystkie kryteria konieczne.", "Przygotuj 3 pytania do krótkiej rozmowy telefonicznej z każdym z top 5.", "Zmień wagi: doświadczenie 40%, narzędzia 40%, reszta 20% i przelicz.", "Sprawdź, czy któraś ocena nie opiera się na kryterium niezwiązanym z pracą.", "Zrób krótkie podsumowanie shortlisty dla managera w 5 zdaniach.", "Wskaż kandydatów, którzy pasują lepiej do innego otwartego stanowiska.", "Zamień tabelę na format do wklejenia do Excela.", "Wypisz, czego najczęściej brakuje kandydatom – czy kryteria nie są za ostre?", "Przygotuj krótką notatkę do ATS przy każdym kodzie kandydata."], "checklista": ["Przed wklejeniem do AI usunięto imię, nazwisko, zdjęcie, datę urodzenia, adres, PESEL i dane kontaktowe.", "W CV nie zostały dane wrażliwe – o zdrowiu, wyznaniu, niepełnosprawności, poglądach.", "Każda ocena ma uzasadnienie w treści CV, a nie w wrażeniu.", "Żadna decyzja nie opiera się na wieku, płci, stanie rodzinnym ani przerwie w karierze.", "Kandydatów granicznych sprawdzono ręcznie, a nie odrzucono automatycznie.", "Kryteria są te same dla wszystkich kandydatów w procesie.", "Ostateczną listę zaproszeń zatwierdziłaś Ty lub manager – AI tylko porządkuje dane."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Narzędzie AI nie może samodzielnie odrzucać kandydatów: każdą odmowę sprawdź osobiście, a do AI wklejaj tylko zanonimizowane dane."}, {"id": "1.04", "nazwa": "Direct sourcing – wiadomości do kandydatów", "co_robi": "Pisze spersonalizowane wiadomości do pasywnych kandydatów (LinkedIn InMail, mail, wiadomość na justjoin.it) wraz z serią follow-upów. Od razu podaje widełki i konkrety, bo to najczęstszy powód, dla którego kandydat w ogóle odpisuje.", "kiedy": "Gdy ogłoszenie nie przyciąga właściwych osób i musisz sama dotrzeć do 30 specjalistów, którzy dziś nie szukają pracy.", "brief": [{"pole": "Stanowisko i widełki", "opis": "Rola, poziom i przedział, np. „Senior Java Developer (k/m/x), 22 000–27 000 zł netto/mies. na B2B lub 18 000–22 000 zł brutto na UoP”."}, {"pole": "Profil kandydata", "opis": "Co wiesz z profilu (bez danych wrażliwych), np. „6 lat w fintechu, Spring Boot, prowadził migrację do chmury, od 3 lat w jednej firmie”."}, {"pole": "Firma i argumenty", "opis": "Dlaczego warto rozmawiać, np. „produkt dla logistyki, zespół 8 osób, praca zdalna, realny wpływ na architekturę, stabilne finansowanie”."}, {"pole": "Kanał i ton", "opis": "Gdzie piszesz i jak, np. „LinkedIn InMail, na Ty, krótko i konkretnie”."}, {"pole": "Kontekst kontaktu", "opis": "Czy to pierwszy kontakt, czy powrót, np. „pierwszy kontakt, mamy 2 wspólne znajomości z branży”."}], "prompt": "Jesteś doświadczoną rekruterką prowadzącą direct sourcing w polskiej firmie. Napisz wiadomości do pasywnego kandydata, które brzmią jak od człowieka, a nie jak masowy spam.\n\nDANE:\nStanowisko i widełki: [STANOWISKO I WIDEŁKI]\nProfil kandydata: [PROFIL KANDYDATA]\nFirma i argumenty: [FIRMA I ARGUMENTY]\nKanał i ton: [KANAŁ I TON]\nKontekst kontaktu: [KONTEKST KONTAKTU]\n\nZASADY:\n1. Jeśli brakuje istotnych danych (widełek, formy współpracy, trybu pracy), zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj stawek, nazw klientów, technologii ani faktów o kandydacie – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Pierwsza wiadomość: maksymalnie 700 znaków, konkretne nawiązanie do doświadczenia kandydata, widełki i forma współpracy w treści, jedno proste pytanie na końcu.\n3. Podaj wynagrodzenie zgodnie z zasadą jawności wynagrodzeń. Nie pytaj kandydata o obecne ani poprzednie zarobki – możesz zapytać o oczekiwania.\n4. Nie odwołuj się do wieku, płci, sytuacji rodzinnej ani innych danych spoza zawodowego profilu. Zwracaj się neutralnie płciowo, jeśli nie znasz formy, której używa kandydat.\n5. Follow-upy krótsze od pierwszej wiadomości, każdy z nową informacją, bez wywoływania poczucia winy.\n6. Dodaj jedno zdanie o tym, skąd mam dane kontaktowe i że kandydat może poprosić o ich usunięcie – oznacz je [DO WERYFIKACJI] z osobą od RODO.\n\nFORMAT WYNIKU:\nA) Pierwsza wiadomość – gotowa do skopiowania.\nB) Follow-up po 4–5 dniach.\nC) Ostatni follow-up po 10 dniach, zostawiający otwarte drzwi.\nD) Odpowiedź na „dziękuję, nie jestem zainteresowany/zainteresowana”.\nE) Lista „sprawdź przed wysłaniem”.", "polecenia": ["Skróć pierwszą wiadomość do 300 znaków na zaproszenie do kontaktów.", "Przygotuj wersję B z innym otwarciem do testu.", "Napisz wersję po angielsku dla kandydata z zagranicy.", "Zmień ton na bardziej formalny, na Pan/Pani.", "Przygotuj odpowiedź, gdy kandydat pyta o stawkę wyższą niż widełki.", "Napisz wiadomość do osoby, która poleci nam kogoś ze swojej sieci.", "Przygotuj wersję do wysłania mailem z tematem wiadomości.", "Dopisz krótkie podsumowanie procesu rekrutacji w 3 krokach.", "Zaproponuj 5 fraz wyszukiwania boolean na LinkedIn dla tego profilu.", "Przygotuj wiadomość do kandydata, który odpadł rok temu w innym procesie."], "checklista": ["Widełki i forma współpracy są w treści pierwszej wiadomości.", "Wiadomość nie pyta o obecne ani poprzednie wynagrodzenie.", "Wszystkie fakty o kandydacie pochodzą z jego publicznego profilu zawodowego.", "Brak odniesień do wieku, płci, rodziny, zdrowia czy pochodzenia.", "Informacja o źródle danych i prawie do ich usunięcia uzgodniona z osobą od RODO.", "Benefity i warunki są aktualne i zatwierdzone – nic ponad to, co firma da.", "Liczba follow-upów nie przekracza trzech – brak odpowiedzi to też odpowiedź."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Dane z profili kandydatów zapisuj w ATS tylko w niezbędnym zakresie i usuń je, jeśli kandydat o to poprosi."}, {"id": "1.05", "nazwa": "Scenariusz rozmowy kwalifikacyjnej", "co_robi": "Przygotowuje ustrukturyzowany scenariusz rozmowy z pytaniami behawioralnymi (STAR), wzorcami dobrych odpowiedzi i arkuszem ocen. Dodaje listę pytań zakazanych, żeby rozmowa była porównywalna, rzetelna i bezpieczna prawnie.", "kiedy": "Gdy jutro razem z managerem prowadzisz rozmowy z trzema kandydatami i chcesz, żeby każdy dostał te same pytania i był oceniany według tych samych kryteriów.", "brief": [{"pole": "Stanowisko", "opis": "Nazwa i poziom, np. „Koordynator/Koordynatorka magazynu, zmiana dzienna, 12 osób w zespole”."}, {"pole": "Kompetencje do sprawdzenia", "opis": "3–5 kluczowych kompetencji, np. „organizacja pracy zespołu, rozwiązywanie konfliktów, BHP na magazynie, obsługa WMS”."}, {"pole": "Etap i czas rozmowy", "opis": "Który etap i ile trwa, np. „druga rozmowa, 60 minut, na miejscu w magazynie”."}, {"pole": "Prowadzący rozmowę", "opis": "Kto pyta, np. „HR + kierownik logistyki, kierownik pyta o technikalia”."}, {"pole": "Wynagrodzenie do przekazania", "opis": "Co kandydat ma usłyszeć o wynagrodzeniu, np. „6 500–7 500 zł brutto + premia frekwencyjna, umowa o pracę”."}], "prompt": "Jesteś doświadczoną specjalistką HR w polskiej firmie, która prowadzi ustrukturyzowane rozmowy kwalifikacyjne metodą STAR. Przygotuj scenariusz rozmowy i arkusz ocen.\n\nDANE:\nStanowisko: [STANOWISKO]\nKompetencje do sprawdzenia: [KOMPETENCJE DO SPRAWDZENIA]\nEtap i czas rozmowy: [ETAP I CZAS ROZMOWY]\nProwadzący: [PROWADZĄCY ROZMOWĘ]\nWynagrodzenie do przekazania kandydatowi: [WYNAGRODZENIE DO PRZEKAZANIA]\n\nZASADY:\n1. Jeśli brakuje istotnych danych (np. definicji kompetencji lub podziału ról prowadzących), zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj danych firmy ani wynagrodzenia – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Na każdą kompetencję 2 pytania behawioralne („Opowiedz o sytuacji, kiedy…”) i 1 pogłębiające. Dodaj krótki opis, jak wygląda odpowiedź mocna, przeciętna i słaba.\n3. Wszyscy kandydaci dostają te same pytania w tej samej kolejności – to warunek porównywalności.\n4. Dodaj listę pytań zakazanych: o obecne lub poprzednie wynagrodzenie (zgodnie z art. 18³ca KP), plany rodzinne, ciążę, dzieci, stan cywilny, zdrowie, wiek, wyznanie, orientację, poglądy, przynależność związkową, pochodzenie. Przy każdym podaj neutralną alternatywę, jeśli istnieje.\n5. Uwzględnij moment przekazania informacji o wynagrodzeniu, jeśli kandydat nie dostał jej wcześniej.\n6. Kwestie prawne oznacz [DO WERYFIKACJI] z kadrami/prawnikiem, zamiast cytować przepisy z pamięci.\n\nFORMAT WYNIKU:\nA) Plan rozmowy z czasem na każdy blok.\nB) Pytania pogrupowane według kompetencji, z podziałem na prowadzących.\nC) Arkusz ocen: kompetencja – skala 1–4 z opisem poziomów – miejsce na dowody z rozmowy.\nD) Lista pytań zakazanych i neutralnych alternatyw.\nE) Gotowe zdania na otwarcie i zamknięcie rozmowy, w tym informacja o kolejnych krokach.", "polecenia": ["Skróć scenariusz do rozmowy 30-minutowej.", "Przygotuj wersję do rozmowy online przez Teams.", "Dodaj 3 pytania sytuacyjne „co byś zrobił/zrobiła, gdyby…”.", "Zrób arkusz ocen w formie tabeli do wydruku.", "Przygotuj krótką ściągę dla managera na jedną stronę.", "Dopisz pytania, które kandydat może zadać nam, i sugerowane odpowiedzi.", "Przygotuj wersję prostym językiem dla kandydata z Ukrainy.", "Dodaj pytania sprawdzające motywację i dopasowanie do zespołu.", "Przetłumacz scenariusz na angielski.", "Sprawdź, czy któreś pytanie nie zbliża się do pytań zakazanych."], "checklista": ["Każdy kandydat dostaje te same pytania i jest oceniany według tej samej skali.", "W scenariuszu nie ma pytań o wynagrodzenie obecne lub poprzednie, rodzinę, zdrowie, wiek ani wyznanie.", "Kandydat dostał informację o wynagrodzeniu najpóźniej przed rozmową, jeśli nie było jej w ogłoszeniu.", "Manager zna listę pytań zakazanych przed rozmową.", "Notatki z rozmowy zawierają fakty i przykłady, a nie oceny osobowości czy wyglądu.", "Notatki przechowujesz zgodnie z RODO i klauzulą informacyjną – nie dłużej niż to konieczne.", "Scenariusz zweryfikowany przez Ciebie lub kadry, jeśli rekrutacja dotyczy stanowiska wrażliwego prawnie."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Jedno niefortunne pytanie o plany rodzinne może stać się podstawą zarzutu dyskryminacji, dlatego listę pytań zakazanych przekaż każdej osobie prowadzącej rozmowę."}, {"id": "1.06", "nazwa": "Zadania rekrutacyjne i assessment", "co_robi": "Projektuje zadanie rekrutacyjne dopasowane do stanowiska: case study, zadanie domowe albo ćwiczenie na spotkaniu, razem z instrukcją dla kandydata i kluczem oceny. Dba o to, żeby zadanie sprawdzało realne kompetencje i nie było darmową pracą dla firmy.", "kiedy": "Gdy rozmowa nie wystarcza, żeby odróżnić dwóch podobnych kandydatów, a manager prosi „dajmy im jakieś zadanie”.", "brief": [{"pole": "Stanowisko i poziom", "opis": "Rola i doświadczenie, np. „Specjalista/Specjalistka ds. marketingu, poziom mid, B2B”."}, {"pole": "Kompetencje do sprawdzenia", "opis": "Co ma pokazać zadanie, np. „planowanie kampanii, analiza danych z Google Analytics, pisanie tekstów sprzedażowych”."}, {"pole": "Forma zadania", "opis": "Case, zadanie domowe, ćwiczenie na żywo, np. „case study do omówienia na drugim etapie, prezentacja 15 min”."}, {"pole": "Czas dla kandydata", "opis": "Ile czasu maksymalnie, np. „do 2 godzin pracy, termin 5 dni roboczych”."}, {"pole": "Kontekst firmy", "opis": "Tło do zadania bez danych poufnych, np. „producent mebli biurowych, sprzedaż do firm, mały budżet na reklamę”."}], "prompt": "Jesteś doświadczoną specjalistką HR i assessorką w polskiej firmie, która projektuje uczciwe zadania rekrutacyjne. Przygotuj zadanie, instrukcję dla kandydata i klucz oceny.\n\nDANE:\nStanowisko i poziom: [STANOWISKO I POZIOM]\nKompetencje do sprawdzenia: [KOMPETENCJE DO SPRAWDZENIA]\nForma zadania: [FORMA ZADANIA]\nCzas dla kandydata: [CZAS DLA KANDYDATA]\nKontekst firmy: [KONTEKST FIRMY]\n\nZASADY:\n1. Jeśli brakuje istotnych danych (np. poziomu stanowiska, limitu czasu, formy oddania), zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj danych firmy, liczb ani wyników – w zadaniu używaj danych fikcyjnych i oznacz je [ZAŁOŻENIE], luki oznacz [DO UZUPEŁNIENIA].\n2. Zadanie sprawdza wyłącznie wskazane kompetencje i mieści się w podanym czasie. Nie może być realnym projektem, który firma potem wykorzysta bez wynagrodzenia.\n3. Instrukcja dla kandydata jasna: cel, materiały, czas, forma oddania, termin, kryteria oceny, kto oceni i kiedy będzie odpowiedź.\n4. Klucz oceny z kryteriami i opisem poziomów, tak żeby dwie osoby oceniające doszły do podobnego wyniku.\n5. Zadanie dostępne dla wszystkich: bez płatnego oprogramowania, bez wymogu pracy w weekend, z możliwością prośby o racjonalne dostosowanie.\n6. Dodaj zdanie o prawach do rozwiązania i przetwarzaniu danych kandydata – oznacz je [DO WERYFIKACJI] z kadrami/prawnikiem.\n\nFORMAT WYNIKU:\nA) Treść zadania z fikcyjnymi danymi – gotowa do wysłania.\nB) Instrukcja dla kandydata w formie maila.\nC) Klucz oceny: kryterium – waga – opis poziomów 1–4 – na co uważać.\nD) 5 pytań do omówienia rozwiązania na rozmowie.\nE) Lista „sprawdź przed wysłaniem”: założenia, luki, ryzyka.", "polecenia": ["Skróć zadanie tak, żeby zajmowało maksymalnie 60 minut.", "Przygotuj wersję do wykonania na żywo podczas rozmowy.", "Dodaj drugie zadanie o wyższym poziomie trudności dla seniora.", "Zrób arkusz ocen dla dwóch niezależnych oceniających.", "Przygotuj wersję prostym językiem dla kandydata z Ukrainy.", "Napisz mail z podziękowaniem i informacją zwrotną po zadaniu.", "Sprawdź, czy zadanie nie wymaga wiedzy, której nie mamy w wymaganiach.", "Przetłumacz zadanie i instrukcję na angielski.", "Zaproponuj ćwiczenie grupowe na assessment center dla 6 osób.", "Wypisz typowe błędy kandydatów w tym zadaniu i jak je ocenić."], "checklista": ["Zadanie sprawdza kompetencje z opisu stanowiska, a nie ogólną „inteligencję”.", "Czas wykonania jest realny i podany wprost w instrukcji.", "Dane w zadaniu są fikcyjne – brak tajemnic firmy i danych klientów.", "Wszyscy kandydaci dostają to samo zadanie i ten sam klucz oceny.", "Kandydat wie, kiedy dostanie odpowiedź i czy dostanie informację zwrotną.", "Kwestia praw do rozwiązania i przetwarzania danych sprawdzona przez kadry/prawnika.", "Kandydat może poprosić o dostosowanie zadania, np. z powodu niepełnosprawności."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Zbyt długie zadanie zniechęca najlepszych kandydatów, więc sprawdź je najpierw na kimś z zespołu i zmierz czas."}, {"id": "1.07", "nazwa": "Rekomendacja kandydata dla managera", "co_robi": "Zbiera notatki z rozmów, wyniki zadań i referencje w zwięzły raport dla managera: mocne strony, ryzyka i dowody dla każdej oceny. Dzięki temu decyzja opiera się na faktach z procesu, a nie na tym, kto „lepiej wypadł”.", "kiedy": "Gdy proces dobiega końca, masz dwóch finalistów i stos notatek, a manager chce jutro rano podjąć decyzję.", "brief": [{"pole": "Stanowisko", "opis": "Rola i najważniejsze oczekiwania, np. „Kierownik/Kierowniczka sklepu, 15 osób w zespole, cel: poprawa rotacji”."}, {"pole": "Kandydat (kod)", "opis": "Kod zamiast nazwiska, np. „Kandydat A-03” albo „Finaliści: A-03 i A-11”."}, {"pole": "Notatki z rozmów", "opis": "Fakty i przykłady z rozmów, np. „zmniejszyła rotację w poprzednim sklepie z 40% do 25% przez grafik i onboarding; słabiej w raportowaniu”."}, {"pole": "Wyniki zadań i referencje", "opis": "Wyniki case’ów, testów, referencji, np. „case grafik: 3/4; referencje od byłej przełożonej – pozytywne, uwaga o delegowaniu”."}, {"pole": "Kryteria decyzji", "opis": "Na podstawie czego decydujecie, np. „zarządzanie zespołem 40%, wyniki sprzedażowe 30%, organizacja 30%”."}, {"pole": "Odbiorca raportu", "opis": "Kto czyta, np. „dyrektor regionalny, lubi krótko, w punktach”."}], "prompt": "Jesteś doświadczoną HR business partnerką w polskiej firmie, która przygotowuje rzetelne rekomendacje kandydatów dla managerów. Przygotuj raport z procesu rekrutacji.\n\nDANE:\nStanowisko: [STANOWISKO]\nKandydaci: [KANDYDAT (KOD)]\nNotatki z rozmów: [NOTATKI Z ROZMÓW]\nWyniki zadań i referencje: [WYNIKI ZADAŃ I REFERENCJE]\nKryteria decyzji: [KRYTERIA DECYZJI]\nOdbiorca: [ODBIORCA RAPORTU]\n\nZASADY:\n1. Jeśli brakuje istotnych danych (np. wyników któregoś etapu albo wag kryteriów), zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie dopisuj ocen, osiągnięć ani faktów, których nie ma w notatkach – luki oznacz [DO UZUPEŁNIENIA], interpretacje [ZAŁOŻENIE].\n2. Każda mocna strona i każde ryzyko musi mieć dowód z procesu: cytat, przykład z rozmowy, wynik zadania lub referencję.\n3. Oceniaj tylko kryteria związane z pracą. Pomiń i usuń z raportu wszelkie uwagi o wieku, płci, wyglądzie, rodzinie, zdrowiu, pochodzeniu czy „pasowaniu do klimatu” bez konkretów.\n4. Używaj kodów kandydatów. Nie wpisuj danych osobowych ani danych wrażliwych.\n5. Ryzyka opisz rzeczowo i dodaj, jak je zmniejszyć (np. onboarding, cele na okres próbny).\n6. Rekomendacja jest wskazówką – decyzję podejmuje manager. Tam, gdzie wynik jest niejednoznaczny, oznacz [DO WERYFIKACJI].\n\nFORMAT WYNIKU:\nA) Podsumowanie w 3 zdaniach: kogo rekomendujesz i dlaczego.\nB) Tabela: kryterium – waga – ocena każdego kandydata – dowód.\nC) Mocne strony i ryzyka każdego kandydata z planem ich ograniczenia.\nD) Propozycja celów na okres próbny dla rekomendowanej osoby.\nE) Lista „sprawdź przed wysłaniem”: założenia, luki, brakujące dowody.", "polecenia": ["Skróć raport do jednej strony dla zarządu.", "Przygotuj wersję jako wiadomość na Teams lub Slack.", "Dodaj scenariusz: co, jeśli rekomendowana osoba odrzuci ofertę.", "Usuń z raportu wszystko, co nie ma dowodu w notatkach.", "Przygotuj 5 pytań do rozmowy referencyjnej dla finalisty.", "Zrób porównanie kandydatów w formie tabeli z kolorami.", "Napisz plan onboardingu na pierwsze 30 dni dla rekomendowanej osoby.", "Przetłumacz raport na angielski dla managera z centrali.", "Wskaż, które oceny mogą wynikać z efektu pierwszego wrażenia.", "Przygotuj uzasadnienie decyzji do dokumentacji procesu."], "checklista": ["Każda ocena ma konkretny dowód z rozmowy, zadania lub referencji.", "Raport nie zawiera danych osobowych ani wrażliwych – tylko kody kandydatów.", "Brak uwag o wieku, płci, wyglądzie, rodzinie, zdrowiu czy pochodzeniu.", "Kryteria i wagi są te same dla wszystkich finalistów.", "Referencje zebrano za zgodą kandydata.", "Wynagrodzenie proponowane finaliście mieści się w przedziale z ogłoszenia.", "Decyzję podejmuje manager – raport jest wsparciem, a nie wyrokiem."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie i managera. Raport może zostać przejrzany w razie zarzutu dyskryminacji, więc przechowuj go razem z dokumentacją procesu i tylko tak długo, jak przewiduje klauzula informacyjna."}, {"id": "1.08", "nazwa": "Informacja zwrotna i odmowy dla kandydatów", "co_robi": "Pisze odmowy i informacje zwrotne dla kandydatów na każdym etapie procesu – z szacunkiem, konkretnie i bez sformułowań, które mogłyby rodzić ryzyko prawne. Pomaga dbać o doświadczenie kandydata i employer branding.", "kiedy": "Gdy proces się zamknął, a kilkunastu osobom trzeba odpisać w taki sposób, żeby chciały aplikować do Was ponownie.", "brief": [{"pole": "Etap procesu", "opis": "Na którym etapie odpada kandydat, np. „po selekcji CV”, „po pierwszej rozmowie”, „finalista po zadaniu”."}, {"pole": "Stanowisko", "opis": "Nazwa roli, np. „Specjalista/Specjalistka ds. kadr i płac”."}, {"pole": "Powód decyzji", "opis": "Rzeczowy powód związany z wymaganiami, np. „mniejsze doświadczenie w rozliczaniu list płac dla 200+ osób niż u wybranej osoby”."}, {"pole": "Mocne strony kandydata", "opis": "Co warto docenić, np. „bardzo dobra znajomość Płatnika, świetnie przygotowane zadanie z ewidencji czasu pracy”."}, {"pole": "Kanał i ton", "opis": "Mail, telefon, wiadomość w ATS i ton, np. „mail, ciepło, na Pani/Pan”."}, {"pole": "Dalszy kontakt", "opis": "Czy chcesz utrzymać kontakt, np. „tak – zapytaj o zgodę na przyszłe rekrutacje”."}], "prompt": "Jesteś doświadczoną rekruterką w polskiej firmie, dbającą o candidate experience i bezpieczeństwo prawne komunikacji. Przygotuj informację zwrotną dla kandydata, który nie przechodzi dalej.\n\nDANE:\nEtap procesu: [ETAP PROCESU]\nStanowisko: [STANOWISKO]\nPowód decyzji: [POWÓD DECYZJI]\nMocne strony kandydata: [MOCNE STRONY KANDYDATA]\nKanał i ton: [KANAŁ I TON]\nDalszy kontakt: [DALSZY KONTAKT]\n\nZASADY:\n1. Jeśli brakuje istotnych danych (np. powodu decyzji albo etapu), zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj powodów, ocen ani obietnic – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Powód odmowy opieraj wyłącznie na wymaganiach stanowiska i porównaniu z kryteriami. Nigdy nie wspominaj o wieku, płci, rodzinie, zdrowiu, pochodzeniu, akcencie, wyglądzie ani „niedopasowaniu do zespołu” bez konkretów.\n3. Nie obiecuj przyszłej pracy ani kontaktu, którego nie planujemy. Nie podawaj informacji o innych kandydatach.\n4. Długość i szczegółowość dopasuj do etapu: po CV krótko, po rozmowie i zadaniu – konkretny feedback z 1–2 mocnymi stronami i 1–2 obszarami do rozwoju.\n5. Pytanie o zgodę na przyszłe rekrutacje formułuj jako osobną, dobrowolną zgodę – oznacz jej treść [DO WERYFIKACJI] z osobą od RODO.\n6. Pisz po ludzku, bez korpomowy i bez zbędnych przeprosin.\n\nFORMAT WYNIKU:\nA) Gotowa wiadomość do skopiowania (z tematem, jeśli to mail).\nB) Wersja krótka – 3 zdania.\nC) Notatka do rozmowy telefonicznej: co powiedzieć, czego nie mówić.\nD) Odpowiedź, gdy kandydat poprosi o szczegółowe uzasadnienie lub się odwoła.\nE) Lista „sprawdź przed wysłaniem”.", "polecenia": ["Przygotuj szablon zbiorczej odmowy po selekcji CV.", "Zmień ton na cieplejszy, bo kandydatka była w finale.", "Napisz wersję na Ty dla branży IT.", "Przygotuj wersję prostym językiem dla kandydata z Ukrainy.", "Przetłumacz wiadomość na angielski.", "Dodaj propozycję polecenia kandydata do innej otwartej rekrutacji.", "Sprawdź, czy w tekście nie ma sformułowań ryzykownych prawnie.", "Przygotuj odpowiedź na negatywny komentarz kandydata w sieci.", "Skróć wiadomość do formatu SMS.", "Napisz wiadomość do kandydata, który sam zrezygnował z procesu."], "checklista": ["Powód odmowy odnosi się tylko do wymagań stanowiska.", "Brak odniesień do wieku, płci, rodziny, zdrowia, pochodzenia czy wyglądu.", "Wiadomość nie zawiera informacji o innych kandydatach.", "Nie ma obietnic, których firma nie dotrzyma.", "Zgoda na przyszłe rekrutacje jest osobna, dobrowolna i zgodna z klauzulą RODO.", "Dane kandydata zostaną usunięte zgodnie z klauzulą informacyjną, jeśli nie ma zgody.", "Odpowiedzi na odwołania lub skargi skonsultowane z kadrami/prawnikiem."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Każda pisemna odmowa może stać się dowodem, więc unikaj ocen osoby i trzymaj się kryteriów stanowiska."}, {"id": "1.09", "nazwa": "Propozycja zatrudnienia (oferta)", "co_robi": "Przygotowuje list ofertowy i mail z propozycją zatrudnienia: wynagrodzenie, forma umowy, okres próbny, benefity, data startu i kolejne kroki. Jasno oddziela to, co jest propozycją, od tego, co znajdzie się w umowie.", "kiedy": "Gdy manager zaakceptował kandydatkę i chcesz wysłać ofertę jeszcze dziś, zanim przyjmie inną propozycję.", "brief": [{"pole": "Stanowisko i kandydat", "opis": "Rola i forma zwracania się, np. „Specjalistka ds. zakupów, kandydatka A-05, zwracamy się per Pani”."}, {"pole": "Wynagrodzenie", "opis": "Kwota i składniki, np. „8 500 zł brutto miesięcznie + premia roczna do 1 pensji wg regulaminu premiowania”."}, {"pole": "Forma umowy i wymiar", "opis": "Umowa o pracę, B2B lub zlecenie, etat, np. „umowa o pracę, pełny etat, po okresie próbnym na czas nieokreślony”."}, {"pole": "Okres próbny i start", "opis": "Długość i data, np. „okres próbny 3 miesiące, start 1 grudnia”."}, {"pole": "Benefity", "opis": "Co dokładnie dostaje, np. „opieka medyczna, karta sportowa z dopłatą, PPK, laptop i telefon”."}, {"pole": "Warunki dodatkowe", "opis": "Termin odpowiedzi, miejsce, tryb pracy, np. „odpowiedź do piątku, biuro w Gdańsku, hybrydowo 3/2”."}], "prompt": "Jesteś doświadczoną specjalistką HR w polskiej firmie, która przygotowuje jasne i uczciwe propozycje zatrudnienia. Napisz ofertę dla wybranej osoby.\n\nDANE:\nStanowisko i kandydat: [STANOWISKO I KANDYDAT]\nWynagrodzenie: [WYNAGRODZENIE]\nForma umowy i wymiar: [FORMA UMOWY I WYMIAR]\nOkres próbny i start: [OKRES PRÓBNY I START]\nBenefity: [BENEFITY]\nWarunki dodatkowe: [WARUNKI DODATKOWE]\n\nZASADY:\n1. Jeśli brakuje istotnych danych (np. kwoty, formy umowy, daty startu, terminu odpowiedzi), zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj kwot, benefitów, terminów ani zapisów umowy – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Wynagrodzenie podaj jednoznacznie: kwota, brutto/netto, okres, składniki stałe i zmienne. Dla B2B zaznacz, że to stawka netto plus VAT, a dla umowy zlecenia – stawka i sposób rozliczenia.\n3. Wynagrodzenie musi mieścić się w przedziale przekazanym kandydatowi w procesie – jeśli z danych wynika inaczej, oznacz to [DO WERYFIKACJI].\n4. Wyjaśnij krótko różnice wynikające z formy umowy (urlop, składki, okres wypowiedzenia) ogólnie, bez kwot i terminów z pamięci – szczegóły oznacz [DO WERYFIKACJI] z kadrami.\n5. Oferta nie jest umową: dodaj zdanie, że wiążące warunki określi umowa, a przed startem kandydat dostanie informacje o badaniach wstępnych i szkoleniu BHP wstępnym.\n6. Ton ciepły i profesjonalny, bez presji czasu ponad podany termin.\n\nFORMAT WYNIKU:\nA) Mail z propozycją zatrudnienia – gotowy do wysłania.\nB) List ofertowy w formie dokumentu: tabela warunków.\nC) Lista dokumentów i kroków przed pierwszym dniem pracy.\nD) Odpowiedzi na 3 typowe pytania kandydata (negocjacje, start, praca zdalna).\nE) Lista „sprawdź przed wysłaniem”: założenia i luki.", "polecenia": ["Przygotuj wersję oferty na B2B zamiast umowy o pracę.", "Napisz odpowiedź na kontrofertę kandydata o 10% wyższą.", "Skróć mail do 5 zdań.", "Przygotuj wersję po angielsku.", "Napisz wersję prostym językiem dla kandydata z Ukrainy.", "Dodaj sekcję o pierwszym dniu i onboardingu.", "Przygotuj notatkę do rozmowy telefonicznej z ofertą.", "Napisz mail z potwierdzeniem przyjęcia oferty i kolejnymi krokami.", "Przygotuj uprzejme wycofanie się z rozmów, jeśli kandydat zwleka.", "Porównaj w tabeli umowę o pracę, B2B i zlecenie dla tej roli."], "checklista": ["Kwota, brutto/netto i składniki wynagrodzenia są jednoznaczne i zatwierdzone.", "Wynagrodzenie mieści się w przedziale podanym kandydatowi w procesie.", "Forma umowy odpowiada faktycznemu charakterowi pracy – sprawdzone z kadrami.", "Okres próbny, data startu i wymiar etatu zgadzają się z planem kadr.", "Benefity są aktualne i opisane dokładnie tak, jak w polityce firmy.", "Oferta jasno mówi, że wiążące warunki określi umowa.", "Dokument zweryfikowany przez kadry lub prawnika, bo ma skutki prawne."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Wysłana oferta buduje oczekiwania kandydata, więc każda kwota i każdy benefit muszą być potwierdzone przez kadry przed wysłaniem."}, {"id": "1.10", "nazwa": "Metryki rekrutacji i raport dla zarządu", "co_robi": "Liczy i porządkuje kluczowe wskaźniki rekrutacji: time to hire, time to fill, cost per hire, skuteczność źródeł, lejek i jakość zatrudnienia. Zamienia dane z arkusza w czytelny raport z wnioskami i rekomendacjami dla zarządu.", "kiedy": "Gdy zbliża się kwartalne spotkanie z zarządem i musisz pokazać, ile kosztuje rekrutacja, co działa i gdzie przepalacie budżet.", "brief": [{"pole": "Okres i zakres", "opis": "Za jaki czas i jakie rekrutacje, np. „III kwartał, 14 zamkniętych rekrutacji, cała firma”."}, {"pole": "Dane z procesów", "opis": "Daty i liczby z ATS lub arkusza, np. „data otwarcia, data aplikacji wybranej osoby, data przyjęcia oferty, liczba kandydatów na etapach”."}, {"pole": "Koszty rekrutacji", "opis": "Koszty zewnętrzne i wewnętrzne, np. „Pracuj.pl 9 600 zł, LinkedIn 4 200 zł, agencja 18 000 zł, czas HR ok. 120 h”."}, {"pole": "Źródła kandydatów", "opis": "Skąd przyszli zatrudnieni, np. „Pracuj.pl 6, polecenia 4, LinkedIn 2, agencja 1, OLX Praca 1”."}, {"pole": "Cele i benchmarki", "opis": "Do czego porównujesz, np. „cel: time to hire do 30 dni; poprzedni kwartał 41 dni”."}, {"pole": "Odbiorca raportu", "opis": "Kto czyta i czego oczekuje, np. „zarząd – 1 strona, decyzja o budżecie na Q4”."}], "prompt": "Jesteś doświadczoną analityczką HR w polskiej firmie z sektora MŚP, która przygotowuje raporty rekrutacyjne dla zarządu. Policz metryki i przygotuj raport z wnioskami.\n\nDANE:\nOkres i zakres: [OKRES I ZAKRES]\nDane z procesów: [DANE Z PROCESÓW]\nKoszty rekrutacji: [KOSZTY REKRUTACJI]\nŹródła kandydatów: [ŹRÓDŁA KANDYDATÓW]\nCele i benchmarki: [CELE I BENCHMARKI]\nOdbiorca raportu: [ODBIORCA RAPORTU]\n\nZASADY:\n1. Jeśli brakuje istotnych danych (np. dat, kosztów, liczby kandydatów na etapach), zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj liczb ani benchmarków rynkowych – luki oznacz [DO UZUPEŁNIENIA], przyjęte definicje i szacunki [ZAŁOŻENIE].\n2. Na początku podaj definicje: time to hire (od aplikacji wybranej osoby do przyjęcia oferty), time to fill (od otwarcia rekrutacji do przyjęcia oferty), cost per hire (koszty zewnętrzne i wewnętrzne podzielone przez liczbę zatrudnień). Jeśli liczę inaczej, dopasuj się do moich danych i to zaznacz.\n3. Pokaż obliczenia krok po kroku, żeby dało się je sprawdzić w Excelu.\n4. Jakość zatrudnienia oceniaj tylko na danych, które podałam (np. przejście okresu próbnego, rotacja do 6 miesięcy) – jeśli ich nie ma, zaproponuj, co mierzyć.\n5. Raport nie może zawierać danych osobowych kandydatów ani pracowników – tylko dane zbiorcze.\n6. Wnioski oddziel od faktów. Rekomendacje budżetowe oznacz jako propozycje do decyzji zarządu.\n\nFORMAT WYNIKU:\nA) Tabela metryk: wskaźnik – wartość – cel – zmiana – komentarz.\nB) Lejek rekrutacyjny: liczba osób na każdym etapie i konwersja.\nC) Skuteczność źródeł: koszt, liczba zatrudnień, koszt na zatrudnienie.\nD) Raport dla zarządu na 1 stronę: 3 wnioski, 3 rekomendacje.\nE) Lista „sprawdź przed prezentacją”: założenia, luki i miejsca do weryfikacji.", "polecenia": ["Przygotuj z tego 3 slajdy na spotkanie zarządu.", "Zrób wersję jako krótką wiadomość na Teams dla prezesa.", "Policz metryki osobno dla stanowisk biurowych i produkcyjnych.", "Zaproponuj, jak przenieść budżet między źródłami w kolejnym kwartale.", "Przygotuj formuły do Excela, które liczą te wskaźniki automatycznie.", "Dodaj wykres lejka opisany słownie, do odtworzenia w Excelu.", "Wskaż 3 największe wąskie gardła w procesie.", "Przygotuj szablon miesięcznego raportu do wypełniania.", "Przetłumacz raport na angielski dla właściciela z zagranicy.", "Dodaj sekcję ryzyk: co się stanie, jeśli nic nie zmienimy."], "checklista": ["Definicje wskaźników są podane i spójne z tym, jak liczyliście wcześniej.", "Obliczenia sprawdzone w arkuszu – liczby z AI zgadzają się z danymi źródłowymi.", "Koszty zawierają zarówno wydatki zewnętrzne, jak i szacunek czasu pracy HR i managerów.", "Raport zawiera wyłącznie dane zbiorcze, bez danych osobowych kandydatów.", "Wnioski są oddzielone od faktów, a szacunki oznaczone jako założenia.", "Rekomendacje budżetowe skonsultowane z finansami przed spotkaniem.", "Wszystkie [DO UZUPEŁNIENIA] i [ZAŁOŻENIE] wyjaśnione przed prezentacją."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. AI może pomylić się w rachunkach, więc każdą liczbę, którą pokażesz zarządowi, przelicz w arkuszu."}]}, {"dzial_nr": 2, "dzial": "Zarządzanie wynikami", "opis": "Cały cykl ocen okresowych — od harmonogramu i modelu kompetencji, przez formularz, 9-box i kalibrację, po rozmowy feedbackowe, plany rozwoju i raport dla zarządu. Podajesz fakty i zasady swojej firmy, dostajesz gotowe narzędzia i teksty do sprawdzenia.", "skills": [{"id": "2.01", "nazwa": "Cykl oceny okresowej: harmonogram, role i komunikacja", "co_robi": "Projektuje cały cykl oceny okresowej w Twojej firmie: etapy, terminy, kto za co odpowiada i jak o tym komunikować. Dostajesz gotowy harmonogram, macierz ról i teksty maili do pracowników i menedżerów.", "kiedy": "Gdy zarząd mówi „w tym roku robimy oceny porządnie”, a Ty masz kilka tygodni, żeby ułożyć proces, który menedżerowie faktycznie przejdą do końca.", "brief": [{"pole": "Firma i liczba pracowników", "opis": "Branża, wielkość, struktura, np. „firma produkcyjna, 140 osób, 9 kierowników zespołów, 2 lokalizacje”."}, {"pole": "Cel oceny", "opis": "Do czego mają służyć wyniki, np. „decyzje o podwyżkach w marcu i plany rozwojowe, a nie zwolnienia”."}, {"pole": "Okres i termin", "opis": "Za jaki okres i do kiedy, np. „ocena za 2026, zamknięcie do 28 lutego 2027”."}, {"pole": "Zasady w regulaminie", "opis": "Co mówi regulamin pracy lub wewnętrzna procedura, np. „regulamin przewiduje ocenę raz w roku, wzór formularza w załączniku 4” albo „brak zapisów”."}, {"pole": "Narzędzia", "opis": "Gdzie odbywa się proces, np. „formularze w Excelu, komunikacja przez Teams, brak systemu HR”."}, {"pole": "Doświadczenia z poprzednich lat", "opis": "Co nie działało, np. „połowa menedżerów oddała oceny po terminie, pracownicy nie dostali feedbacku”."}], "prompt": "Jesteś doświadczoną HR business partnerką w polskiej firmie z sektora MŚP, która wdrażała procesy ocen okresowych od zera. Zaprojektuj ze mną cykl oceny okresowej, który da się realnie przeprowadzić.\n\nDANE:\nFirma i liczba pracowników: [FIRMA I LICZBA PRACOWNIKÓW]\nCel oceny: [CEL OCENY]\nOkres i termin: [OKRES I TERMIN]\nZasady w regulaminie lub procedurze: [ZASADY W REGULAMINIE]\nNarzędzia: [NARZĘDZIA]\nDoświadczenia z poprzednich lat: [DOŚWIADCZENIA Z POPRZEDNICH LAT]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj na odpowiedź. Nie wymyślaj terminów, liczb ani zasad firmy. Luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Jeśli firma ma zasady oceny w regulaminie pracy lub wewnętrznej procedurze, harmonogram i role muszą być z nimi zgodne. Każdą rozbieżność między moim pomysłem a regulaminem wypisz wprost i oznacz [DO WERYFIKACJI] z kadrami lub prawnikiem.\n3. Harmonogram układaj od terminu końcowego wstecz, z buforem na spóźnienia i kalibrację.\n4. Proces ma być prosty dla menedżera: jasne „co, do kiedy, w jakim narzędziu”.\n5. Uwzględnij osoby nieobecne w okresie oceny (urlop rodzicielski, długie L4, nowe osoby w okresie próbnym) i zaproponuj, jak je traktować, oznaczając to [DO WERYFIKACJI].\n6. Komunikacja ma być ciepła, konkretna i wyjaśniać, po co jest ocena i jak zostaną wykorzystane wyniki.\n\nFORMAT WYNIKU:\nA) Harmonogram w tabeli: etap, termin, odpowiedzialny, rezultat.\nB) Macierz ról (pracownik, menedżer, HR, zarząd) w układzie RACI.\nC) Trzy gotowe wiadomości: ogłoszenie startu do wszystkich, instrukcja dla menedżerów, przypomnienie przed terminem.\nD) Lista ryzyk procesu i sposób ich ograniczenia.\nE) Lista „sprawdź przed użyciem”: założenia, luki i miejsca do weryfikacji z regulaminem.", "polecenia": ["Skróć harmonogram do 6 tygodni i pokaż, co musi się wtedy zmienić.", "Przygotuj wersję komunikatu na Teams lub Slacka, maksymalnie 5 zdań.", "Napisz jednostronicową ściągę dla menedżera: krok po kroku, co robi i kiedy.", "Dodaj etap samooceny pracownika i dopasuj do niego terminy.", "Przygotuj prezentację procesu dla zarządu w 5 punktach.", "Zrób FAQ dla pracowników: 8 najczęstszych pytań o ocenę z odpowiedziami.", "Przetłumacz komunikat startowy na angielski dla zespołu międzynarodowego.", "Przygotuj wersję komunikatu prostym językiem dla pracowników z Ukrainy.", "Dodaj plan przypomnień dla spóźnialskich menedżerów z eskalacją.", "Wypisz wskaźniki, po których za rok sprawdzę, czy proces zadziałał."], "checklista": ["Harmonogram i zasady są zgodne z regulaminem pracy lub procedurą oceny, jeśli firma takie ma.", "Każdy etap ma właściciela i realny termin z buforem.", "Pracownicy wiedzą, po co jest ocena i jak zostaną wykorzystane wyniki.", "Ustalono, jak traktować osoby nieobecne i nowe w okresie oceny.", "Kryteria są jednakowe dla porównywalnych stanowisk — zasada równego traktowania.", "Wiadomości nie zawierają danych osobowych konkretnych pracowników.", "Jeśli zasady oceny mają skutki dla wynagrodzeń lub zatrudnienia, proces sprawdzono z kadrami lub prawnikiem."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Jeśli ocena okresowa jest opisana w regulaminie pracy, to regulamin, a nie propozycja AI, wyznacza obowiązujące zasady."}, {"id": "2.02", "nazwa": "Model kompetencji z poziomami i wskaźnikami behawioralnymi", "co_robi": "Buduje model kompetencji dopasowany do Twojej firmy: definicje, poziomy i obserwowalne zachowania dla każdego poziomu. Model nadaje się od razu do ocen, rekrutacji i planów rozwoju.", "kiedy": "Gdy w formularzu oceny są ogólniki typu „komunikatywność: 1–5”, a menedżerowie każdą ocenę rozumieją inaczej.", "brief": [{"pole": "Firma i wartości", "opis": "Branża i wartości firmy, np. „software house, 60 osób; wartości: odpowiedzialność, współpraca, klient na pierwszym miejscu”."}, {"pole": "Grupy stanowisk", "opis": "Dla kogo model, np. „specjaliści, liderzy zespołów, kierownicy działów”."}, {"pole": "Lista kompetencji", "opis": "Kompetencje do opisania albo prośba o propozycję, np. „komunikacja, rozwiązywanie problemów, współpraca, orientacja na klienta, zarządzanie zespołem”."}, {"pole": "Liczba poziomów", "opis": "Ile poziomów biegłości, np. „4 poziomy: podstawowy, samodzielny, zaawansowany, ekspercki”."}, {"pole": "Zastosowanie", "opis": "Gdzie model będzie używany, np. „ocena roczna i rozmowy rekrutacyjne”."}], "prompt": "Jesteś doświadczoną konsultantką HR w polskiej firmie doradczej, specjalizującą się w modelach kompetencji dla MŚP. Zbuduj ze mną model kompetencji, który menedżerowie zrozumieją bez szkolenia.\n\nDANE:\nFirma i wartości: [FIRMA I WARTOŚCI]\nGrupy stanowisk: [GRUPY STANOWISK]\nLista kompetencji: [LISTA KOMPETENCJI]\nLiczba poziomów: [LICZBA POZIOMÓW]\nZastosowanie: [ZASTOSOWANIE]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj na odpowiedź. Nie wymyślaj wartości firmy ani stanowisk. Luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Maksymalnie 8 kompetencji. Jeśli podam więcej, zaproponuj połączenie lub wybór i uzasadnij.\n3. Każda kompetencja ma definicję w jednym zdaniu i dla każdego poziomu 3–4 wskaźniki behawioralne: obserwowalne zachowania, opisane czasownikami („przygotowuje”, „uprzedza”, „proponuje”), bez ocen charakteru i cech osobowości.\n4. Poziomy muszą się wyraźnie różnić zakresem samodzielności, wpływu i złożoności, a nie tylko słowami „lepiej”, „bardziej”.\n5. Wskaźniki muszą być neutralne — bez odniesień do wieku, płci, stanu zdrowia, rodzicielstwa ani dyspozycyjności po godzinach — zgodnie z zasadą równego traktowania.\n6. Dodaj przykłady zachowań negatywnych (czego nie robimy), żeby ułatwić rozróżnianie poziomów.\n\nFORMAT WYNIKU:\nA) Lista kompetencji z definicjami.\nB) Tabela dla każdej kompetencji: poziom, wskaźniki behawioralne, zachowania negatywne.\nC) Mapa: które kompetencje i na jakim poziomie oczekiwanym dla każdej grupy stanowisk.\nD) Krótka instrukcja dla menedżera, jak używać modelu w ocenie.\nE) Lista „sprawdź przed użyciem”: założenia, luki i wskaźniki do konsultacji z menedżerami.", "polecenia": ["Uprość wskaźniki tak, żeby każdy mieścił się w jednej linijce.", "Dodaj kompetencję „praca zdalna i hybrydowa” z czterema poziomami.", "Przygotuj pytania rekrutacyjne behawioralne do każdej kompetencji.", "Zrób wersję modelu tylko dla stanowisk produkcyjnych, prostszym językiem.", "Sprawdź, czy któryś wskaźnik nie jest dyskryminujący lub niejasny.", "Zrób z modelu tabelę do Excela: kompetencja, poziom, wskaźnik.", "Przetłumacz model na angielski dla zespołu międzynarodowego.", "Przygotuj prezentację modelu dla zarządu w 5 slajdach tekstowych.", "Zaproponuj warsztat 2 h dla menedżerów, na którym zweryfikujemy model.", "Połącz kompetencje z wartościami firmy w jednej tabeli."], "checklista": ["Każdy wskaźnik opisuje obserwowalne zachowanie, a nie cechę charakteru.", "Poziomy wyraźnie różnią się zakresem samodzielności i wpływu.", "Brak kryteriów pośrednio dyskryminujących (wiek, płeć, zdrowie, rodzicielstwo, dyspozycyjność).", "Model przetestowano z co najmniej 2–3 menedżerami na prawdziwych przykładach.", "Oczekiwane poziomy dla stanowisk są realne i spójne z opisami stanowisk.", "Nazwy stanowisk i opisy są neutralne płciowo.", "Jeśli model ma wpływać na wynagrodzenia, sprawdzono jego spójność z regulaminem wynagradzania."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Model kompetencji działa dopiero wtedy, gdy menedżerowie rozpoznają w nim zachowania swoich ludzi, więc skonsultuj go przed wdrożeniem."}, {"id": "2.03", "nazwa": "Wybór metody oceny: MBO, OKR, 180°/360°, skale", "co_robi": "Porównuje metody oceny pracowników i rekomenduje tę, która pasuje do wielkości, kultury i dojrzałości Twojej firmy. Pokazuje koszty, ryzyka i plan wdrożenia wybranego rozwiązania.", "kiedy": "Gdy prezes przeczytał o OKR-ach albo ocenie 360°, a Ty musisz rzetelnie ocenić, czy to ma sens w firmie na 40 osób.", "brief": [{"pole": "Firma i wielkość", "opis": "Branża, liczba osób, struktura, np. „e-commerce, 45 osób, płaska struktura, 4 zespoły”."}, {"pole": "Obecny sposób oceny", "opis": "Co jest teraz, np. „brak formalnej oceny, rozmowy roczne bez formularza”."}, {"pole": "Cele oceny", "opis": "Co ma dać ocena, np. „powiązanie premii z wynikami i rozwój liderów”."}, {"pole": "Zasoby HR", "opis": "Kto i czym obsłuży proces, np. „jednoosobowy dział HR, Excel i Google Forms”."}, {"pole": "Rozważane metody", "opis": "Co bierzesz pod uwagę, np. „OKR i ocena 360°”."}], "prompt": "Jesteś doświadczonym ekspertem ds. zarządzania wynikami, który doradza polskim firmom z sektora MŚP. Pomóż mi wybrać metodę oceny pracowników dopasowaną do realiów mojej firmy.\n\nDANE:\nFirma i wielkość: [FIRMA I WIELKOŚĆ]\nObecny sposób oceny: [OBECNY SPOSÓB OCENY]\nCele oceny: [CELE OCENY]\nZasoby HR: [ZASOBY HR]\nRozważane metody: [ROZWAŻANE METODY]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj na odpowiedź. Nie wymyślaj kosztów, statystyk ani wyników badań. Luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Porównaj co najmniej: MBO, OKR, ocenę 180° i 360°, ocenę opartą na skali kompetencji oraz model mieszany. Opisz każdą metodę jednym zdaniem zrozumiałym dla zarządu.\n3. Oceniaj realnie: nakład pracy menedżerów i HR, wymaganą dojrzałość organizacji, ryzyko „odhaczenia” procesu, ryzyko konfliktów przy anonimowym feedbacku.\n4. Nie rekomenduj metody tylko dlatego, że jest modna. Jeśli firma nie jest gotowa, zaproponuj etap pośredni.\n5. Jeśli wyniki mają wpływać na premie lub wynagrodzenia, zaznacz potrzebę spójności z regulaminem wynagradzania i oznacz to [DO WERYFIKACJI] z kadrami lub prawnikiem.\n6. Weź pod uwagę równe traktowanie: metoda ma pozwalać porównywać ludzi według tych samych kryteriów.\n\nFORMAT WYNIKU:\nA) Tabela porównawcza: metoda, na czym polega, dla kogo, nakład pracy, ryzyka, dopasowanie do mojej firmy (niskie/średnie/wysokie).\nB) Rekomendacja z uzasadnieniem w 5 zdaniach.\nC) Plan wdrożenia w 3 etapach na 6–12 miesięcy.\nD) Argumenty dla zarządu: 5 punktów za i 3 możliwe zastrzeżenia z odpowiedziami.\nE) Lista „sprawdź przed użyciem”: założenia i luki.", "polecenia": ["Przygotuj krótką notatkę dla zarządu z rekomendacją na jedną stronę.", "Rozpisz szczegółowo wdrożenie OKR na pierwszy kwartał.", "Porównaj koszty czasowe dla menedżera w każdej metodzie w godzinach rocznie.", "Zaprojektuj pilotaż oceny 360° tylko dla liderów zespołów.", "Dodaj ryzyka prawne i kadrowe każdej metody do weryfikacji.", "Wyjaśnij wybraną metodę pracownikom w maksymalnie 6 zdaniach.", "Przygotuj wersję na Teams lub Slacka z ankietą dla menedżerów.", "Pokaż, jak połączyć ocenę kompetencji z celami w jednym procesie.", "Przetłumacz rekomendację na angielski dla właściciela spoza Polski.", "Zrób listę pytań, które powinnam zadać dostawcom systemów HR."], "checklista": ["Rekomendacja uwzględnia realne zasoby HR i czas menedżerów.", "Porównanie nie zawiera wymyślonych statystyk ani źródeł.", "Wybrana metoda stosuje te same kryteria do porównywalnych stanowisk — równe traktowanie.", "Przy feedbacku 360° zaplanowano anonimowość i minimalizację danych zgodnie z RODO.", "Powiązanie z premiami sprawdzono z regulaminem wynagradzania.", "Plan wdrożenia ma pilotaż i punkt decyzji o kontynuacji.", "Jeśli zmiana metody wpływa na zasady pracy lub wynagrodzeń, zweryfikowano ją z kadrami lub prawnikiem."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Najlepsza metoda to ta, którą Twoi menedżerowie faktycznie przeprowadzą — prostsza i dokończona wygrywa z ambitną i porzuconą."}, {"id": "2.04", "nazwa": "Formularz oceny okresowej ze skalą i opisami poziomów", "co_robi": "Tworzy gotowy formularz oceny okresowej: sekcje, kryteria, skalę z opisami każdego poziomu i miejsce na komentarze oraz cele. Formularz jest gotowy do przeniesienia do Worda, Excela lub Google Forms.", "kiedy": "Gdy obecny formularz to tabelka z cyframi 1–5 bez opisów, a każdy menedżer ocenia według własnej skali.", "brief": [{"pole": "Grupa stanowisk", "opis": "Dla kogo formularz, np. „pracownicy biurowi i specjaliści, bez kadry kierowniczej”."}, {"pole": "Kryteria oceny", "opis": "Co oceniamy, np. „realizacja celów, jakość pracy, współpraca, samodzielność, rozwój”."}, {"pole": "Skala", "opis": "Jaka skala, np. „5-stopniowa: od poniżej oczekiwań do znacznie powyżej oczekiwań”."}, {"pole": "Elementy dodatkowe", "opis": "Co jeszcze ma być w formularzu, np. „samoocena, cele na kolejny rok, plan rozwoju”."}, {"pole": "Wymogi regulaminu", "opis": "Czy regulamin określa wzór lub elementy oceny, np. „regulamin wymaga podpisu pracownika i możliwości odwołania”."}], "prompt": "Jesteś doświadczoną specjalistką HR w polskiej firmie, która przygotowuje narzędzia do ocen okresowych. Stwórz formularz oceny okresowej, który będzie zrozumiały dla menedżera i pracownika.\n\nDANE:\nGrupa stanowisk: [GRUPA STANOWISK]\nKryteria oceny: [KRYTERIA OCENY]\nSkala: [SKALA]\nElementy dodatkowe: [ELEMENTY DODATKOWE]\nWymogi regulaminu: [WYMOGI REGULAMINU]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj na odpowiedź. Nie wymyślaj kryteriów, których nie podałam, bez oznaczenia [ZAŁOŻENIE]. Luki oznaczaj [DO UZUPEŁNIENIA].\n2. Każdy poziom skali ma krótki opis słowny i przykład zachowania lub rezultatu, żeby różni menedżerowie oceniali tak samo.\n3. Przy każdym kryterium jest pole na uzasadnienie oceny faktami (przykłady, rezultaty), a nie ogólnikami.\n4. Formularz nie zbiera danych niepotrzebnych do oceny: bez pytań o zdrowie, sytuację rodzinną, przyczyny nieobecności — zgodnie z RODO i minimalizacją danych.\n5. Jeśli regulamin określa elementy oceny (podpisy, termin, tryb odwołania), uwzględnij je. Jeśli nie wiem, czy są wymagane, oznacz [DO WERYFIKACJI] z kadrami.\n6. Język neutralny płciowo, bez żargonu.\n\nFORMAT WYNIKU:\nA) Metryczka: dane pracownika i oceniającego (tylko niezbędne), okres oceny, data rozmowy.\nB) Opis skali w tabeli: poziom, nazwa, opis, przykład.\nC) Sekcje oceny w tabeli: kryterium, ocena, uzasadnienie faktami.\nD) Samoocena pracownika, cele na kolejny okres, plan rozwoju, komentarz pracownika, podpisy.\nE) Instrukcja wypełniania dla menedżera w 6 punktach.\nF) Lista „sprawdź przed użyciem”: założenia, luki, elementy do zgodności z regulaminem.", "polecenia": ["Zrób z formularza wersję do Google Forms: lista pytań z typem odpowiedzi.", "Przygotuj osobną wersję dla kadry kierowniczej z kryterium zarządzania zespołem.", "Skróć formularz tak, żeby wypełnienie zajmowało maksymalnie 20 minut.", "Dodaj sekcję oceny celów z wagami procentowymi.", "Przygotuj wersję formularza samooceny dla pracownika.", "Sprawdź, czy opisy poziomów nie są nakładające się lub niejasne.", "Przetłumacz formularz na angielski.", "Przygotuj wersję prostym językiem dla pracowników z Ukrainy.", "Dodaj sekcję „mocne strony i obszary do rozwoju” z podpowiedziami.", "Napisz maila do menedżerów z formularzem i instrukcją."], "checklista": ["Każdy poziom skali ma opis i przykład — menedżerowie rozumieją go tak samo.", "Formularz nie zbiera danych o zdrowiu, rodzinie ani innych danych zbędnych do oceny (RODO).", "Kryteria są jednakowe dla porównywalnych stanowisk — równe traktowanie.", "Jest miejsce na komentarz pracownika i ewentualne odwołanie, jeśli przewiduje to regulamin.", "Język jest neutralny płciowo i zrozumiały bez instrukcji.", "Formularz przetestowano na 1–2 osobach przed wysyłką do wszystkich.", "Jeśli ocena ma skutki dla wynagrodzenia lub zatrudnienia, formularz sprawdziły kadry lub prawnik."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Jeśli wzór oceny jest określony w regulaminie pracy, nowy formularz musi być z nim zgodny albo regulamin trzeba zmienić w przewidzianym trybie."}, {"id": "2.05", "nazwa": "Matryca 9-box: potencjał × wyniki na podstawie danych", "co_robi": "Pomaga umieścić pracowników w matrycy 9-box na podstawie danych z ocen, a nie przeczuć. Każde przypisanie ma uzasadnienie dowodami, a wynik służy do planowania rozwoju i sukcesji, nie do etykietowania ludzi.", "kiedy": "Przed przeglądem talentów lub planowaniem sukcesji, gdy zarząd pyta „kogo rozwijamy, a kogo możemy stracić”.", "brief": [{"pole": "Zespół lub dział", "opis": "Kogo dotyczy analiza, np. „dział sprzedaży, 12 osób, 2 liderów”."}, {"pole": "Dane o wynikach", "opis": "Zanonimizowane dane, np. „P01: ocena 4/5, realizacja planu 112%; P02: ocena 3/5, realizacja 94%” — bez imion i nazwisk."}, {"pole": "Dane o potencjale", "opis": "Obserwacje i fakty, np. „P01: sam przejął onboarding nowych osób, prosi o trudne projekty”."}, {"pole": "Definicja potencjału", "opis": "Jak firma rozumie potencjał, np. „gotowość do roli o poziom wyżej w ciągu 2 lat”."}, {"pole": "Cel analizy", "opis": "Do czego posłuży, np. „plan sukcesji na stanowisko kierownika sprzedaży i budżet szkoleń”."}], "prompt": "Jesteś doświadczoną HR business partnerką w polskiej firmie, która prowadzi przeglądy talentów metodą 9-box. Pomóż mi przygotować rzetelną, opartą na danych matrycę 9-box.\n\nDANE:\nZespół lub dział: [ZESPÓŁ LUB DZIAŁ]\nDane o wynikach: [DANE O WYNIKACH]\nDane o potencjale: [DANE O POTENCJALE]\nDefinicja potencjału w firmie: [DEFINICJA POTENCJAŁU]\nCel analizy: [CEL ANALIZY]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj na odpowiedź. Nie wymyślaj ocen ani faktów. Luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Pracuj wyłącznie na kodach osób (np. P01). Jeśli w danych pojawią się imiona, nazwiska lub informacje o zdrowiu czy życiu prywatnym, przypomnij o anonimizacji i ich nie wykorzystuj.\n3. Każde przypisanie do pola uzasadnij konkretnymi dowodami z danych. Gdy dowodów jest za mało, oznacz przypisanie [DO WERYFIKACJI] zamiast zgadywać.\n4. Nie opisuj ludzi etykietami („słaby”, „gwiazda”, „bez potencjału”). Opisuj sytuację i rekomendowane działanie.\n5. Potencjał oceniaj tylko na podstawie zachowań związanych z pracą. Wiek, płeć, staż, rodzicielstwo, stan zdrowia czy tryb pracy (zdalny, część etatu) nie mogą wpływać na ocenę — zasada równego traktowania. Jeśli widzisz ryzyko takiego wpływu, napisz o tym.\n6. Przypomnij, że matryca to materiał roboczy do dyskusji, a nie dokument dla pracownika.\n\nFORMAT WYNIKU:\nA) Definicje osi i 9 pól w tabeli: pole, opis sytuacji, typowe działania.\nB) Tabela przypisań: kod osoby, pole, dowody, poziom pewności, rekomendowane działanie.\nC) Wnioski dla zespołu: ryzyka odejść, luki sukcesyjne, priorytety rozwojowe.\nD) Pytania do kalibracji z menedżerami.\nE) Lista „sprawdź przed użyciem”: założenia, przypisania do weryfikacji, ryzyka biasu.", "polecenia": ["Przygotuj z matrycy materiał na sesję kalibracyjną z menedżerami.", "Pokaż tylko osoby, których przypisanie ma niską pewność, i czego brakuje.", "Zaproponuj działania rozwojowe dla każdego pola matrycy.", "Przygotuj plan sukcesji na stanowisko kluczowe na podstawie matrycy.", "Sprawdź, czy w przypisaniach nie widać wzorca związanego z płcią lub trybem pracy.", "Zrób podsumowanie dla zarządu bez danych pojedynczych osób.", "Przygotuj tabelę do Excela: kod, wyniki, potencjał, pole, działanie.", "Wypisz pytania, które menedżer powinien zadać, żeby lepiej ocenić potencjał.", "Przetłumacz definicje pól na angielski.", "Przygotuj plan ponownego przeglądu za 6 miesięcy."], "checklista": ["Do AI trafiły tylko zanonimizowane dane, bez imion, PESEL i informacji o zdrowiu (RODO).", "Każde przypisanie ma konkretne dowody, a słabo udokumentowane są oznaczone do weryfikacji.", "W opisach nie ma etykiet oceniających ludzi.", "Potencjał nie zależy od wieku, płci, stażu, rodzicielstwa ani trybu pracy — równe traktowanie.", "Matryca została skalibrowana z menedżerami, a nie przyjęta z wyniku AI.", "Dostęp do matrycy ma tylko wąskie grono osób.", "Decyzje kadrowe wynikające z matrycy zweryfikowano z kadrami lub prawnikiem."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Matryca 9-box to zdjęcie sytuacji w danym momencie, a nie wyrok — traktuj ją jako punkt wyjścia do rozmowy i rozwoju."}, {"id": "2.06", "nazwa": "Sesja kalibracyjna ocen: agenda, zasady i karta moderatora", "co_robi": "Przygotowuje sesję kalibracyjną, na której menedżerowie uzgadniają oceny według wspólnych standardów. Dostajesz agendę, zasady, kartę moderatora i listę biasów z pytaniami, które je wyłapują.", "kiedy": "Gdy jeden kierownik daje wszystkim „5”, a drugi nikomu powyżej „3”, i zbliża się decyzja o podwyżkach albo premiach.", "brief": [{"pole": "Uczestnicy", "opis": "Kto bierze udział, np. „5 kierowników działów, dyrektor operacyjny, ja jako moderatorka z HR”."}, {"pole": "Zakres ocen", "opis": "Kogo kalibrujemy, np. „62 pracowników, ocena roczna w skali 1–5”."}, {"pole": "Wstępny rozkład ocen", "opis": "Zanonimizowane dane, np. „dział A: 70% ocen 5; dział B: 10% ocen 5, 40% ocen 2”."}, {"pole": "Czas i forma", "opis": "Ile czasu i jak, np. „3 godziny, stacjonarnie w sali konferencyjnej” albo „2 × 90 min na Teams”."}, {"pole": "Skutki ocen", "opis": "Na co wpływają oceny, np. „pula podwyżek 4% i wybór osób do programu liderskiego”."}], "prompt": "Jesteś doświadczoną moderatorką sesji kalibracyjnych w polskich firmach, znającą typowe błędy oceniania. Przygotuj ze mną sesję kalibracyjną, która wyrówna standardy oceniania między menedżerami.\n\nDANE:\nUczestnicy: [UCZESTNICY]\nZakres ocen: [ZAKRES OCEN]\nWstępny rozkład ocen: [WSTĘPNY ROZKŁAD OCEN]\nCzas i forma: [CZAS I FORMA]\nSkutki ocen: [SKUTKI OCEN]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj na odpowiedź. Nie wymyślaj danych o ocenach ani osobach. Luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Sesja ma kalibrować standard, a nie wymuszać rozkład. Nie proponuj sztywnych limitów procentowych ocen, chyba że o to poproszę — wtedy opisz ryzyka.\n3. Każda zmiana oceny na sesji musi mieć uzasadnienie faktami (rezultaty, zachowania, przykłady), zapisane w notatce.\n4. Uwzględnij przeciwdziałanie biasom: efekt aureoli, efekt świeżości, łagodność i surowość, tendencja centralna, podobieństwo do oceniającego, wpływ urlopu rodzicielskiego, L4 czy pracy zdalnej na ocenę. Do każdego daj pytanie, które moderator może zadać.\n5. Materiały na sesję mają zawierać kody osób zamiast nazwisk tam, gdzie to możliwe, i być udostępnione tylko uczestnikom (RODO, poufność).\n6. Dodaj kontrolę równego traktowania: czy osoby w podobnych sytuacjach dostają podobne oceny niezależnie od płci, wieku czy trybu pracy.\n\nFORMAT WYNIKU:\nA) Agenda z czasem na każdy punkt.\nB) Zasady sesji do odczytania na początku (maks. 8 punktów).\nC) Karta moderatora: kolejność omawiania, pytania kontrolne, sposób rozstrzygania sporów.\nD) Tabela biasów: nazwa, jak go rozpoznać, pytanie moderatora.\nE) Wzór notatki z sesji: kod osoby, ocena przed, ocena po, uzasadnienie.\nF) Lista „sprawdź przed użyciem”.", "polecenia": ["Skróć agendę do 90 minut i powiedz, co pomijamy.", "Przygotuj maila zapraszającego menedżerów z instrukcją przygotowania.", "Napisz 5 zdań, którymi moderatorka może przerwać dominującego uczestnika.", "Przygotuj wersję sesji online na Teams z podziałem na dwa spotkania.", "Dodaj ćwiczenie rozgrzewkowe: kalibracja na fikcyjnym przypadku.", "Zrób podsumowanie wyników sesji dla zarządu bez danych osobowych.", "Przygotuj szablon tabeli do Excela na notatkę z sesji.", "Rozpisz, jak komunikować pracownikowi zmianę oceny po kalibracji.", "Przetłumacz zasady sesji na angielski.", "Wypisz sygnały, że sesja zamienia się w negocjacje, i jak wtedy reagować."], "checklista": ["Każda zmiana oceny ma zapisane uzasadnienie faktami.", "Sprawdzono, czy oceny nie różnią się systematycznie według płci, wieku lub trybu pracy — równe traktowanie.", "Materiały zawierają tylko niezbędne dane i trafiły wyłącznie do uczestników (RODO).", "Uczestnicy znają zasady sesji i pytania o biasy przed spotkaniem.", "Ustalono, kto komunikuje pracownikom ostateczne oceny i w jakim terminie.", "Notatka z sesji jest przechowywana zgodnie z zasadami poufności.", "Jeśli oceny wpływają na wynagrodzenie lub zatrudnienie, zasady sprawdziły kadry lub prawnik."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Kalibracja ma wyrównać miarę, a nie dopasować ludzi do z góry ustalonego rozkładu — pilnuj, żeby każda zmiana miała fakty za sobą."}, {"id": "2.07", "nazwa": "Podsumowanie oceny pracownika oparte na faktach", "co_robi": "Zamienia notatki menedżera w rzeczowe podsumowanie oceny: mocne strony, obszary do rozwoju i uzasadnienie oceny przykładami. Usuwa ogólniki, oceny osobowości i sformułowania, które mogą rodzić ryzyko prawne.", "kiedy": "Gdy menedżer przysyła Ci trzy zdania w stylu „ogólnie OK, mógłby się bardziej starać”, a podsumowanie trafi do akt i na rozmowę z pracownikiem.", "brief": [{"pole": "Stanowisko i okres", "opis": "Stanowisko i okres oceny, np. „specjalistka ds. obsługi klienta, ocena za 2026”."}, {"pole": "Cele i kryteria", "opis": "Względem czego oceniamy, np. „NPS zespołu min. 50, czas odpowiedzi do 24 h, współpraca z działem sprzedaży”."}, {"pole": "Fakty i przykłady", "opis": "Konkretne rezultaty i sytuacje, np. „średni czas odpowiedzi 19 h; w marcu sama przygotowała bazę odpowiedzi FAQ; 2 eskalacje klientów w Q3”."}, {"pole": "Notatki menedżera", "opis": "Surowe uwagi do przeredagowania, np. „super z klientami, ale chaotyczna w dokumentacji”."}, {"pole": "Proponowana ocena", "opis": "Ocena w skali firmy, np. „4/5 – powyżej oczekiwań”."}], "prompt": "Jesteś doświadczoną HR business partnerką w polskiej firmie, która pomaga menedżerom pisać rzetelne podsumowania ocen okresowych. Przygotuj podsumowanie oceny pracownika oparte wyłącznie na faktach.\n\nDANE:\nStanowisko i okres oceny: [STANOWISKO I OKRES]\nCele i kryteria: [CELE I KRYTERIA]\nFakty i przykłady: [FAKTY I PRZYKŁADY]\nNotatki menedżera: [NOTATKI MENEDŻERA]\nProponowana ocena: [PROPONOWANA OCENA]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj na odpowiedź. Nie wymyślaj rezultatów, liczb ani sytuacji. Luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Każde stwierdzenie poprzyj faktem lub przykładem z danych. Ogólniki („mógłby się bardziej starać”, „chaotyczna”) zamień na opis zachowania i jego skutku albo oznacz [DO UZUPEŁNIENIA], jeśli brakuje przykładu.\n3. Nie oceniaj osobowości, charakteru ani motywacji. Pisz o zachowaniach i rezultatach.\n4. Usuń wszelkie odniesienia do zdrowia, L4, ciąży, rodzicielstwa, wieku, płci, wyznania czy życia prywatnego — nie mogą wpływać na ocenę (zasada równego traktowania, RODO).\n5. Sprawdź, czy proponowana ocena jest spójna z faktami. Jeśli fakty wskazują inaczej, napisz to wprost i oznacz [DO WERYFIKACJI].\n6. Ton rzeczowy i szanujący pracownika — tekst może zostać mu pokazany i trafić do akt.\n7. Przy słabej ocenie, która może prowadzić do decyzji kadrowych, dodaj ostrzeżenie [DO WERYFIKACJI] z kadrami lub prawnikiem.\n\nFORMAT WYNIKU:\nA) Podsumowanie oceny gotowe do skopiowania: realizacja celów, mocne strony, obszary do rozwoju, uzasadnienie oceny.\nB) Tabela: kryterium, fakty, ocena cząstkowa.\nC) Lista sformułowań z notatek, które usunąłeś lub zmieniłeś, i dlaczego.\nD) Lista „sprawdź przed użyciem”: luki, założenia, ryzyka.", "polecenia": ["Skróć podsumowanie do 6 zdań.", "Zmień ton na cieplejszy, ale zachowaj wszystkie fakty.", "Przygotuj wersję do odczytania pracownikowi na rozmowie.", "Dopisz 3 cele rozwojowe wynikające z obszarów do poprawy.", "Sprawdź, czy w tekście nie ma sformułowań, które mogą zostać odebrane jako dyskryminujące.", "Przygotuj wersję dla przełożonego menedżera w 3 punktach.", "Przeredaguj podsumowanie dla oceny poniżej oczekiwań, rzeczowo i bez ocen osoby.", "Wypisz pytania, które menedżer powinien zadać, żeby uzupełnić brakujące fakty.", "Przetłumacz podsumowanie na angielski.", "Przygotuj wersję prostym językiem dla pracownika z Ukrainy."], "checklista": ["Każde stwierdzenie ma za sobą fakt lub przykład z okresu oceny.", "Tekst nie zawiera ocen osobowości ani motywacji.", "Nie ma odniesień do zdrowia, L4, rodzicielstwa, wieku, płci ani życia prywatnego — równe traktowanie i RODO.", "Do AI wklejono dane zanonimizowane, bez nazwiska i PESEL.", "Ocena końcowa jest spójna z faktami i kryteriami.", "Menedżer przeczytał i zaakceptował tekst jako swój.", "Przy ocenie mogącej prowadzić do decyzji kadrowych tekst sprawdziły kadry lub prawnik."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Podsumowanie oceny może zostać pokazane pracownikowi i stać się dowodem w sporze, więc każde zdanie musi dać się obronić faktami."}, {"id": "2.08", "nazwa": "Rozmowa feedbackowa: przygotowanie, scenariusz i trudne reakcje", "co_robi": "Przygotowuje Cię lub menedżera do rozmowy feedbackowej w modelu SBI: komunikaty, scenariusz krok po kroku i odpowiedzi na trudne reakcje. Dzięki temu rozmowa jest konkretna, spokojna i kończy się ustaleniami.", "kiedy": "Przed rozmową oceniającą lub korygującą, której menedżer się obawia, bo pracownik reaguje emocjonalnie albo nie zgadza się z oceną.", "brief": [{"pole": "Kontekst rozmowy", "opis": "Rodzaj rozmowy i relacja, np. „rozmowa po ocenie rocznej, kierowniczka magazynu z doświadczonym brygadzistą”."}, {"pole": "Sytuacje i zachowania", "opis": "Konkretne fakty, np. „w październiku 3 razy nie przekazał zmiany według procedury, w efekcie 2 opóźnione wysyłki”."}, {"pole": "Cel rozmowy", "opis": "Co ma się zmienić, np. „przekazanie zmiany zawsze z wypełnioną checklistą od listopada”."}, {"pole": "Spodziewane reakcje", "opis": "Czego się obawiasz, np. „zaprzeczanie, obwinianie innych, groźba odejścia”."}, {"pole": "Mocne strony pracownika", "opis": "Co docenić, np. „najlepsza znajomość systemu WMS w zespole, chętnie szkoli nowych”."}], "prompt": "Jesteś doświadczoną trenerką menedżerów i HR business partnerką w polskiej firmie, która przygotowuje ludzi do trudnych rozmów. Przygotuj mnie do rozmowy feedbackowej w modelu SBI (sytuacja, zachowanie, wpływ).\n\nDANE:\nKontekst rozmowy: [KONTEKST ROZMOWY]\nSytuacje i zachowania: [SYTUACJE I ZACHOWANIA]\nCel rozmowy: [CEL ROZMOWY]\nSpodziewane reakcje: [SPODZIEWANE REAKCJE]\nMocne strony pracownika: [MOCNE STRONY PRACOWNIKA]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj na odpowiedź. Nie wymyślaj sytuacji ani faktów. Luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Komunikaty SBI buduj tylko z faktów, które podałam. Bez ocen osoby, uogólnień („zawsze”, „nigdy”) i interpretacji intencji.\n3. Scenariusz ma zostawić przestrzeń na perspektywę pracownika: pytania otwarte, słuchanie, wspólne szukanie rozwiązań.\n4. Rozmowa kończy się konkretnymi ustaleniami: co, do kiedy, jak sprawdzimy.\n5. Na trudne reakcje proponuj spokojne, szanujące odpowiedzi. Jeśli pracownik zgłosi mobbing, dyskryminację lub problem zdrowotny, nie oceniaj tego w rozmowie — zaplanuj przekazanie sprawy właściwą ścieżką i oznacz [DO WERYFIKACJI] z HR lub prawnikiem.\n6. Nie sugeruj gróźb ani zapowiedzi konsekwencji kadrowych, chyba że o to poproszę — wtedy oznacz je [DO WERYFIKACJI] z kadrami.\n\nFORMAT WYNIKU:\nA) 2–3 komunikaty SBI gotowe do wypowiedzenia.\nB) Scenariusz rozmowy krok po kroku z przykładowymi zdaniami: otwarcie, feedback, perspektywa pracownika, rozwiązania, ustalenia, zamknięcie.\nC) Tabela trudnych reakcji: reakcja, co może za nią stać, co powiedzieć.\nD) Wzór krótkiej notatki z ustaleniami po rozmowie.\nE) Lista „sprawdź przed rozmową”.", "polecenia": ["Skróć scenariusz do rozmowy na 20 minut.", "Przygotuj wersję dla rozmowy z osobą, która płacze lub się zamyka.", "Dodaj komunikat doceniający w modelu SBI na otwarcie rozmowy.", "Zrób symulację: Ty grasz pracownika, ja ćwiczę odpowiedzi.", "Przygotuj maila podsumowującego ustalenia po rozmowie.", "Zmień ton na bardziej stanowczy, ale wciąż bez ocen osoby.", "Przygotuj wersję rozmowy online przez Teams.", "Dopisz plan spotkania kontrolnego za 4 tygodnie.", "Przetłumacz komunikaty SBI na angielski.", "Przyg
