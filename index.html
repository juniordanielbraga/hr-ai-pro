ch firm."}, {"etap": "5. Prawo pracownika do informacji", "co_zrobic": "Przygotuj procedurę odpowiedzi na wniosek pracownika o informację o jego wynagrodzeniu i o średnich poziomach wynagrodzeń (w podziale na płeć) dla osób wykonujących tę samą pracę lub pracę o jednakowej wartości. Wyznacz osobę odpowiedzialną, wzór odpowiedzi i termin wewnętrzny. Usuń z umów i regulaminów zapisy zakazujące pracownikom ujawniania własnego wynagrodzenia. Sprawdź aktualny stan prawny."}, {"etap": "6. Analiza luki płacowej", "co_zrobic": "Policz lukę płacową kobiet i mężczyzn ogółem i w każdej kategorii pracowników. Każdą różnicę opisz i sprawdź, czy ma obiektywne, neutralne płciowo uzasadnienie. Dyrektywa przewiduje obowiązek raportowania luki płacowej, którego zakres i częstotliwość zależą od wielkości firmy — sprawdź aktualny stan prawny i to, czy i od kiedy obowiązek dotyczy Twojej firmy."}, {"etap": "7. Wspólna ocena wynagrodzeń i plan naprawczy", "co_zrobic": "Według dyrektywy, gdy raport pokazuje w jakiejś kategorii lukę co najmniej 5%, której pracodawca nie uzasadnił obiektywnymi, neutralnymi płciowo kryteriami i której nie skorygował, konieczna jest wspólna ocena wynagrodzeń z udziałem przedstawicieli pracowników. Nie czekaj na ten moment — koryguj nieuzasadnione różnice wcześniej. Sprawdź aktualny stan prawny."}, {"etap": "8. Komunikacja i stały przegląd", "co_zrobic": "Przeszkol managerów z rozmów o wynagrodzeniach, przygotuj FAQ dla pracowników, zaktualizuj regulamin wynagradzania (z prawnikiem). Przegląd siatki i luki płacowej wpisz do kalendarza — co najmniej raz w roku i przed każdym cyklem podwyżek."}], "prompty": [{"nazwa": "Audyt ogłoszenia o pracę pod kątem jawności wynagrodzeń", "prompt": "Jesteś doświadczoną specjalistką HR w polskiej firmie i znasz zasady jawności wynagrodzeń w rekrutacji (art. 18³ca Kodeksu pracy, obowiązujący od 24.12.2025). Przeanalizuj poniższe ogłoszenie o pracę.\n\nOGŁOSZENIE:\n{wklej treść ogłoszenia}\n\nZASADY:\n1. Jeśli czegoś nie wiesz (np. czy informacja o wynagrodzeniu jest przekazywana kandydatom innym kanałem), zadaj maksymalnie 5 pytań i poczekaj.\n2. Nie wymyślaj kwot ani przepisów. Kwestie prawne oznaczaj [DO WERYFIKACJI] z kadrami lub prawnikiem.\n\nFORMAT WYNIKU:\nA) Tabela: element | stan w ogłoszeniu | ryzyko (niskie/średnie/wysokie) | rekomendacja. Sprawdź: wynagrodzenie lub przedział (brutto/netto, forma umowy), neutralność płciową nazwy stanowiska i treści, sformułowania wykluczające (wiek, płeć, sytuacja rodzinna), pytania o historię wynagrodzeń, klauzulę RODO.\nB) Poprawiona wersja ogłoszenia gotowa do publikacji, z lukami oznaczonymi [DO UZUPEŁNIENIA].\nC) Lista 3–5 rzeczy do sprawdzenia przed publikacją."}, {"nazwa": "Neutralne płciowo nazwy stanowisk", "prompt": "Jesteś specjalistką HR i językową redaktorką w polskiej firmie. Przygotuj neutralne płciowo wersje nazw stanowisk na potrzeby ogłoszeń, ATS, regulaminu wynagradzania i struktury organizacyjnej.\n\nLISTA STANOWISK:\n{wklej listę, po jednym stanowisku w wierszu}\n\nZASADY:\n1. Proponuj formy poprawne w polszczyźnie: forma żeńska i męska (np. Księgowa/Księgowy), oznaczenie (K/M/X) albo opis typu „osoba na stanowisku…”. Unikaj form, które brzmią sztucznie lub dwuznacznie, i powiedz, kiedy feminatyw jest mniej utrwalony.\n2. Nie zmieniaj zakresu ani poziomu stanowiska — tylko formę nazwy.\n3. Jeśli nazwa jest niejasna, oznacz ją [DO UZUPEŁNIENIA] i zapytaj o zakres obowiązków.\n\nFORMAT WYNIKU:\nA) Tabela: obecna nazwa | wersja do ogłoszenia | wersja krótka do ATS/systemów | uwagi.\nB) 3 zasady nazewnictwa do wpisania w firmowy standard."}, {"nazwa": "Przedziały wynagrodzeń z danych", "prompt": "Jesteś analityczką wynagrodzeń (compensation & benefits) w polskiej firmie. Na podstawie zanonimizowanych danych zaproponuj przedziały wynagrodzeń min–mid–max dla kategorii stanowisk.\n\nDANE (bez nazwisk i danych osobowych):\n{wklej tabelę: stanowisko | kategoria | wynagrodzenie zasadnicze brutto PLN | wymiar etatu | staż na stanowisku | płeć K/M}\nDANE RYNKOWE (jeśli masz):\n{wklej źródło i wartości}\n\nZASADY:\n1. Jeśli brakuje danych do rzetelnych przedziałów, zadaj maksymalnie 5 pytań i poczekaj.\n2. Nie wymyślaj danych rynkowych. Każde założenie oznacz [ZAŁOŻENIE].\n3. Przedziały mają wynikać z obiektywnych kryteriów (umiejętności, wysiłek, odpowiedzialność, warunki pracy), a nie z płci czy historii wynagrodzeń.\n4. Pokaż obliczenia krok po kroku.\n\nFORMAT WYNIKU:\nA) Tabela: kategoria | min | mid | max | szerokość przedziału % | liczba osób.\nB) Lista osób (po ID) poniżej minimum i powyżej maksimum.\nC) Średnie wynagrodzenie K i M w każdej kategorii oraz różnica % — z pytaniem o uzasadnienie każdej różnicy.\nD) Rekomendacje i lista do weryfikacji [DO WERYFIKACJI] przed decyzją zarządu."}, {"nazwa": "Odpowiedź na wniosek pracownika o informację o wynagrodzeniach", "prompt": "Jesteś HR business partnerką w polskiej firmie. Pracownik złożył wniosek o informację o swoim wynagrodzeniu i o poziomach wynagrodzeń osób wykonujących tę samą pracę lub pracę o jednakowej wartości. Przygotuj odpowiedź.\n\nDANE:\nTreść wniosku: {wklej}\nKategoria stanowiska pracownika: {kategoria}\nZasady ustalania wynagrodzeń w firmie: {opis lub fragment regulaminu wynagradzania}\nŚrednie wynagrodzenia w kategorii z podziałem na płeć (zanonimizowane): {dane}\n\nZASADY:\n1. Jeśli brakuje danych, zadaj maksymalnie 5 pytań i poczekaj.\n2. Nie podawaj danych pozwalających zidentyfikować konkretne osoby (np. gdy w kategorii jest bardzo mało osób) — oznacz to [DO WERYFIKACJI] z prawnikiem lub IOD.\n3. Obowiązki wynikające z dyrektywy UE 2023/970 i polskiej ustawy wdrażającej oznacz [DO WERYFIKACJI] — sprawdź aktualny stan prawny. Nie podawaj terminów ani artykułów z pamięci.\n4. Ton: rzeczowy, życzliwy, bez języka prawniczego tam, gdzie nie jest potrzebny.\n\nFORMAT WYNIKU:\nA) Gotowa odpowiedź do pracownika (pismo lub e-mail).\nB) Notatka wewnętrzna: jakie dane przekazano, skąd pochodzą, kto zatwierdził.\nC) Lista ryzyk i punktów do sprawdzenia przed wysłaniem."}]}, "instalacja": {"tytul": "Instrukcja: Twój dział HR z AI w 10 minut", "kroki_chatgpt": ["Zaloguj się na chatgpt.com (w przeglądarce lub w aplikacji na komputer). Projekty i własne GPT działają najlepiej na płatnym planie; na darmowym możesz po prostu wkleić instrukcje systemowe na początku nowej rozmowy.", "Wariant A — Projekt: w lewym panelu kliknij „Nowy projekt” (lub „Projekty” → „Utwórz projekt”) i nadaj mu nazwę, np. „HR AI PRO — Dział HR”.", "Wejdź w ustawienia projektu i znajdź pole „Instrukcje”. Wklej tam w całości tekst z sekcji „Instrukcje systemowe” poniżej, uzupełnij pola w {nawiasach klamrowych} i zapisz.", "W plikach projektu dodaj dokumenty, z których korzystasz najczęściej: wzory ogłoszeń, regulamin pracy i wynagradzania, opisy stanowisk, wartości firmy. Nie wgrywaj CV, list płac ani innych danych osobowych pracowników i kandydatów.", "Wariant B — własny GPT: kliknij „Eksploruj GPT” → „Utwórz”, przejdź do zakładki „Konfiguruj”, wpisz nazwę i krótki opis, a w polu „Instrukcje” wklej instrukcje systemowe.", "Ustaw własny GPT jako prywatny („Tylko ja”) albo udostępnij go tylko zespołowi HR — nigdy nie publikuj go publicznie.", "W ustawieniach konta sprawdź opcje kontroli danych (np. czy Twoje rozmowy mogą służyć do ulepszania modeli) i ustaw je zgodnie z polityką firmy.", "Test: zacznij nową rozmowę w projekcie i wklej PROMPT MAESTRO dowolnej Skilli. Jeśli AI najpierw dopytuje o brakujące dane, wszystko działa. Każdą kolejną Skillę uruchamiaj w nowej rozmowie w tym samym projekcie."], "kroki_claude": ["Zaloguj się na claude.ai (w przeglądarce lub aplikacji). Projekty są dostępne na planach płatnych; na darmowym wklej instrukcje systemowe na początku nowej rozmowy.", "W lewym panelu kliknij „Projekty”, a potem „Utwórz projekt”. Nadaj nazwę, np. „HR AI PRO — Dział HR”, i krótki opis.", "W widoku projektu znajdź pole instrukcji projektu (np. „Ustaw instrukcje projektu” / „Instrukcje”). Wklej tam w całości tekst z sekcji „Instrukcje systemowe” poniżej, uzupełnij pola w {nawiasach klamrowych} i zapisz.", "W wiedzy projektu dodaj swoje pliki: wzory pism, opisy stanowisk, siatkę płac bez danych osobowych, regulamin pracy, wartości firmy. AI będzie z nich korzystać w każdej rozmowie w tym projekcie.", "Opcjonalnie utwórz osobne projekty dla obszarów, np. „Rekrutacja” i „Rozwój i oceny”, z tymi samymi instrukcjami i innymi plikami.", "W ustawieniach prywatności konta sprawdź, jak wykorzystywane są Twoje rozmowy, i dopasuj ustawienia do polityki firmy.", "Test: otwórz nową rozmowę w projekcie i wklej PROMPT MAESTRO dowolnej Skilli. AI powinno najpierw dopytać o brakujące dane. Każdą Skillę uruchamiaj w nowej rozmowie — długie rozmowy o wielu tematach gorzej trzymają kontekst."], "kroki_gemini": ["Zaloguj się na gemini.google.com kontem Google (prywatnym albo firmowym Google Workspace). Nazwy przycisków mogą się nieznacznie różnić.", "W lewym panelu wybierz „Odkrywaj Gemy” lub „Menedżer Gemów”, a następnie „Nowy Gem”.", "Nadaj nazwę, np. „HR AI PRO — Dział HR”, i w polu „Instrukcje” wklej w całości tekst z sekcji „Instrukcje systemowe” poniżej, uzupełniając pola w {nawiasach klamrowych}.", "Jeśli możesz dodawać pliki do Gema, dołącz wzory pism, opisy stanowisk i wartości firmy — bez danych osobowych.", "Kliknij „Zapisz”. Gem pojawi się w lewym panelu — od teraz zaczynaj w nim każdą pracę ze Skillami.", "Sprawdź ustawienia aktywności w aplikacjach Gemini (zapisywanie historii i wykorzystanie rozmów) i dopasuj je do polityki firmy.", "Test: wklej PROMPT MAESTRO dowolnej Skilli i sprawdź, czy Gem dopytuje o brakujące dane i oznacza założenia."], "kroki_copilot": ["Jeśli Twoja firma korzysta z Microsoft 365, zaloguj się do Microsoft 365 Copilot kontem służbowym (aplikacja Microsoft 365 / Copilot w przeglądarce lub w Teams). Funkcje zależą od licencji i ustawień administratora, a nazwy przycisków mogą się różnić.", "Najwygodniej utworzyć własnego agenta: poszukaj opcji „Agenci” → „Utwórz agenta” (lub podobnej). Nadaj nazwę, np. „HR AI PRO — Dział HR”.", "W polu instrukcji agenta wklej tekst z sekcji „Instrukcje systemowe” poniżej i uzupełnij pola w {nawiasach klamrowych}. Jako źródła wiedzy możesz wskazać firmowe pliki lub foldery z wzorami dokumentów — tylko takie, do których agent powinien mieć dostęp.", "Jeśli tworzenie agentów jest niedostępne, możesz użyć notesu Copilot (Copilot Notebooks) z dodanymi plikami albo po prostu wkleić instrukcje systemowe na początku nowej rozmowy.", "Na prywatnym koncie Microsoft (bez Microsoft 365 w firmie) korzystaj z aplikacji Copilot: wklej instrukcje systemowe na początku rozmowy, a potem PROMPT MAESTRO wybranej Skilli.", "Zanim zaczniesz pracę na danych pracowników, zapytaj dział IT lub administratora, jakie zasady ochrony danych obowiązują w Copilot w Twojej firmie.", "Test: wklej PROMPT MAESTRO dowolnej Skilli i sprawdź, czy Copilot dopytuje o brakujące dane i oznacza założenia."], "instrukcje_systemowe": "Jesteś asystentem działu HR w polskiej firmie {nazwa firmy} z branży {branża}, zatrudniającej {liczba pracowników} osób. Wspierasz specjalistki i specjalistów HR, rekruterów, HR business partnerów, osoby z kadr i płac oraz właścicieli firm w codziennej pracy: rekrutacji, onboardingu, ocenach okresowych, rozwoju i szkoleniach, komunikacji wewnętrznej, wynagrodzeniach i benefitach, employer brandingu, dobrostanie zespołu i dokumentach HR. Znasz polskie realia: Kodeks pracy, formy zatrudnienia (umowa o pracę, umowa zlecenie, B2B), okres próbny, PLN brutto/netto, PPK, szkolenie BHP wstępne, świadectwo pracy, regulamin pracy i regulamin wynagradzania, portale rekrutacyjne (Pracuj.pl, LinkedIn, justjoin.it, OLX Praca).\n\nZASADY PRACY:\n1. Pytaj o brakujące dane. Jeśli brakuje informacji potrzebnych do dobrej odpowiedzi, najpierw zadaj maksymalnie 5 krótkich pytań i poczekaj. Jeśli użytkownik prosi o wersję mimo braków, przygotuj ją i wyraźnie wskaż luki.\n2. Nie wymyślaj przepisów, kwot ani danych. Nie podawaj z pamięci numerów artykułów, terminów, stawek, wysokości świadczeń ani sygnatur wyroków. Kwestie o skutkach prawnych oznaczaj [DO WERYFIKACJI] z kadrami lub prawnikiem. Wynagrodzenia, budżety i dane firmy pochodzą wyłącznie od użytkownika.\n3. Oznaczaj luki i założenia: brakujące dane jako [DO UZUPEŁNIENIA], przyjęte założenia jako [ZAŁOŻENIE], kwestie do sprawdzenia jako [DO WERYFIKACJI].\n4. RODO i poufność. Nie proś o dane wrażliwe (zdrowie, ciąża, wyznanie, poglądy, przynależność związkowa, karalność), PESEL, numery dokumentów ani adresy. Jeśli użytkownik wklei dane osobowe, przypomnij o anonimizacji (np. „Kandydatka A”, „Pracownik 3”) i pracuj na wersji bez danych identyfikujących. W dokumentach rekrutacyjnych pamiętaj o klauzuli informacyjnej i osobnej zgodzie na przyszłe rekrutacje.\n5. Jawność wynagrodzeń i równe traktowanie. W ogłoszeniach i ofertach uwzględniaj wynagrodzenie lub jego przedział oparty na obiektywnych, neutralnych płciowo kryteriach. Nigdy nie proponuj pytań o obecne lub poprzednie wynagrodzenie kandydata ani pytań o stan cywilny, dzieci, ciążę, wiek, zdrowie czy wyznanie. Przy tematach związanych z dyrektywą UE 2023/970 dopisz: „sprawdź aktualny stan prawny”.\n6. Język neutralny płciowo. Używaj neutralnych płciowo nazw stanowisk (np. Specjalista/Specjalistka, K/M/X) i form zwracania się, które nie wykluczają nikogo.\n7. Ton komunikacji: {ton komunikacji}. Teksty dla pracowników i kandydatów pisz po ludzku, ciepło i konkretnie, bez korporacyjnego żargonu. Wspieraj wartości firmy: {wartości}.\n8. Formatuj czytelnie: nagłówki, tabele (porównania, harmonogramy, plany, checklisty), numerowane kroki, gotowe teksty do skopiowania. Gdy podajesz obliczenia, rozpisz je krok po kroku.\n9. Pisz po polsku. Angielskie terminy branżowe (onboarding, feedback, eNPS, HRBP, employer branding) są w porządku, jeśli tak mówi się w polskim HR.\n10. Decyzja należy do człowieka. Nie podejmujesz decyzji o zatrudnieniu, zwolnieniu, ocenie ani wynagrodzeniu konkretnej osoby — przygotowujesz materiały i analizy. Na końcu każdego dokumentu o skutkach prawnych lub finansowych dodaj krótką listę „Sprawdź przed użyciem” z miejscami, w których przyjąłeś założenia.\n11. Przy trudnych tematach (mobbing, dyskryminacja, zgłoszenia sygnalistów, zwolnienia, konflikty) zachowaj neutralność, nie oceniaj winy na podstawie jednej relacji i zaproponuj konsultację z prawnikiem lub kadrami.", "rodo_zasady": ["Anonimizuj, zanim wkleisz. Przed wklejeniem CV, oceny czy notatki usuń imię i nazwisko, zdjęcie, adres, telefon, e-mail, datę urodzenia i linki do profili — zastąp je oznaczeniem typu „Kandydatka A”.", "Nigdy nie wklejaj do AI numerów PESEL, numerów dowodów i paszportów, numerów kont ani danych o zdrowiu, ciąży, niepełnosprawności, zwolnieniach lekarskich, wyznaniu, poglądach czy karalności.", "Dane płacowe analizuj w formie zanonimizowanej (ID zamiast nazwisk). Uważaj na małe grupy — przy 1–2 osobach w kategorii dane i tak mogą wskazywać konkretną osobę.", "Sprawdź ustawienia narzędzia: czy rozmowy mogą być wykorzystywane do trenowania modeli, jak długo jest przechowywana historia i kto ma dostęp do projektu. Ustaw je zgodnie z polityką firmy.", "Korzystaj z kont i narzędzi zatwierdzonych przez firmę. Jeśli firma ma politykę korzystania z AI, działaj zgodnie z nią; jeśli jej nie ma — zaproponuj ją, a do czasu jej przyjęcia pracuj wyłącznie na danych zanonimizowanych.", "Nie podejmuj decyzji o kandydatach i pracownikach wyłącznie na podstawie wyniku AI. Każdą rekomendację sprawdza i zatwierdza człowiek, a uzasadnienie decyzji opiera się na kryteriach związanych z pracą.", "Nie przechowuj w projektach AI dokumentów z danymi osobowymi dłużej, niż to konieczne — usuwaj pliki i rozmowy, gdy przestają być potrzebne.", "W razie wątpliwości (nowe zastosowanie AI, dane szczególnej kategorii, przekazanie danych poza firmę) skonsultuj się z inspektorem ochrony danych (IOD) lub prawnikiem."], "dobre_praktyki": ["Jedna Skilla = jedna nowa rozmowa w projekcie. Długie rozmowy o wielu tematach gorzej trzymają kontekst.", "Wypełnij brief rzetelnie. Im więcej konkretów (stanowisko, zespół, kultura, budżet, terminy), tym mniej poprawek. Zamiast „dobry kandydat” napisz, co dokładnie ma umieć.", "Odpowiadaj na pytania AI. Jeśli AI dopytuje, to znak, że brakuje danych — odpowiedz krótko i dopiero wtedy poproś o wynik.", "Korzystaj z poleceń follow-up z każdej Skilli: skróć, zmień ton, zrób tabelę, przygotuj wersję na Teams lub Slack. Druga i trzecia iteracja zwykle daje najlepszy efekt.", "Wgraj do projektu firmowe wzorce: wartości, ton komunikacji, przykładowe dobre ogłoszenia i maile. AI szybciej złapie styl Twojej firmy.", "Zawsze szukaj oznaczeń [DO UZUPEŁNIENIA], [ZAŁOŻENIE] i [DO WERYFIKACJI] i przejrzyj je przed wysłaniem dokumentu.", "Dokumenty o skutkach prawnych (umowy, wypowiedzenia, regulaminy, klauzule RODO) traktuj jako szkic do weryfikacji przez kadry lub prawnika.", "Zapisuj najlepsze wyniki jako własne wzory — po kilku tygodniach zbudujesz bibliotekę dokumentów dopasowaną do Twojej firmy."]}, "szablony": [{"nazwa": "Zaproszenie na rozmowę kwalifikacyjną (online i stacjonarnie)", "kiedy": "Gdy kandydat przeszedł etap analizy CV i chcesz umówić rozmowę — wybierz wariant online albo stacjonarny.", "tresc": "Wzór do weryfikacji — dostosuj do swojej firmy.\n\nTemat: Zaproszenie na rozmowę — {nazwa stanowiska} w {nazwa firmy}\n\nDzień dobry {imię},\n\ndziękujemy za przesłanie aplikacji na stanowisko {nazwa stanowiska}. Twoje doświadczenie w {obszar} bardzo nas zainteresowało i chcielibyśmy porozmawiać z Tobą osobiście.\n\nProponujemy spotkanie:\n• Data i godzina: {dzień tygodnia}, {data}, godz. {godzina}\n• Czas trwania: ok. {liczba} minut\n• Osoby prowadzące: {imię i nazwisko, stanowisko}, {imię i nazwisko, stanowisko}\n\nWARIANT ONLINE:\n• Spotkanie odbędzie się przez {Teams / Google Meet / Zoom}. Link: {link}\n• Prosimy o sprawdzenie kamery i mikrofonu kilka minut wcześniej.\n\nWARIANT STACJONARNY:\n• Adres: {ulica, numer, miasto}, {piętro / sala}\n• Na miejscu zapytaj w recepcji o {imię osoby}. Parking: {informacja}.\n\nPodczas rozmowy opowiemy o zespole i zadaniach, a Ty będziesz mieć czas na swoje pytania. {Opcjonalnie: Prosimy o przygotowanie krótkiego przykładu projektu, z którego jesteś dumna/dumny.}\n\nInformacja o wynagrodzeniu: na tym stanowisku przewidujemy wynagrodzenie w przedziale {kwota od} – {kwota do} PLN {brutto / netto}, {forma umowy}.\n\nJeśli termin Ci nie odpowiada albo potrzebujesz dostosowań w trakcie spotkania, daj nam znać — zaproponujemy inne rozwiązanie. Prosimy o potwierdzenie udziału do {data}.\n\nDo zobaczenia!\n{imię i nazwisko}\n{stanowisko} | {nazwa firmy}\n{telefon} | {e-mail}"}, {"nazwa": "Odmowa kandydatowi po analizie CV", "kiedy": "Gdy po przeglądzie aplikacji kandydat nie przechodzi do kolejnego etapu.", "tresc": "Wzór do weryfikacji — dostosuj do swojej firmy.\n\nTemat: Twoja aplikacja na stanowisko {nazwa stanowiska}\n\nDzień dobry {imię},\n\ndziękujemy za zainteresowanie pracą w {nazwa firmy} i za czas poświęcony na przygotowanie aplikacji na stanowisko {nazwa stanowiska}.\n\nPo analizie wszystkich zgłoszeń zdecydowaliśmy się zaprosić do kolejnego etapu osoby, których doświadczenie najbardziej odpowiada obecnym potrzebom zespołu, szczególnie w obszarze {kluczowe wymaganie}. Tym razem nie będziemy kontynuować rozmów z Tobą.\n\nWiemy, że taka wiadomość nie jest przyjemna, i doceniamy Twoje zaangażowanie. {Jeśli kandydat wyraził zgodę na przyszłe rekrutacje: Twoje dane pozostaną w naszej bazie do {data} — odezwiemy się, jeśli pojawi się oferta pasująca do Twojego profilu.} {Jeśli nie: Zachęcamy do śledzenia naszych ofert na {strona kariery / LinkedIn}.}\n\nŻyczymy powodzenia w dalszych poszukiwaniach.\n\nZ pozdrowieniami\n{imię i nazwisko}\n{stanowisko} | {nazwa firmy}"}, {"nazwa": "Odmowa po rozmowie kwalifikacyjnej z krótkim feedbackiem", "kiedy": "Gdy kandydat był na rozmowie (lub kilku), ale wybrano inną osobę — z krótką, rzeczową informacją zwrotną.", "tresc": "Wzór do weryfikacji — dostosuj do swojej firmy.\n\nTemat: Decyzja w rekrutacji na stanowisko {nazwa stanowiska}\n\nDzień dobry {imię},\n\ndziękujemy za rozmowę {data} i za otwartość, z jaką opowiadał(a)ś o swoim doświadczeniu. Było nam bardzo miło Cię poznać.\n\nPo zakończeniu wszystkich rozmów zdecydowaliśmy się złożyć ofertę innej osobie. Nie była to łatwa decyzja.\n\nKilka słów informacji zwrotnej:\n• Co nas przekonało: {konkretna mocna strona, np. jasne przykłady pracy z klientem, dobre przygotowanie do rozmowy}.\n• Co zadecydowało o wyborze innej osoby: {rzeczowy powód związany z wymaganiami stanowiska, np. większe doświadczenie w prowadzeniu zespołu}.\n• Wskazówka na przyszłość: {opcjonalnie, jedna życzliwa i konkretna rada}.\n\n{Jeśli kandydat wyraził zgodę na przyszłe rekrutacje: Chętnie wrócimy do Ciebie przy kolejnych rekrutacjach — Twoje dane pozostaną w naszej bazie do {data}.}\n\nJeśli chcesz porozmawiać o informacji zwrotnej, odpisz na tę wiadomość — umówimy krótką rozmowę.\n\nPowodzenia i do usłyszenia!\n{imię i nazwisko}\n{stanowisko} | {nazwa firmy}"}, {"nazwa": "Propozycja zatrudnienia (oferta)", "kiedy": "Gdy wybrałaś/wybrałeś kandydata i chcesz przedstawić warunki oferty przed podpisaniem umowy.", "tresc": "Wzór do weryfikacji — dostosuj do swojej firmy.\n\nTemat: Propozycja zatrudnienia — {nazwa stanowiska} w {nazwa firmy}\n\nDzień dobry {imię},\n\nz przyjemnością przedstawiamy Ci propozycję współpracy na stanowisku {nazwa stanowiska} w zespole {nazwa zespołu}. Bardzo się cieszymy, że możemy złożyć Ci tę ofertę!\n\nWarunki:\n• Stanowisko: {nazwa stanowiska}\n• Forma zatrudnienia: {umowa o pracę / umowa zlecenie / B2B}\n• Wymiar: {pełny etat / część etatu / liczba godzin}\n• Okres próbny: {tak — {liczba} miesiące / nie dotyczy}, następnie {umowa na czas określony / nieokreślony}\n• Wynagrodzenie: {kwota} PLN {brutto / netto + VAT} miesięcznie\n• Dodatki i premie: {zasady premiowania lub „nie dotyczy”}\n• Benefity: {np. prywatna opieka medyczna, karta sportowa, PPK, budżet szkoleniowy}\n• Miejsce i model pracy: {adres / zdalnie / hybrydowo — {liczba} dni w biurze}\n• Godziny pracy: {np. 8:00–16:00 lub elastyczny start 7:00–10:00}\n• Przełożony/przełożona: {imię i nazwisko, stanowisko}\n• Planowana data rozpoczęcia: {data}\n\nKolejne kroki: po Twojej akceptacji prześlemy projekt umowy oraz listę dokumentów potrzebnych do zatrudnienia. Przed rozpoczęciem pracy zaplanujemy też {badania medycyny pracy / szkolenie BHP wstępne}.\n\nProsimy o odpowiedź do {data}. Jeśli masz pytania dotyczące warunków, chętnie porozmawiamy — zadzwoń: {telefon}.\n\nTa wiadomość jest propozycją warunków i nie stanowi umowy. Wiążące są postanowienia umowy podpisanej przez obie strony.\n\nZ serdecznymi pozdrowieniami\n{imię i nazwisko}\n{stanowisko} | {nazwa firmy}"}, {"nazwa": "Mail powitalny przed pierwszym dniem (onboarding)", "kiedy": "Kilka dni przed pierwszym dniem pracy nowej osoby — żeby wiedziała, czego się spodziewać.", "tresc": "Wzór do weryfikacji — dostosuj do swojej firmy.\n\nTemat: Witaj w {nazwa firmy}! Wszystko, co warto wiedzieć przed {data}\n\nCześć {imię},\n\njuż za kilka dni zaczynasz pracę w {nazwa firmy} — cały zespół {nazwa zespołu} bardzo się cieszy! Żeby pierwszy dzień był spokojny, zebraliśmy najważniejsze informacje.\n\nTwój pierwszy dzień:\n• Data i godzina: {data}, godz. {godzina}\n• Miejsce: {adres i wskazówki dojazdu / link do spotkania online}\n• Kto Cię przywita: {imię i nazwisko, stanowisko} — telefon w razie potrzeby: {telefon}\n• Twój buddy (osoba, która pomoże Ci w pierwszych tygodniach): {imię}\n\nCo zabrać / przygotować:\n• {dokumenty potrzebne kadrom, np. dowód osobisty do wglądu, świadectwa pracy, zaświadczenie z badań medycyny pracy}\n• {numer rachunku bankowego do wypłaty wynagrodzenia}\n• {inne, np. zdjęcie do identyfikatora}\n\nSprzęt i dostępy: {informacja, kiedy i jak otrzymasz laptop, telefon, konta}.\n\nDress code: {opis lub „bez formalności — ubierz się wygodnie”}.\n\nW pierwszym tygodniu czekają Cię m.in.: {szkolenie BHP wstępne, spotkanie z przełożonym, poznanie zespołu, wprowadzenie do narzędzi}.\n\nJeśli masz jakiekolwiek pytania przed startem, po prostu odpisz na tego maila.\n\nDo zobaczenia {data}!\n{imię i nazwisko}\n{stanowisko} | {nazwa firmy}"}, {"nazwa": "Plan pierwszego dnia dla nowej osoby", "kiedy": "Do wysłania nowej osobie razem z mailem powitalnym albo do wręczenia rano pierwszego dnia.", "tresc": "Wzór do weryfikacji — dostosuj do swojej firmy.\n\nPLAN PIERWSZEGO DNIA — {imię}, {nazwa stanowiska}\n{nazwa firmy} | {data}\n\n{godzina} — Powitanie: {imię osoby witającej} (recepcja / link online). Kawa i krótkie oprowadzenie po biurze.\n{godzina} — Formalności w kadrach: podpisanie dokumentów, informacje o wynagrodzeniu, urlopach i benefitach ({imię osoby z kadr}).\n{godzina} — Szkolenie BHP wstępne ({osoba prowadząca}).\n{godzina} — Sprzęt i dostępy: laptop, konta, poczta, {narzędzia} — z pomocą {imię osoby z IT}.\n{godzina} — Lunch z zespołem {miejsce / „lunch na koszt firmy”}.\n{godzina} — Spotkanie z przełożonym/przełożoną ({imię}): cele na pierwsze 30 dni, sposób pracy w zespole, Twoje pytania.\n{godzina} — Poznaj swojego buddy ({imię}): jak u nas działa komunikacja, gdzie co znaleźć, nieformalne zasady.\n{godzina} — Czas na spokojne zapoznanie się z materiałami: {link do wiki / dokumentów onboardingowych}.\n{godzina} — Krótkie podsumowanie dnia z {imię}: jak się czujesz, czego potrzebujesz na jutro?\n\nWażne kontakty:\n• HR: {imię}, {telefon / e-mail}\n• IT: {imię}, {telefon / e-mail}\n• Przełożony/przełożona: {imię}, {telefon / e-mail}\n• Buddy: {imię}, {telefon / e-mail}\n\nCieszymy się, że jesteś z nami!"}, {"nazwa": "Zaproszenie na rozmowę feedbackową / ocenę okresową", "kiedy": "Gdy planujesz rozmowę oceniającą lub rozwojową i chcesz, żeby pracownik mógł się do niej przygotować.", "tresc": "Wzór do weryfikacji — dostosuj do swojej firmy.\n\nTemat: Zaproszenie na rozmowę {feedbackową / oceniającą} — {okres}\n\nCześć {imię},\n\nzapraszam Cię na rozmowę {feedbackową / w ramach oceny okresowej} podsumowującą {okres, np. pierwsze półrocze 2026}.\n\n• Termin: {data}, godz. {godzina}\n• Czas trwania: ok. {liczba} minut\n• Miejsce: {sala / link online}\n• Udział: {imię przełożonego/przełożonej}{, opcjonalnie: osoba z HR}\n\nCel rozmowy: wspólnie spojrzeć na to, co udało się osiągnąć, co było wyzwaniem i czego potrzebujesz, żeby dalej się rozwijać. To rozmowa w obie strony — Twoja perspektywa jest dla nas tak samo ważna.\n\nJak się przygotować (ok. 20 minut):\n1. Twoje najważniejsze osiągnięcia w tym okresie (2–3 przykłady).\n2. Co było trudne i czego się z tego nauczyłeś/nauczyłaś.\n3. Jak oceniasz realizację celów: {lista celów lub link do formularza}.\n4. Czego potrzebujesz od przełożonego, zespołu lub firmy.\n5. Twoje cele i pomysły na rozwój w kolejnym okresie.\n\n{Opcjonalnie: Prosimy o wypełnienie formularza samooceny do {data}: {link}.}\n\nJeśli termin Ci nie pasuje, daj znać — znajdziemy inny.\n\nPozdrawiam\n{imię i nazwisko}\n{stanowisko} | {nazwa firmy}"}, {"nazwa": "Podziękowanie i informacja zwrotna po okresie próbnym", "kiedy": "Pod koniec okresu próbnego, gdy decyzja o dalszej współpracy jest pozytywna — jako podsumowanie po rozmowie.", "tresc": "Wzór do weryfikacji — dostosuj do swojej firmy.\n\nTemat: Podsumowanie okresu próbnego — dziękujemy, {imię}!\n\nCześć {imię},\n\nTwój okres próbny na stanowisku {nazwa stanowiska} dobiega końca i chcemy Ci powiedzieć jedno: bardzo się cieszymy, że jesteś w naszym zespole!\n\nCo szczególnie doceniamy:\n• {konkretne osiągnięcie 1, np. samodzielne przejęcie procesu X w drugim miesiącu}\n• {konkretne zachowanie 2, np. sposób, w jaki wspierasz nowe osoby w zespole}\n• {konkretna umiejętność 3}\n\nNad czym będziemy razem pracować w kolejnych miesiącach:\n• {obszar rozwojowy 1 i sposób wsparcia, np. szkolenie, mentoring}\n• {obszar rozwojowy 2}\n\nDalsza współpraca: proponujemy kontynuację zatrudnienia
