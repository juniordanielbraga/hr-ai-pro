j faktów, dat, kwot ani przepisów — luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Opieraj rozmowę na faktach i zachowaniach, nie na ocenie osoby. Bez sformułowań, które można odebrać jako dyskryminujące lub poniżające.\n3. Przy wypowiedzeniu: formalne elementy (forma pisma, przyczyna, okres wypowiedzenia, konsultacja ze związkami, ochrona szczególna) oznacz [DO WERYFIKACJI] z kadrami/prawnikiem — nie podawaj ich z pamięci.\n4. Jeśli z danych wynika podejrzenie mobbingu (art. 94³ KP), dyskryminacji lub zgłoszenia sygnalisty, zatrzymaj się: zaproponuj ścieżkę zgodną z wewnętrzną procedurą antymobbingową lub zgłoszeń wewnętrznych i oznacz całość [DO WERYFIKACJI] z prawnikiem.\n5. Nie pytaj o zdrowie ani życie prywatne; przy nieobecnościach mów o skutkach dla pracy.\n\nFORMAT WYNIKU:\nA) Plan rozmowy: otwarcie, fakty, wysłuchanie, ustalenia, zamknięcie — z czasem na każdą część.\nB) Gotowe zdania do powiedzenia na każdym etapie.\nC) Tabela trudnych reakcji (płacz, złość, milczenie, groźba sądu, oskarżenie lidera) i jak odpowiedzieć.\nD) Czego nie mówić — 5 przykładów.\nE) Szablon notatki ze spotkania i plan działań po rozmowie.\nF) Lista „sprawdź przed rozmową”.", "polecenia": ["Zrób krótką ściągę na jedną kartkę, którą manager weźmie na rozmowę.", "Przygotuj wersję rozmowy, jeśli pracownik od razu zareaguje agresywnie.", "Napisz plan poprawy efektywności na 60 dni z mierzalnymi celami.", "Przećwiczmy rozmowę: Ty grasz pracownika, ja managera.", "Przygotuj e-mail podsumowujący ustalenia, do wysłania po rozmowie.", "Dopisz, jak zakomunikować zespołowi odejście tej osoby, bez szczegółów.", "Złagodź ton otwarcia, ale nie rozmywaj komunikatu.", "Przygotuj wersję rozmowy prostym językiem dla pracownika z Ukrainy.", "Wypisz, jakie dokumenty powinnam mieć przygotowane przed rozmową.", "Zaproponuj, jak wesprzeć managera po rozmowie, jeśli poszła źle."], "checklista": ["W rozmowie są tylko sprawdzalne fakty i zachowania, bez ocen osoby.", "Do AI nie trafiły nazwiska, PESEL, informacje o zdrowiu ani inne dane wrażliwe (RODO).", "Formalności związane z wypowiedzeniem sprawdzone z kadrami lub prawnikiem.", "Sygnały mobbingu lub dyskryminacji skierowane do procedury wewnętrznej, a nie rozwiązywane samą rozmową.", "Zdania nie zawierają odniesień do płci, wieku, zdrowia, rodzicielstwa ani innych cech chronionych.", "Rozmowa odbędzie się w spokojnym, prywatnym miejscu i z czasem na pytania.", "Notatka po rozmowie jest rzeczowa i zawiera ustalenia oraz terminy.", "Dokumenty o skutkach prawnych zweryfikowane przez kadry lub prawnika przed wręczeniem."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Scenariusz to pomoc, nie skrypt do odczytania — rozmowa ma być ludzka, a sprawy prawne zawsze sprawdź z kadrami lub prawnikiem."}, {"id": "6.06", "nazwa": "Rekomendacja dla zarządu", "co_robi": "Zamienia Twoją analizę w krótką notatkę decyzyjną: problem, opcje, koszty, ryzyka i jedną jasną rekomendację. Zarząd dostaje dokument, na podstawie którego może podjąć decyzję w 10 minut.", "kiedy": "Gdy masz przekonać zarząd do podwyżek, nowego etatu, systemu HR albo zmiany polityki, a wiesz, że nikt nie przeczyta dziesięciu stron.", "brief": [{"pole": "Problem", "opis": "Co się dzieje i dlaczego to ważne, np. „od pół roku nie możemy obsadzić 4 stanowisk programistów, projekty opóźnione o 2 miesiące”."}, {"pole": "Dane i dowody", "opis": "Liczby, które masz, np. „średni czas rekrutacji 94 dni, 3 odrzucone oferty z powodu wynagrodzenia, koszt agencji 18 tys. PLN za osobę”."}, {"pole": "Rozważane opcje", "opis": "Co można zrobić, np. „podnieść widełki o 15%, współpraca B2B z software house, program poleceń pracowniczych”."}, {"pole": "Budżet i koszty", "opis": "Co wiesz o kosztach, np. „budżet HR na rok 300 tys. PLN, podwyżka widełek to ok. 120 tys. PLN rocznie”."}, {"pole": "Odbiorcy", "opis": "Kto decyduje i czego się obawia, np. „prezes i CFO; CFO pilnuje kosztów stałych”."}, {"pole": "Termin decyzji", "opis": "Np. „posiedzenie zarządu 15.11, decyzja potrzebna przed budżetem na 2027”."}], "prompt": "Jesteś doświadczonym HR business partnerem w polskiej firmie, który regularnie przygotowuje notatki decyzyjne dla zarządu i wie, że zarząd czyta pierwszą stronę. Przygotuj rekomendację.\n\nDANE:\nProblem: [PROBLEM]\nDane i dowody: [DANE I DOWODY]\nRozważane opcje: [ROZWAŻANE OPCJE]\nBudżet i koszty: [BUDŻET I KOSZTY]\nOdbiorcy: [ODBIORCY]\nTermin decyzji: [TERMIN DECYZJI]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj liczb, kosztów, stawek rynkowych ani danych firmy — luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Pisz językiem biznesu: pieniądze, czas, ryzyko, wpływ na klientów i wyniki. Bez żargonu HR.\n3. Przedstaw 2–4 opcje, zawsze z opcją „nic nie robimy” i jej kosztem.\n4. Rekomenduj jedną opcję i uzasadnij ją w 3 punktach. Uczciwie pokaż jej słabe strony.\n5. Opcje dotyczące wynagrodzeń sprawdź pod kątem jawności płac i równego traktowania; elementy ze skutkami prawnymi (zmiana form zatrudnienia, B2B, regulamin wynagradzania) oznacz [DO WERYFIKACJI] z kadrami/prawnikiem.\n6. Uwzględnij obawy odbiorców i odpowiedz na nie w tekście.\n\nFORMAT WYNIKU:\nA) Notatka decyzyjna na 1 stronę: tytuł, decyzja do podjęcia, rekomendacja w 2 zdaniach, kontekst, opcje, koszty, ryzyka, następne kroki.\nB) Tabela porównania opcji: koszt, czas wdrożenia, efekt, ryzyko, ocena.\nC) Prawdopodobne pytania zarządu i krótkie odpowiedzi (5–7).\nD) Wersja e-mail (maks. 120 słów).\nE) Lista „sprawdź przed wysłaniem”: założenia i luki.", "polecenia": ["Skróć notatkę do pół strony.", "Przygotuj wersję pod CFO, z naciskiem na zwrot z inwestycji.", "Zrób z notatki 3 slajdy na posiedzenie zarządu.", "Dodaj scenariusz pesymistyczny i optymistyczny dla rekomendowanej opcji.", "Policz zwrot z inwestycji krok po kroku na moich danych.", "Zaproponuj pilotaż, żeby zarząd mógł zgodzić się na mniejsze ryzyko.", "Przygotuj odpowiedź, jeśli zarząd powie „nie ma na to budżetu”.", "Przetłumacz notatkę na angielski dla zagranicznego właściciela.", "Zaproponuj harmonogram wdrożenia po decyzji zarządu.", "Sprawdź, czy notatka nie zawiera tez bez pokrycia w danych."], "checklista": ["Każda liczba w notatce pochodzi z Twoich danych lub jest oznaczona jako założenie.", "Opcja „nic nie robimy” ma policzony koszt.", "Rekomendacja jest jedna i jasno sformułowana.", "Słabe strony rekomendowanej opcji są pokazane uczciwie.", "Propozycje płacowe są zgodne z zasadą równego traktowania i jawności wynagrodzeń.", "Notatka nie zawiera danych osobowych konkretnych pracowników.", "Elementy ze skutkami prawnymi zweryfikowane z kadrami lub prawnikiem."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie i zarządu. Zanim wyślesz notatkę, przejdź ją z jedną zaufaną osobą z zarządu albo finansów, żeby nie było zaskoczeń na posiedzeniu."}, {"id": "6.07", "nazwa": "Zarządzanie zmianą", "co_robi": "Tworzy plan wprowadzenia zmiany w oparciu o model ADKAR lub 8 kroków Kottera: mapę interesariuszy, plan komunikacji i sposoby pracy z oporem. Dostajesz harmonogram i gotowe komunikaty.", "kiedy": "Gdy firma wprowadza nowy system, zmienia organizację pracy, przechodzi na pracę hybrydową albo łączy działy, a Ty wiesz, że bez planu ludzie zablokują zmianę.", "brief": [{"pole": "Opis zmiany", "opis": "Co się zmienia i dlaczego, np. „wdrożenie nowego systemu ERP w miejsce trzech arkuszy i starego programu magazynowego”."}, {"pole": "Kogo dotyczy", "opis": "Grupy i liczba osób, np. „magazyn 40 os., księgowość 6 os., handlowcy 15 os.; część na zmianach”."}, {"pole": "Termin i etapy", "opis": "Np. „start pilota 1.02, pełne wdrożenie 1.05”."}, {"pole": "Spodziewany opór", "opis": "Czego się obawiasz, np. „starsi magazynierzy boją się komputerów, handlowcy nie chcą raportować w systemie”."}, {"pole": "Sponsor i liderzy", "opis": "Kto popiera zmianę, np. „sponsor: dyrektor operacyjny; liderzy: 2 kierowników zmian, 1 informatyk”."}, {"pole": "Model zmiany", "opis": "Np. „ADKAR”, „Kotter” albo „dobierz najlepszy”."}], "prompt": "Jesteś doświadczoną specjalistką ds. zarządzania zmianą i HR business partnerką w polskiej firmie, która wdrażała zmiany w zespołach produkcyjnych, biurowych i rozproszonych. Przygotuj plan zmiany.\n\nDANE:\nOpis zmiany: [OPIS ZMIANY]\nKogo dotyczy: [KOGO DOTYCZY]\nTermin i etapy: [TERMIN I ETAPY]\nSpodziewany opór: [SPODZIEWANY OPÓR]\nSponsor i liderzy: [SPONSOR I LIDERZY]\nModel zmiany: [MODEL ZMIANY]\n\nZASADY:\n1. Jeśli brakuje istotnych informacji, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj terminów, liczb ani danych firmy — luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Zastosuj wskazany model (ADKAR lub 8 kroków Kottera) albo wybierz i krótko uzasadnij wybór. Stosuj go praktycznie, bez teorii.\n3. Traktuj opór jako informację, nie wrogość. Dla każdej grupy opisz, co traci, czego się boi i co zyskuje.\n4. Komunikacja ma docierać do wszystkich — także osób bez służbowego e-maila, na zmianach i słabiej mówiących po polsku.\n5. Jeśli zmiana dotyka warunków pracy, czasu pracy, regulaminu pracy, pracy zdalnej lub wymaga porozumienia zmieniającego albo konsultacji z przedstawicielami pracowników, oznacz to [DO WERYFIKACJI] z kadrami/prawnikiem.\n\nFORMAT WYNIKU:\nA) Mapa interesariuszy: tabela grupa, wpływ, nastawienie, czego potrzebuje, kto z nią rozmawia.\nB) Plan zmiany wg modelu: etap, działania, odpowiedzialny, termin.\nC) Plan komunikacji: tabela co, do kogo, kanał, kiedy, kto przekazuje.\nD) Gotowy pierwszy komunikat o zmianie (maks. 150 słów) i 8 pytań z odpowiedziami do FAQ.\nE) Praca z oporem: typowe obiekcje i odpowiedzi.\nF) Wskaźniki, po których poznasz, że zmiana się przyjęła, i lista „sprawdź przed użyciem”.", "polecenia": ["Napisz komunikat o zmianie na tablicę ogłoszeń dla pracowników produkcji.", "Przygotuj wersję komunikatu na Teams lub Slack, krótszą i luźniejszą.", "Zrób scenariusz spotkania informacyjnego dla zespołu na 30 minut.", "Przygotuj ściągę dla liderów: jak odpowiadać na pytania pracowników.", "Napisz komunikat prostym językiem dla pracowników z Ukrainy.", "Dodaj krótką ankietę pulsową do sprawdzenia nastrojów po miesiącu.", "Rozpisz plan szkoleń potrzebnych do zmiany.", "Dodaj ryzyka i plan B, jeśli termin wdrożenia się przesunie.", "Przygotuj wersję planu na jedną stronę dla zarządu.", "Zaproponuj, jak docenić osoby, które najszybciej przyjęły zmianę."], "checklista": ["Sponsor zmiany zna plan i zgodził się w nim wystąpić.", "Każda grupa pracowników ma przypisany kanał i osobę, od której usłyszy o zmianie.", "Komunikaty dotrą do osób bez e-maila służbowego i słabiej mówiących po polsku.", "Terminy i liczby pochodzą z planu projektu, a nie z założeń AI.", "Zmiany warunków pracy sprawdzone z kadrami lub prawnikiem (porozumienie zmieniające, regulamin pracy, konsultacje).", "FAQ nie obiecuje niczego, czego firma nie może zagwarantować.", "Ustalono, jak zbierasz i wykorzystasz informacje zwrotne od pracowników."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Plan zmiany żyje razem z projektem — wracaj do niego co kilka tygodni i aktualizuj na podstawie tego, co mówią ludzie."}, {"id": "6.08", "nazwa": "Restrukturyzacja", "co_robi": "Pomaga przygotować plan reorganizacji: scenariusze zmian w strukturze, obiektywne i niedyskryminujące kryteria doboru oraz komunikację do pracowników. Wszystkie kwestie prawne oznacza do sprawdzenia z prawnikiem.", "kiedy": "Gdy zarząd zapowiada „musimy się odchudzić” albo połączyć działy, a Ty musisz przygotować proces, który będzie uczciwy, zgodny z prawem i nie zniszczy zaufania w firmie.", "brief": [{"pole": "Powód restrukturyzacji", "opis": "Np. „spadek zamówień o 30%, zamknięcie linii produkcyjnej B, połączenie działów zakupów i logistyki”."}, {"pole": "Obecna struktura", "opis": "Zanonimizowana, np. „produkcja 120 os. w 3 brygadach, logistyka 18 os., zakupy 7 os.”."}, {"pole": "Cel i skala", "opis": "Np. „zmniejszyć koszty osobowe o 12%, docelowa struktura do 1.04”."}, {"pole": "Przedstawicielstwo pracowników", "opis": "Np. „działa zakładowa organizacja związkowa” albo „brak związków, jest rada pracowników”."}, {"pole": "Ograniczenia i wartości", "opis": "Np. „chcemy najpierw przesunięć wewnętrznych, zachować kluczowe kompetencje, wsparcie outplacementu”."}], "prompt": "Jesteś doświadczonym HR business partnerem w polskiej firmie, który prowadził reorganizacje w duchu odpowiedzialnej restrukturyzacji: uczciwie, transparentnie i z szacunkiem dla ludzi. Pomóż mi przygotować plan.\n\nDANE:\nPowód restrukturyzacji: [POWÓD RESTRUKTURYZACJI]\nObecna struktura: [OBECNA STRUKTURA]\nCel i skala: [CEL I SKALA]\nPrzedstawicielstwo pracowników: [PRZEDSTAWICIELSTWO PRACOWNIKÓW]\nOgraniczenia i wartości: [OGRANICZENIA I WARTOŚCI]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj liczb, kosztów ani danych firmy — luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Zacznij od alternatyw dla zwolnień: przesunięcia wewnętrzne, zmiana wymiaru etatu, wstrzymanie rekrutacji, odejścia naturalne.\n3. Kryteria doboru mają być obiektywne, mierzalne, związane z pracą i niedyskryminujące. Nigdy nie proponuj kryteriów opartych na wieku, płci, zdrowiu, rodzicielstwie, formie zatrudnienia ani innych cechach chronionych.\n4. Nie cytuj przepisów ani artykułów. Wszystkie aspekty prawne — tryb zwolnień, progi, konsultacje ze związkami lub przedstawicielami pracowników, zawiadomienia, terminy, ochrona szczególna, odprawy — oznacz [DO WERYFIKACJI] z prawnikiem.\n5. Komunikacja: najpierw osoby dotknięte zmianą, potem zespół, nigdy plotka ani e-mail jako pierwsze źródło.\n\nFORMAT WYNIKU:\nA) 2–3 scenariusze reorganizacji: tabela opis, wpływ na ludzi, oszczędność, ryzyko.\nB) Propozycja obiektywnych kryteriów doboru z wagami i sposobem udokumentowania.\nC) Harmonogram procesu z punktami [DO WERYFIKACJI] z prawnikiem.\nD) Plan komunikacji: kto, komu, kiedy, jakim kanałem.\nE) Wsparcie dla odchodzących i dla zostających.\nF) Lista ryzyk i lista „sprawdź przed użyciem”.", "polecenia": ["Przygotuj listę pytań do prawnika przed rozpoczęciem procesu.", "Napisz scenariusz spotkania z zespołem w dniu ogłoszenia zmian.", "Przygotuj FAQ dla pracowników, którzy zostają w firmie.", "Sprawdź, czy kryteria doboru nie mogą pośrednio dyskryminować żadnej grupy.", "Zaproponuj pakiet wsparcia outplacementowego w kilku wariantach budżetowych.", "Przygotuj ściągę dla managerów na rozmowy indywidualne.", "Rozpisz plan pracy z morale zespołu przez 3 miesiące po zmianach.", "Zrób wersję planu na jedną stronę dla zarządu.", "Przygotuj komunikat dla klientów i partnerów, jeśli zmiana będzie widoczna na zewnątrz.", "Dodaj scenariusz bez zwolnień i policz, czy jest realny."], "checklista": ["Wszystkie kwestie prawne (tryb, konsultacje, terminy, odprawy, ochrona szczególna) zweryfikowane z prawnikiem.", "Kryteria doboru są obiektywne, mierzalne, udokumentowane i nie dyskryminują bezpośrednio ani pośrednio.", "Alternatywy dla zwolnień zostały realnie rozważone i opisane.", "Do AI nie trafiły nazwiska, PESEL, informacje o zdrowiu ani inne dane wrażliwe (RODO).", "Przedstawicielstwo pracowników zostało uwzględnione w harmonogramie zgodnie z zaleceniami prawnika.", "Osoby dotknięte zmianą dowiedzą się o niej osobiście, przed resztą firmy.", "Managerowie są przygotowani do rozmów i wiedzą, czego nie obiecywać.", "Liczby i oszczędności przeliczone przez finanse, a nie tylko przez AI."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie i zarządu. Restrukturyzacja ma poważne skutki prawne i ludzkie, dlatego każdy krok procesu uzgodnij z prawnikiem prawa pracy, zanim cokolwiek ogłosisz."}, {"id": "6.09", "nazwa": "Plan retencji kluczowych osób", "co_robi": "Pomaga wskazać kluczowe osoby, ocenić ryzyko ich odejścia i zaplanować konkretne działania zatrzymujące. Przygotowuje też scenariusz stay interview, czyli rozmowy o tym, co trzyma ludzi w firmie.", "kiedy": "Gdy boisz się, że odejdzie ktoś, bez kogo dział stanie, albo konkurencja zaczyna podkupywać Twoich specjalistów.", "brief": [{"pole": "Kluczowe role", "opis": "Stanowiska bez nazwisk, np. „główny technolog, 2 senior developerów, kierownik największego klienta”."}, {"pole": "Sygnały ryzyka", "opis": "Co obserwujesz, np. „technolog po odrzuconej prośbie o podwyżkę, spadek zaangażowania; developer aktualizował profil na LinkedIn”."}, {"pole": "Sytuacja rynkowa", "opis": "Np. „konkurencja z Wrocławia oferuje pracę zdalną i wyższe widełki”."}, {"pole": "Możliwości firmy", "opis": "Czym dysponujesz, np. „budżet retencyjny 40 tys. PLN, możliwość pracy hybrydowej, ścieżka awansu na lidera”."}, {"pole": "Kto prowadzi rozmowy", "opis": "Np. „bezpośredni przełożeni, HR jako wsparcie”."}], "prompt": "Jesteś doświadczoną HR business partnerką w polskiej firmie, specjalizującą się w retencji talentów i rozmowach stay interview. Pomóż mi przygotować plan retencji.\n\nDANE:\nKluczowe role: [KLUCZOWE ROLE]\nSygnały ryzyka: [SYGNAŁY RYZYKA]\nSytuacja rynkowa: [SYTUACJA RYNKOWA]\nMożliwości firmy: [MOŻLIWOŚCI FIRMY]\nKto prowadzi rozmowy: [KTO PROWADZI ROZMOWY]\n\nZASADY:\n1. Jeśli brakuje istotnych informacji, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj liczb, stawek rynkowych ani danych firmy — luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Ryzyko odejścia oceniaj w dwóch wymiarach: prawdopodobieństwo odejścia i wpływ odejścia na biznes. Opieraj się na sygnałach, nie na domysłach o życiu prywatnym.\n3. Nie zakładaj, że pieniądze rozwiązują wszystko. Uwzględnij rozwój, uznanie, elastyczność, relację z przełożonym, sens pracy.\n4. Działania płacowe muszą być zgodne z obiektywnymi kryteriami, równym traktowaniem i jawnością wynagrodzeń — zaznacz, jeśli podwyżka dla jednej osoby może tworzyć nierówność wobec innych na podobnym stanowisku.\n5. Zmiany w umowach (np. porozumienie zmieniające, zakaz konkurencji) oznacz [DO WERYFIKACJI] z kadrami/prawnikiem.\n\nFORMAT WYNIKU:\nA) Matryca ryzyka: tabela rola, prawdopodobieństwo, wpływ, priorytet, główne sygnały.\nB) Indywidualne plany działań dla ról o najwyższym priorytecie: działanie, koszt, odpowiedzialny, termin.\nC) Scenariusz stay interview: wstęp, 10 pytań, jak słuchać, czego nie obiecywać, notatka po rozmowie.\nD) Działania systemowe dla całej grupy kluczowych osób.\nE) Plan B: jak zabezpieczyć wiedzę, jeśli ktoś mimo to odejdzie.\nF) Lista „sprawdź przed użyciem”.", "polecenia": ["Przygotuj ściągę stay interview na jedną kartkę dla managera.", "Napisz zaproszenie na rozmowę, które nie zabrzmi alarmująco.", "Zaproponuj działania retencyjne bez budżetu.", "Przygotuj kontrofertę na wypadek, gdy kluczowa osoba złoży wypowiedzenie.", "Dodaj plan przekazania wiedzy dla każdej kluczowej roli.", "Zrób wersję planu na jedną stronę dla zarządu, z kosztami.", "Sprawdź, czy proponowane podwyżki nie tworzą nierówności płacowych.", "Zaproponuj, jak co kwartał monitorować ryzyko odejść.", "Przetłumacz pytania stay interview na angielski dla zespołu międzynarodowego.", "Porównaj koszt retencji z kosztem zastąpienia tej osoby."], "checklista": ["Ocena ryzyka opiera się na sygnałach zawodowych, nie na domysłach o życiu prywatnym.", "Do AI nie trafiły nazwiska, informacje o zdrowiu ani sytuacji rodzinnej (RODO).", "Działania płacowe są zgodne z obiektywnymi kryteriami i jawnością wynagrodzeń.", "Managerowie wiedzą, czego nie mogą obiecać podczas stay interview.", "Każda kluczowa rola ma plan zabezpieczenia wiedzy.", "Zmiany w umowach zweryfikowane z kadrami lub prawnikiem.", "Plan i oceny ryzyka są przechowywane poufnie, z ograniczonym dostępem."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Lista kluczowych osób i ich ocena ryzyka to informacja poufna — dbaj, żeby nie trafiła do osób, których dotyczy, w formie etykiety."}, {"id": "6.10", "nazwa": "Rozwój menedżera i plan sukcesji", "co_robi": "Tworzy indywidualny plan rozwoju (IPR) dla lidera oraz plan sukcesji na kluczowe stanowiska. Pokazuje luki kompetencyjne, następców w różnym horyzoncie gotowości i działania rozwojowe na najbliższe miesiące.", "kiedy": "Gdy awansowałaś/eś świetnego specjalistę na kierownika i widzisz, że ma problem z zarządzaniem, albo zarząd pyta „kto zastąpi dyrektora sprzedaży, gdy odejdzie na emeryturę?”.", "brief": [{"pole": "Menedżer i stanowisko", "opis": "Bez nazwiska, np. „kierownik zespołu wsparcia IT, 8 osób, na stanowisku od 10 miesięcy, awans wewnętrzny”."}, {"pole": "Mocne strony i luki", "opis": "Np. „świetna wiedza techniczna; słabo deleguje, unika trudnych rozmów, feedback 360 niski w komunikacji”."}, {"pole": "Kluczowe stanowiska", "opis": "Do planu sukcesji, np. „dyrektor sprzedaży, kierownik produkcji, główna księgowa”."}, {"pole": "Potencjalni następcy", "opis": "Role i gotowość bez nazwisk, np. „2 regionalnych kierowników sprzedaży, jeden gotowy za rok, drugi za 2–3 lata”."}, {"pole": "Zasoby rozwojowe", "opis": "Np. „budżet 8 tys. PLN na osobę, mentoring wewnętrzny, platforma e-learningowa, coach zewnętrzny”."}, {"pole": "Horyzont", "opis": "Np. „IPR na 12 miesięcy, plan sukcesji na 3 lata”."}], "prompt": "Jesteś doświadczoną HR business partnerką i coachką menedżerów w polskiej firmie, która buduje plany rozwoju liderów i plany sukcesji w MŚP. Przygotuj IPR dla menedżera i plan sukcesji.\n\nDANE:\nMenedżer i stanowisko: [MENEDŻER I STANOWISKO]\nMocne strony i luki: [MOCNE STRONY I LUKI]\nKluczowe stanowiska: [KLUCZOWE STANOWISKA]\nPotencjalni następcy: [POTENCJALNI NASTĘPCY]\nZasoby rozwojowe: [ZASOBY ROZWOJOWE]\nHoryzont: [HORYZONT]\n\nZASADY:\n1. Jeśli brakuje istotnych informacji, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj ocen, wyników, kosztów ani danych firmy — luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. IPR buduj według zasady 70-20-10: praca na zadaniach, nauka od innych, szkolenia. Cele rozwojowe formułuj jako SMART i opisuj obserwowalne zachowania.\n3. Wybieraj maksymalnie 3 obszary rozwoju naraz — tak, żeby plan był wykonalny obok codziennej pracy.\n4. Gotowość następców oceniaj w trzech horyzontach: gotowy teraz, za 1–2 lata, za 3+ lata. Kryteria mają być oparte na kompetencjach i wynikach, nie na wieku, płci, stażu czy sytuacji rodzinnej.\n5. Jeśli dla stanowiska nie ma następcy, napisz to wprost i zaproponuj rozwiązanie (rozwój, rekrutacja, podział roli).\n\nFORMAT WYNIKU:\nA) IPR menedżera: tabela obszar, cel SMART, działania 70-20-10, wsparcie, termin, jak zmierzymy postęp.\nB) Plan rozmowy rozwojowej z menedżerem (kluczowe pytania).\nC) Mapa sukcesji: tabela stanowisko, ryzyko wakatu, następcy wg gotowości, luki, działania.\nD) Plan rozwoju następców na najbliższe 12 miesięcy.\nE) Kalendarz przeglądów IPR i planu sukcesji.\nF) Lista „sprawdź przed użyciem”.", "polecenia": ["Rozpisz IPR na pierwsze 90 dni, krok po kroku.", "Przygotuj zestaw pytań do feedbacku 360 dla tego menedżera.", "Zaproponuj zadania na stanowisku, które rozwiną umiejętność delegowania.", "Przygotuj scenariusz pierwszego spotkania mentoringowego.", "Zrób z mapy sukcesji wersję 9-box na podstawie moich danych.", "Przygotuj wersję planu sukcesji na jedną stronę dla zarządu.", "Zaproponuj, jak rozmawiać z następcą, nie obiecując awansu.", "Dodaj wskaźniki, po których za pół roku ocenię postęp menedżera.", "Wypisz szkolenia i formaty rozwoju mieszczące się w budżecie.", "Wskaż stanowiska z największym ryzykiem braku następcy i co zrobić najpierw."], "checklista": ["Cele rozwojowe są konkretne, mierzalne i uzgodnione z menedżerem, a nie mu narzucone.", "Kryteria oceny następców opierają się na kompetencjach i wynikach, nie na wieku, płci czy sytuacji rodzinnej.", "Do AI nie trafiły nazwiska, oceny okresowe z danymi osobowymi ani informacje o zdrowiu (RODO).", "Plan sukcesji jest poufny i nie zawiera obietnic awansu.", "Budżet i działania rozwojowe są realne przy obecnym obciążeniu pracą.", "Ustalono terminy przeglądów IPR i planu sukcesji.", "Ewentualne zmiany stanowisk lub warunków zatrudnienia zweryfikowane z kadrami."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. IPR działa tylko wtedy, gdy menedżer uzna go za swój, więc potraktuj ten plan jako punkt wyjścia do rozmowy, a nie gotowy wyrok."}]}, {"dzial_nr": 7, "dzial": "Komunikacja wewnętrzna i employer branding", "opis": "Komunikacja, która buduje zaufanie w firmie i markę pracodawcy na zewnątrz: od onboardingu, przez komunikaty, spotkania i wydarzenia, po wideo, newsletter i metryki. Podajesz fakty, a dostajesz gotowe teksty, plany i raporty do sprawdzenia.", "skills": [{"id": "7.01", "nazwa": "Program onboardingu 30-60-90 dni", "co_robi": "Układa kompletny program wdrożenia nowej osoby: listę przygotowań przed startem, harmonogram pierwszego dnia, plan 30-60-90 dni z mierzalnymi celami, zadania buddy’ego i mail powitalny. Formalności i BHP dostajesz jako listę do odhaczenia z kadrami.", "kiedy": "Gdy za dwa tygodnie startuje nowa osoba, a Ty nie chcesz, żeby jej pierwszy dzień wyglądał jak szukanie laptopa i czekanie na dostęp do systemów.", "brief": [{"pole": "Stanowisko i dział", "opis": "Na jakie stanowisko i do jakiego zespołu, np. „Specjalistka/Specjalista ds. księgowości, dział finansów, zespół 3 osób”."}, {"pole": "Data startu i forma pracy", "opis": "Kiedy i jak pracuje, np. „3 listopada, hybrydowo: 3 dni w biurze w Poznaniu, 2 dni zdalnie; umowa o pracę na okres próbny”."}, {"pole": "Firma i kultura", "opis": "Kilka zdań o firmie, np. „firma produkcyjna, 85 osób, mówimy sobie po imieniu, dużo spraw załatwia się na hali, nie mailem”."}, {"pole": "Przełożony i buddy", "opis": "Role, bez danych wrażliwych, np. „przełożona: kierowniczka działu finansów; buddy: starszy księgowy z 6-letnim stażem”."}, {"pole": "Cele na pierwsze miesiące", "opis": "Czego oczekujesz, np. „do końca 2. miesiąca samodzielne rozliczanie rozrachunków z dostawcami, do 90. dnia zamykanie miesiąca z pomocą”."}, {"pole": "Narzędzia i dostępy", "opis": "Sprzęt i systemy, np. „laptop, Comarch ERP Optima, Teams, karta wejściowa, VPN do pracy zdalnej”."}], "prompt": "Jesteś doświadczoną specjalistką HR w polskiej firmie z sektora MŚP, która projektuje programy onboardingu skracające czas wdrożenia i ograniczające odejścia w pierwszym roku. Przygotuj kompletny program wdrożenia nowej osoby.\n\nDANE:\nStanowisko i dział: [STANOWISKO I DZIAŁ]\nData startu i forma pracy: [DATA STARTU I FORMA PRACY]\nFirma i kultura organizacyjna: [FIRMA I KULTURA]\nPrzełożony i buddy: [PRZEŁOŻONY I BUDDY]\nCele na pierwsze miesiące: [CELE NA PIERWSZE MIESIĄCE]\nNarzędzia i dostępy: [NARZĘDZIA I DOSTĘPY]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj na odpowiedź. Nie wymyślaj nazwisk, terminów, liczb ani procedur firmy – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Formalności (umowa, badania wstępne, szkolenie BHP wstępne, klauzula informacyjna RODO, zapoznanie z regulaminem pracy, zgłoszenia kadrowe) podaj wyłącznie jako pozycje listy kontrolnej – bez interpretowania przepisów i terminów. Całą listę oznacz [DO WERYFIKACJI] z kadrami.\n3. Jeśli forma pracy obejmuje pracę zdalną lub hybrydową, dodaj pozycje: zasady pracy zdalnej zgodne z regulaminem lub porozumieniem (art. 67¹⁸ KP i następne), sprzęt, ochrona danych, informacja o ocenie ryzyka – również [DO WERYFIKACJI].\n4. Plan 30-60-90 dni ma mieć mierzalne cele i punkty kontrolne: rozmowa po 1. tygodniu, po 30, 60 i 90 dniach; przy okresie próbnym – rozmowa podsumowująca przed jego końcem.\n5. Buddy to wsparcie koleżeńskie, nie przełożony – rozpisz jego zadania i realny czas na nie.\n6. Pisz ciepło, konkretnie, bez korpomowy.\n\nFORMAT WYNIKU:\nA) Tabela „przed pierwszym dniem”: zadanie | kto | do kiedy.\nB) Harmonogram pierwszego dnia godzina po godzinie.\nC) Plan 30-60-90 dni w tabeli: okres | cele | zadania | wsparcie | jak zmierzymy.\nD) Zadania buddy’ego na pierwsze 4 tygodnie.\nE) Gotowy mail powitalny do nowej osoby (temat + treść).\nF) Lista „sprawdź przed użyciem”: założenia, luki i punkty do weryfikacji z kadrami.", "polecenia": ["Skróć plan do jednej strony, którą wydrukuję nowej osobie.", "Przygotuj wersję onboardingu w pełni zdalnego.", "Napisz mail do zespołu z zapowiedzią nowej osoby.", "Zrób z planu 30-60-90 checklistę dla przełożonego.", "Przygotuj pytania na rozmowę po 30 dniach.", "Dodaj ankietę onboardingową po 90 dniach (maks. 8 pytań).", "Napisz instrukcję dla buddy’ego: co robić, a czego nie.", "Przygotuj wersję dla pracownika produkcji bez dostępu do komputera.", "Przetłumacz mail powitalny na angielski.", "Przygotuj wersję dla osoby z Ukrainy prostym językiem polskim."], "checklista": ["Lista formalności i BHP została sprawdzona z kadrami i służbą BHP – AI nie ustala terminów ani wymogów.", "Zasady pracy zdalnej lub hybrydowej zgadzają się z obowiązującym regulaminem lub porozumieniem w firmie.", "Cele 30-60-90 są mierzalne i uzgodnione z przełożonym nowej osoby.", "Buddy wie o swojej roli i ma zarezerwowany czas w kalendarzu.", "Sprzęt, konta i dostępy są zamówione z wyprzedzeniem, z nazwiskiem osoby odpowiedzialnej.", "Do AI nie wklejono danych wrażliwych nowej osoby (PESEL, adres, dane o zdrowiu z badań) – tylko role i stanowisko.", "Teksty są neutralne płciowo lub dopasowane do osoby, która faktycznie startuje."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Formalności kadrowe i BHP zawsze potwierdź z kadrami, bo ich pominięcie ma skutki prawne."}, {"id": "7.02", "nazwa": "Komunikat wewnętrzny w kilku wersjach", "co_robi": "Zamienia decyzję, zmianę lub informację w jasny komunikat dla pracowników: mail, krótką wersję na Teams lub Slack, tekst na tablicę oraz FAQ. Dodaje wskazówki dla menedżerów, jak przekazać temat zespołom.", "kiedy": "Gdy zarząd podjął decyzję (zmiana godzin, nowy benefit, przeprowadzka, nowa procedura) i komunikat musi wyjść dziś, w kilku kanałach, bez plotek i nieporozumień.", "brief": [{"pole": "Temat komunikatu", "opis": "Czego dotyczy, np. „zmiana godzin pracy biura od 1 grudnia: 8:00–16:00 zamiast 9:00–17:00”."}, {"pole": "Odbiorcy", "opis": "Kto ma to przeczytać, np. „40 pracowników biura; produkcja i magazyn bez zmian”."}, {"pole": "Kluczowe informacje", "opis": "Co, od kiedy, kogo dotyczy i dlaczego, np. „dopasowanie do godzin pracy klientów z Niemiec; elastyczny start ±30 min zostaje”."}, {"pole": "Kanały", "opis": "Gdzie publikujesz, np. „mail do wszystkich, kanał #ogloszenia na Slacku, tablica w kuchni”."}, {"pole": "Nadawca i ton", "opis": "Kto podpisuje i jak ma brzmieć, np. „prezes zarządu; ton ciepły, ale stanowczy”."}, {"pole": "Możliwe obawy", "opis": "Czego ludzie mogą się bać, np. „czy zmieni się wynagrodzenie, co z rodzicami odbierającymi dzieci ze żłobka”."}], "prompt": "Jesteś doświadczonym specjalistą ds. komunikacji wewnętrznej w polskiej firmie z sektora MŚP. Pomóż mi przygotować komunikat wewnętrzny w kilku wersjach – tak, żeby każdy pracownik od razu zrozumiał, co się zmienia i co ma zrobić.\n\nDANE:\nTemat komunikatu: [TEMAT KOMUNIKATU]\nOdbiorcy: [ODBIORCY]\nKluczowe informacje (co, od kiedy, kogo dotyczy, dlaczego): [KLUCZOWE INFORMACJE]\nKanały publikacji: [KANAŁY]\nNadawca i ton: [NADAWCA I TON]\nMożliwe obawy pracowników: [MOŻLIWE OBAWY]\n\nZASADY:\n1. Jeśli brakuje istotnych danych (data wejścia w życie, kogo zmiana nie dotyczy, do kogo kierować pytania), zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj dat, liczb, nazwisk ani uzasadnień – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Najważniejsza informacja w pierwszym zdaniu. Potem: dlaczego, kogo dotyczy, co trzeba zrobić, gdzie pytać.\n3. Jeśli zmiana dotyczy czasu pracy, wynagrodzeń, regulaminu pracy, miejsca pracy lub innych warunków zatrudnienia, oznacz to [DO WERYFIKACJI] z kadrami/prawnikiem – może wymagać zmiany regulaminu, porozumienia zmieniającego lub konsultacji, zanim komunikat wyjdzie.\n4. Nie obiecuj niczego, czego nie ma w danych. Odpowiadaj na obawy uczciwie, bez bagatelizowania.\n5. Prosty język, krótkie zdania, bez żargonu; zwracaj się do wszystkich w sposób neutralny płciowo.\n\nFORMAT WYNIKU:\nA) Mail: temat + treść (maks. 200 słów).\nB) Wersja na Teams/Slack (maks. 60 słów) + propozycja pierwszej odpowiedzi w wątku na pytania.\nC) Tekst na tablicę lub plakat: nagłówek + 3–5 punktów.\nD) FAQ: 5 najbardziej prawdopodobnych pytań z odpowiedziami.\nE) Ściąga dla menedżerów: jak przekazać temat zespołowi w 3 minuty.\nF) Lista „sprawdź przed wysyłką”: założenia, luki, punkty do weryfikacji.", "polecenia": ["Skróć mail o połowę, zostaw tylko to, co trzeba zrobić.", "Zmień ton na bardziej empatyczny – to trudna wiadomość.", "Przygotuj wersję SMS (maks. 160 znaków) dla pracowników bez maila.", "Dodaj 3 kolejne pytania do FAQ, które mogą zadać sceptycy.", "Napisz przypomnienie wysyłane dzień przed wejściem zmiany.", "Przygotuj wersję dla zarządu z ryzykami komunikacyjnymi.", "Przetłumacz komunikat na angielski.", "Przygotuj wersję dla pracowników z Ukrainy prostym językiem polskim.", "Napisz wersję B maila z innym tematem, żeby zwiększyć otwieralność.", "Przygotuj odpowiedź na krytyczny komentarz pod postem na Slacku."], "checklista": ["Daty, godziny i zakres zmiany są zgodne z decyzją zarządu – nic nie zostało dopisane przez AI.", "Zmiana warunków pracy lub płacy została skonsultowana z kadrami/prawnikiem przed publikacją.", "Każda wersja (mail, Slack, tablica) mówi to samo – bez sprzecznych szczegółów.", "Jest jasno wskazane, do kogo kierować pytania i do kiedy.", "Menedżerowie dostali informację przed resztą zespołu.", "Komunikat nie zawiera danych osobowych konkretnych pracowników.", "Język jest prosty, neutralny płciowo i zrozumiały dla osób, dla których polski nie jest pierwszym językiem."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Jeśli komunikat ogłasza zmianę warunków zatrudnienia, najpierw upewnij się z kadrami, że forma i kolejność działań są prawidłowe."}, {"id": "7.03", "nazwa": "Employer branding i EVP", "co_robi": "Pomaga zdefiniować propozycję wartości dla pracowników (EVP) na podstawie faktów, a nie haseł: diagnozuje mocne i słabe strony, układa filary EVP z dowodami i przekazy dla konkretnych grup kandydatów. Na koniec proponuje plan kanałów na kwartał.", "kiedy": "Gdy ogłoszenia przestały przyciągać kandydatów, konkurencja w okolicy płaci więcej, a Ty musisz pokazać zarządowi, dlaczego warto u Was pracować i jak to komunikować.", "brief": [{"pole": "Firma i branża", "opis": "Kim jesteście, np. „producent mebli z Wielkopolski, 220 osób, 30 lat na rynku, rodzinna firma”."}, {"pole": "Grupy docelowe", "opis": "Kogo chcesz przyciągnąć, np. „operatorki i operatorzy CNC, technolodzy produkcji, juniorzy IT”."}, {"pole": "Co naprawdę oferujemy", "opis": "Fakty, nie hasła, np. „umowa o pracę od pierwszego dnia, dowóz z okolicznych wsi, płatne szkolenia na uprawnienia, stabilność – zero zwolnień w kryzysie”."}, {"pole": "Wyniki badań i opinie", "opis": "Co mówią pracownicy, np. „eNPS +18; w exit interview najczęściej brak ścieżki awansu; GoWork 3,6/5”."}, {"pole": "Konkurencja o talenty", "opis": "Z kim walczysz, np. „dwie fabryki w promieniu 30 km, płacą ok. 10% więcej, ale na zmiany 12-godzinne”."}, {"pole": "Kanały i budżet", "opis": "Gdzie i za ile, np. „Pracuj.pl, OLX Praca, Facebook, lokalne radio; ok. 4000 PLN miesięcznie”."}], "prompt": "Jesteś doświadczoną specjalistką ds. employer brandingu, która pracowała z polskimi firmami z sektora MŚP i produkcji. Pomóż mi zbudować EVP (propozycję wartości dla pracowników) i plan komunikacji marki pracodawcy oparty na faktach.\n\nDANE:\nFirma i branża: [FIRMA I BRANŻA]\nGrupy docelowe: [GRUPY DOCELOWE]\nCo naprawdę oferujemy: [CO NAPRAWDĘ OFERUJEMY]\nWyniki badań i opinie pracowników: [WYNIKI BADAŃ I OPINIE]\nKonkurencja o talenty: [KONKURENCJA O TALENTY]\nKanały i budżet: [KANAŁY I BUDŻET]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj benefitów, liczb, wyników badań ani cytatów pracowników – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Każdy filar EVP musi mieć dowód z danych. Jeśli obietnica nie ma pokrycia w rzeczywistości, nazwij to wprost jako ryzyko – rozjazd między przekazem a doświadczeniem pracownika szkodzi marce.\n3. Słabe strony z opinii pracowników potraktuj poważnie: zaproponuj, co zmienić w firmie, a nie tylko jak to ująć w komunikacji.\n4. Przekazy rekrutacyjne: nazwy stanowisk neutralne płciowo, informacja o wynagrodzeniu lub jego przedziale zgodnie z jawnością wynagrodzeń (art. 18³ca KP); przy Dyrektywie UE 2023/970 dopisz „sprawdź aktualny stan prawny”. Kwestie prawne oznacz [DO WERYFIKACJI].\n5. Język prosty i konkretny, bez pustych haseł typu „młody, dynamiczny zespół”.\n\nFORMAT WYNIKU:\nA) Diagnoza w tabeli: mocne strony | słabe strony | luki między przekazem a opiniami pracowników.\nB) EVP: jedno zdanie główne + 3–5 filarów, każdy z dowodem.\nC) Przekaz dla każdej grupy docelowej: nagłówek, 3 argumenty, wezwanie do działania.\nD) Plan kanałów na kwartał w tabeli: kanał | treść | częstotliwość | budżet | wskaźnik.\nE) 5 pomysłów na treści z udziałem pracowników.\nF) Lista „sprawdź przed użyciem”: założenia, luki, punkty do weryfikacji.", "polecenia": ["Skróć EVP do jednego zdania, które zmieści się w stopce ogłoszenia.", "Przygotuj prezentację EVP dla zarządu w 5 slajdach.", "Napisz 3 posty na LinkedIn oparte na filarach EVP.", "Przepisz przekaz dla grupy, która nie szuka aktywnie pracy.", "Dodaj ryzyka: gdzie nasze obietnice mogą się nie obronić.", "Przygotuj ankietę dla pracowników, która zweryfikuje filary EVP (maks. 10 pytań).", "Zrób wersję przekazu na lokalne radio (30 sekund).", "Przetłumacz EVP i przekazy na angielski.", "Przygotuj wersję dla kandydatów z Ukrainy prostym językiem polskim.", "Przygotuj wersję B nagłówków do testu w ogłoszeniach."], "checklista": ["Każdy filar EVP ma potwierdzenie w faktach lub wynikach badań – bez obietnic na wyrost.", "Benefity i warunki opisane w przekazach są aktualne i potwierdzone z kadrami.", "Ogłoszenia zawierają informację o wynagrodzeniu lub przedziale i neutralne płciowo nazwy stanowisk.", "Stan prawny dotyczący jawności wynagrodzeń został sprawdzony na dziś.", "Opinie i cytaty pracowników są użyte za ich zgodą, bez danych pozwalających na identyfikację bez zgody.", "Słabe strony z diagnozy mają właściciela i plan działań, a nie tylko lepsze sformułowania.", "Dokument z elementami prawnymi przejrzały kadry lub prawnik."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. EVP działa tylko wtedy, gdy pracownicy rozpoznają w nim swoją firmę – sprawdź je na kilku osobach przed publikacją."}, {"id": "7.04", "nazwa": "Kampania wewnętrzna", "co_robi": "Planuje kampanię wewnętrzną od koncepcji do pomiaru: hasło, cele, harmonogram tydzień po tygodniu, gotowe teksty materiałów i rolę menedżerów. Sprawdza się przy bezpieczeństwie, wellbeingu, nowych wartościach czy zmianach w procesach.", "kiedy": "Gdy trzeba przekonać ludzi do zmiany zachowań – np. po serii zdarzeń na hali albo przy wprowadzaniu nowych wartości – a jeden mail i plakat na pewno nie wystarczą.", "brief": [{"pole": "Temat i cel kampanii", "opis": "O co chodzi i co ma się zmienić, np. „bezpieczeństwo przy wózkach widłowych: mniej zdarzeń potencjalnie wypadkowych w magazynie”."}, {"pole": "Odbiorcy", "opis": "Do kogo, np. „160 pracowników produkcji na 3 zmianach, w tym ok. 30 osób z Ukrainy”."}, {"pole": "Czas trwania", "opis": "Ile i od kiedy, np. „6 tygodni, start 2 marca”."}, {"pole": "Budżet i zasoby", "opis": "Pieniądze i ludzie, np. „3000 PLN, lokalna drukarnia, 1 osoba z HR na pół etatu, wsparcie służby BHP”."}, {"pole": "Kanały", "opis": "Którędy dotrzesz, np. „tablice, monitory w stołówce, odprawy zmianowe, aplikacja dla pracowników”."}, {"pole": "Jak zmierzymy sukces", "opis": "Wskaźniki, np. „liczba zgłoszeń zdarzeń potencjalnie wypadkowych, udział w quizie, obserwacje brygadzistów”."}], "prompt": "Jesteś doświadczonym specjalistą ds. komunikacji wewnętrznej i zmiany zachowań w polskiej firmie z sektora MŚP. Zaplanuj kampanię wewnętrzną, która realnie zmieni zachowania, a nie skończy się na plakacie.\n\nDANE:\nTemat i cel kampanii: [TEMAT I CEL KAMPANII]\nOdbiorcy: [ODBIORCY]\nCzas trwania: [CZAS TRWANIA]\nBudżet i zasoby: [BUDŻET I ZASOBY]\nKanały: [KANAŁY]\nJak zmierzymy sukces: [JAK ZMIERZYMY SUKCES]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj statystyk, cen, nazwisk ani wyników – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Merytoryka dotycząca BHP, zdrowia lub procedur musi być oznaczona [DO WERYFIKACJI] ze służbą BHP lub właścicielem procesu – AI nie ustala zasad bezpieczeństwa.\n3. Przy tematach wellbeingu nie zbieraj danych o zdrowiu; ankiety tylko anonimowe i dobrowolne. Bez stygmatyzowania, zawstydzania i szukania winnych.\n4. Kampania ma być dostępna dla wszystkich: różne zmiany, osoby bez komputera, osoby, dla których polski nie jest pierwszym językiem.\n5. Menedżerowie i ambasadorzy są kluczowi – daj im gotowe materiały, nie tylko zadania.\n6. Budżet rozpisz realistycznie; kwoty bez danych oznacz [ZAŁOŻENIE].\n\nFORMAT WYNIKU:\nA) Koncepcja: 3 propozycje hasła głównego + komunikat kluczowy w jednym zdaniu.\nB) Cele SMART i wskaźniki w tabeli.\nC) Harmonogram tydzień po tygodniu: tydzień | działanie | kanał | odpowiedzialny.\nD) Gotowe teksty: plakat, post do aplikacji, skrypt na odprawę (2 minuty), mail od lidera.\nE) Rola menedżerów i ambasadorów + ściąga dla nich.\nF) Plan pomiaru i podsumowania kampanii, budżet w tabeli.\nG) Lista „sprawdź przed startem”: założenia, luki, punkty do weryfikacji.", "polecenia": ["Zaproponuj 5 kolejnych wariantów hasła, krótszych i bardziej potocznych.", "Skróć skrypt na odprawę do 60 sekund.", "Przygotuj quiz na 10 pytań do kampanii.", "Dodaj ryzyka: co może pójść nie tak i jak temu zapobiec.", "Przygotuj wersję kampanii przy budżecie o połowę mniejszym.", "Napisz raport z kampanii dla zarządu na podstawie wyników, które ci podam.", "Przygotuj materiały w wersji po angielsku.", "Przygotuj materiały dla pracowników z Ukrainy prostym językiem polskim.", "Przygotuj wersję B plakatu do porównania, który działa lepiej.", "Zaproponuj, jak utrzymać efekt kampanii po jej zakończeniu."], "checklista": ["Treści o BHP, zdrowiu i procedurach zatwierdziła służba BHP lub właściciel procesu.", "Ankiety są anonimowe, dobrowolne i nie zbierają danych o zdrowiu.", "Materiały docierają do wszystkich zmian i osób bez dostępu do komputera.", "Teksty są zrozumiałe dla osób z innym językiem ojczystym; w razie potrzeby są wersje językowe.", "Budżet i kwoty zostały sprawdzone z ofertami, a nie przyjęte z szacunków AI.", "Wskaźniki sukcesu da się realnie zmierzyć danymi, które już masz albo zbierzesz.", "Przekaz nie zawstydza ani nie obwinia konkretnych osób lub grup."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. W kampaniach o bezpieczeństwie ostatnie słowo co do treści zawsze ma służba BHP."}, {"id": "7.05", "nazwa": "Spotkanie firmowe (all-hands / town hall)", "co_robi": "Przygotowuje spotkanie dla całej firmy: agendę z czasami, scenariusz prowadzącego słowo w słowo, przygotowanie do Q&A z odpowiedziami na trudne pytania oraz komunikację przed i po spotkaniu.", "kiedy": "Gdy zbliża się kwartalny town hall albo spotkanie po ważnej zmianie (reorganizacja, słabsze wyniki, nowy dyrektor) i chcesz, żeby nie skończyło się niezręczną ciszą lub falą plotek.", "brief": [{"pole": "Rodzaj i cel spotkania", "opis": "Po co się spotykacie, np. „kwartalny town hall: wyniki Q3 i nowa struktura działu sprzedaży”."}, {"pole": "Uczestnicy i format", "opis": "Kto i gdzie, np. „120 osób, hybrydowo: sala w Łodzi + Teams dla oddziałów”."}, {"pole": "Czas trwania", "opis": "Ile czasu, np. „60 minut, w tym 20 minut na pytania”."}, {"pole": "Prowadzący i mówcy", "opis": "Role, np. „prezes, dyrektorka finansowa, HRBP jako moderatorka”."}, {"pole": "Tematy i trudne kwestie", "opis": "Co omawiacie i co może zaboleć, np. „w tym roku brak podwyżek, odejście dyrektora sprzedaży”."}, {"pole": "Pytania z wyprzedzeniem", "opis": "Pytania zebrane wcześniej, np. „14 anonimowych pytań z formularza – wklejam poniżej”."}], "prompt": "Jesteś doświadczoną HR business partnerką i moderatorką spotkań firmowych w polskich firmach. Pomóż mi przygotować spotkanie all-hands / town hall tak, żeby było konkretne, uczciwe i budowało zaufanie.\n\nDANE:\nRodzaj i cel spotkania: [RODZAJ I CEL SPOTKANIA]\nUczestnicy i format: [UCZESTNICY I FORMAT]\nCzas trwania: [CZAS TRWANIA]\nProwadzący i mówcy: [PROWADZĄCY I MÓWCY]\nTematy i trudne kwestie: [TEMATY I TRUDNE KWESTIE]\nPytania zebrane z wyprzedzeniem: [PYTANIA Z WYPRZEDZENIEM]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj wyników finansowych, liczb, nazwisk ani decyzji – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Uczciwość ponad PR: trudne tematy nazywaj wprost, bez obietnic, których zarząd nie złożył.\n3. Wszystko, co dotyczy zwolnień, reorganizacji, wynagrodzeń lub zmian warunków zatrudnienia, oznacz [DO WERYFIKACJI] z kadrami/prawnikiem przed ogłoszeniem – kolejność i forma komunikacji mogą mieć skutki prawne.\n4. Q&A: chroń anonimowość pytających, nie wskazuj osób ani działów, z których mogło paść pytanie. Jeśli odpowiedź nie jest znana – „sprawdzimy i wrócimy do (termin)”.\n5. Format hybrydowy: osoby zdalne mają równy dostęp do głosu i pytań.\n\nFORMAT WYNIKU:\nA) Agenda w tabeli: czas | punkt | osoba | cel.\nB) Scenariusz prowadzącego słowo w słowo: otwarcie, przejścia między mówcami, zamknięcie.\nC) Q&A: pytania pogrupowane tematycznie, propozycje odpowiedzi, 5 trudnych pytań, które mogą paść na żywo, z bezpiecznymi odpowiedziami.\nD) Zaproszenie na spotkanie i mail podsumowujący po nim.\nE) Lista techniczna dla formatu hybrydowego.\nF) Lista „sprawdź przed spotkaniem”: założenia, luki, punkty do weryfikacji.", "polecenia": ["Skróć spotkanie do 30 minut i powiedz, co wypada.", "Przepisz otwarcie prezesa, żeby brzmiało mniej oficjalnie.", "Przygotuj odpowiedź na pytanie: „Czy będą zwolnienia?”, jeśli nic nie jest jeszcze przesądzone.", "Dodaj ryzyka: które momenty spotkania mogą wywołać napięcie.", "Przygotuj krótką ankietę po spotkaniu (maks. 5 pytań).", "Napisz wersję podsumowania na Teams lub Slack w 5 punktach.", "Przygotuj ściągę dla menedżerów na rozmowy z zespołami po spotkaniu.", "Przetłumacz scenariusz na angielski dla mówcy z centrali.", "Przygotuj wersję podsumowania dla pracowników z Ukrainy prostym językiem polskim.", "Zaproponuj interaktywny element na start, który przełamie lody."], "checklista": ["Liczby i wyniki pokazywane na spotkaniu potwierdził dział finansów.", "Komunikaty o zwolnieniach, reorganizacji czy wynagrodzeniach przejrzały kadry lub prawnik przed spotkaniem.", "Menedżerowie znają przekaz wcześniej i nie dowiadują się o zmianach razem z zespołem.", "Anonimowe pytania nie pozwalają zidentyfikować autorów.", "Osoby zdalne mają działający kanał na pytania i dobry dźwięk.", "Na pytania bez odpowiedzi jest wyznaczony termin i osoba, która wróci z informacją.", "Do AI nie trafiły dane osobowe ani poufne informacje finansowe ponad to, co niezbędne."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Przy tematach kadrowych na forum firmy najpierw ustal z kadrami, co i kiedy wolno już powiedzieć."}, {"id": "7.06", "nazwa": "Wydarzenie firmowe", "co_robi": "Planuje wydarzenie firmowe – integrację, spotkanie świąteczne, dzień otwarty czy piknik rodzinny: koncepcję, budżet, harmonogram przygotowań, scenariusz dnia i komunikację. Dba o to, żeby każdy czuł się zaproszony.", "kiedy": "Gdy zarząd mówi „zróbmy w tym roku porządną wigilię firmową”, budżet jest ograniczony, a organizacja spada na Ciebie obok codziennej pracy.", "brief": [{"pole": "Rodzaj wydarzenia", "opis": "Co organizujesz, np. „wigilia firmowa”, „dzień otwarty dla rodzin pracowników”, „integracja działów po fuzji”."}, {"pole": "Uczestnicy i miejsce", "opis": "Ile osób, gdzie i kiedy, np. „70 osób, restauracja w Gdańsku, piątek 12 grudnia po pracy”."}, {"pole": "Budżet", "opis": "Kwota i co obejmuje, np. „9000 PLN brutto łącznie, bez transportu”."}, {"pole": "Cel i klimat", "opis": "Po co i w jakim nastroju, np. „podziękowanie za rok, integracja biura z produkcją, bez przymusu i przemówień na godzinę”."}, {"pole": "Potrzeby uczestników", "opis": "Bez danych o zdrowiu konkretnych osób, ogólnie, np. „osoba poruszająca się na wózku, wegetarianie, część osób nie pije alkoholu, różne wyznania, rodzice małych dzieci”."}, {"pole": "Zespół organizacyjny", "opis": "Kto pomaga, np. „HR + 2 osoby z zespołu wolontariuszy, bez agencji eventowej”."}], "prompt": "Jesteś doświadczoną specjalistką HR, która zorganizowała dziesiątki wydarzeń firmowych w polskich firmach z sektora MŚP. Pomóż mi zaplanować wydarzenie, które ludzie zapamiętają dobrze i w którym każdy poczuje się mile widziany.\n\nDANE:\nRodzaj wydarzenia: [RODZAJ WYDARZENIA]\nUczestnicy, miejsce i termin: [UCZESTNICY I MIEJSCE]\nBudżet: [BUDŻET]\nCel i klimat: [CEL I KLIMAT]\nPotrzeby uczestników: [POTRZEBY UCZESTNIKÓW]\nZespół organizacyjny: [ZESPÓŁ ORGANIZACYJNY]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj cen, nazw lokali ani dostawców – szacunki oznacz [ZAŁOŻENIE], luki [DO UZUPEŁNIENIA].\n2. Inkluzywność: udział dobrowolny, dostępność architektoniczna, opcje dietetyczne i bezalkoholowe, alkohol nie jest centrum programu, godziny przyjazne rodzicom, nazwa i program bez wykluczania osób innych wyznań.\n3. Kwestie podatkowe, finansowanie z ZFŚS, ubezpieczenie i umowy z dostawcami oznacz [DO WERYFIKACJI] z księgowością/kadrami – nie podawaj zasad z pamięci.\n4. Bezpieczeństwo: powrót do domu, zasady zachowania, osoba kontaktowa na miejscu.\n5. Nie zbieraj danych o zdrowiu – potrzeby żywieniowe i dostępnościowe zbieraj ogólnie i dobrowolnie.\n\nFORMAT WYNIKU:\nA) 2–3 warianty koncepcji z plusami i minusami.\nB) Budżet w tabeli: pozycja | szacunek | uwagi.\nC) Harmonogram przygotowań tydzień po tygodniu wstecz od daty wydarzenia.\nD) Scenariusz dnia godzina po godzinie.\nE) Komunikacja: zaproszenie, przypomnienie, podziękowanie z krótką ankietą.\nF) Plan inkluzywności i bezpieczeństwa.\nG) Lista „sprawdź przed użyciem”: założenia, luki, punkty do weryfikacji.", "polecenia": ["Zaproponuj wariant wydarzenia w godzinach pracy.", "Zmniejsz budżet o 30% i powiedz, z czego zrezygnować.", "Napisz zaproszenie w luźniejszym tonie.", "Przygotuj formularz zgłoszeń z pytaniami o dietę i dostępność.", "Dodaj ryzyka: co może pójść nie tak w dniu wydarzenia.", "Przygotuj krótkie przemówienie prezesa na 2 minuty.", "Zaproponuj atrakcje dla osób, które nie lubią zabaw integracyjnych.", "Przygotuj wersję zaproszenia na Teams lub Slack.", "Przetłumacz zaproszenie na angielski.", "Przygotuj zaproszenie dla pracowników z Ukrainy prostym językiem polskim."], "checklista": ["Budżet opiera się na prawdziwych ofertach, a nie na szacunkach AI.", "Sposób finansowania (np. ZFŚS) i kwestie podatkowe potwierdziła księgowość lub kadry.", "Miejsce jest dostępne architektonicznie i ma opcje dla osób niepijących alkoholu oraz z różnymi dietami.", "Udział jest dobrowolny, a zaproszenie nie wywiera presji.", "Formularz zgłoszeń nie zbiera danych o zdrowiu ponad to, co uczestnik sam chce przekazać.", "Jest plan bezpiecznego powrotu i osoba kontaktowa na miejscu.", "Umowy z lokalem i dostawcami przejrzała osoba upoważniona do ich podpisania."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Zasady finansowania wydarzeń i ich rozliczenia podatkowego zawsze potwierdź z księgowością."}, {"id": "7.07", "nazwa": "Scenariusz wideo rekrutacyjnego lub onboardingowego", "co_robi": "Pisze scenariusz krótkiego wideo – rekrutacyjnego, employer brandingowego lub onboardingowego: hook, scenopis z ujęciami, tekst lektora i napisy. Dodaje listę ujęć do nagrania telefonem i checklistę zgód na wizerunek.", "kiedy": "Gdy chcesz nagrać autentyczne wideo z pracownikami do ogłoszenia lub social mediów, ale nie masz agencji ani doświadczenia w pisaniu scenariuszy.", "brief": [{"pole": "Cel i rodzaj wideo", "opis": "Po co i gdzie, np. „wideo rekrutacyjne na stanowisko magazyniera/magazynierki do ogłoszeń na OLX Praca i Facebooku”."}, {"pole": "Długość i format", "opis": "Ile i w jakim formacie, np. „60 sekund, pionowo 9:16, napisy obowiązkowe”."}, {"pole": "Kto występuje", "opis": "Role, nie nazwiska, np. „2 osoby z magazynu i kierowniczka zmiany – wstępnie zgodzili się wystąpić”."}, {"pole": "Kluczowe przekazy", "opis": "Co ma wybrzmieć, np. „stała praca na umowie o pracę, premia frekwencyjna, nowoczesny magazyn, wynagrodzenie 5200–5800 PLN brutto”."}, {"pole": "Miejsce i możliwości nagrania", "opis": "Warunki, np. „magazyn w Strykowie, nagrywamy telefonem, bez profesjonalnej ekipy, 2 godziny na zdjęcia”."}, {"pole": "Ton", "opis": "Jak ma brzmieć, np. „autentycznie, bez korpomowy, z odrobiną humoru”."}], "prompt": "Jesteś doświadczonym scenarzystą wideo employer brandingowych i rekrutacyjnych dla polskich firm. Napisz scenariusz krótkiego wideo, które da się nagrać prostymi środkami i które brzmi autentycznie.\n\nDANE:\nCel i rodzaj wideo: [CEL I RODZAJ WIDEO]\nDługość i format: [DŁUGOŚĆ I FORMAT]\nKto występuje: [KTO WYSTĘPUJE]\nKluczowe przekazy: [KLUCZOWE PRZEKAZY]\nMiejsce i możliwości nagrania: [MIEJSCE I MOŻLIWOŚCI NAGRANIA]\nTon: [TON]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj benefitów, kwot ani cytatów pracowników – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Wypowiedzi pracowników pisz jako propozycje do ich własnych słów, nie jako tekst do wyuczenia.\n3. Wideo rekrutacyjne: nazwa stanowiska neutralna płciowo; wynagrodzenie, jeśli je podano, zgodnie z jawnością wynagrodzeń (art. 18³ca KP). Kwestie prawne oznacz [DO WERYFIKACJI].\n4. Wizerunek: każda osoba w kadrze potrzebuje pisemnej, dobrowolnej zgody na utrwalenie i publikację wizerunku (cel, kanały, czas publikacji, możliwość wycofania; RODO) – wzór zgody [DO WERYFIKACJI] z prawnikiem. Brak zgody nie może mieć dla pracownika żadnych konsekwencji.\n5. W kadrze: zasady BHP (odzież, środki ochrony), żadnych ekranów i dokumentów z danymi osobowymi.\n6. Pierwsze 3 sekundy mają zatrzymać widza; napisy dla oglądających bez dźwięku.\n\nFORMAT WYNIKU:\nA) Koncepcja w 2 zdaniach + 3 warianty hooka.\nB) Scenopis w tabeli: nr | czas | ujęcie | kto/co | tekst lektora lub wypowiedź | napis na ekranie.\nC) Pełny tekst lektora.\nD) Napisy do wgrania w krótkich liniach.\nE) Lista ujęć do nagrania telefonem + wskazówki (światło, dźwięk, kadr).\nF) Checklista zgód i RODO.\nG) Lista „sprawdź przed publikacją”: założenia, luki, punkty do weryfikacji.", "polecenia": ["Skróć scenariusz do 30 sekund.", "Przygotuj wersję 15-sekundową na reklamę.", "Napisz wersję bez lektora – tylko napisy i wypowiedzi pracowników.", "Zmień ton na bardziej poważny i rzeczowy.", "Przygotuj pytania do pracowników, żeby ich wypowiedzi były naturalne.", "Napisz opis do posta i ogłoszenia, w którym wideo będzie osadzone.", "Przygotuj wersję onboardingową: „Twój pierwszy dzień u nas”.", "Przetłumacz napisy na angielski.", "Przygotuj napisy dla kandydatów z Ukrainy prostym językiem polskim.", "Przygotuj wersję B hooka do testu w reklamie."], "checklista": ["Każda osoba widoczna w kadrze podpisała zgodę na wizerunek z określonym celem, kanałami i czasem publikacji.", "Wzór zgody przejrzał prawnik lub osoba odpowiedzialna za RODO w firmie.", "W kadrze nie widać danych osobowych, ekranów systemów ani dokumentów.", "Ujęcia na produkcji lub w magazynie pokazują pracę zgodną z zasadami BHP.", "Wynagrodzenie i benefity w wideo są aktualne i zgodne z ogłoszeniem.", "Nazwa stanowiska jest neutralna płciowo.", "Wideo ma napisy i jest zrozumiałe bez dźwięku."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Wideo z pracownikami publikuj dopiero po zebraniu wszystkich zgód – wycofanie nagrania po publikacji jest dużo trudniejsze niż jego wstrzymanie."}, {"id": "7.08", "nazwa": "Brief dla grafika lub agencji", "co_robi": "Układa profesjonalny brief kreatywny do materiałów HR i employer brandingowych: cel, odbiorcy, insight, przekaz, ton, formaty, terminy i kryteria akceptacji. Dodaje teksty do grafik, listę rzeczy do uniknięcia i mail do wykonawcy.", "kiedy": "Gdy zlecasz grafikowi lub agencji materiały rekrutacyjne czy kampanię wewnętrzną i chcesz uniknąć pięciu rund poprawek, bo „nie o to chodziło”.", "brief": [{"pole": "Projekt i materiały", "opis": "Co ma powstać, np. „seria 5 grafik na LinkedIn + plakat A3 do kampanii rekrutacyjnej programistów i programistek”."}, {"pole": "Cel i odbiorcy", "opis": "Po co i dla kogo, np. „programiści backend z 3+ latami doświadczenia, którzy mało o nas wiedzą”."}, {"pole": "Główny przekaz", "opis": "Co ma zostać w głowie, np. „rozwijasz własny produkt, a nie projekty dla klientów; praca w 100% zdalna”."}, {"pole": "Identyfikacja wizualna", "opis": "Co już macie, np. „logo, granat i limonka, font Inter, księga znaku w załączniku”."}, {"pole": "Budżet i terminy", "opis": "Ile i kiedy, np. „6000 PLN netto, pierwsze koncepcje do 15 maja, publikacja 1 czerwca”."}, {"pole": "Wykonawca", "opis": "Komu zlecasz, np. „freelancerka znaleziona na Behance” albo „agencja, z którą pracujemy pierwszy raz”."}], "prompt": "Jesteś doświadczonym specjalistą ds. employer brandingu, który od lat pisze briefy dla grafików i agencji kreatywnych w Polsce. Przygotuj brief kreatywny tak jasny, żeby wykonawca trafił za pierwszym razem.\n\nDANE:\nProjekt i materiały: [PROJEKT I MATERIAŁY]\nCel i odbiorcy: [CEL I ODBIORCY]\nGłówny przekaz: [GŁÓWNY PRZEKAZ]\nIdentyfikacja wizualna: [IDENTYFIKACJA WIZUALNA]\nBudżet i terminy: [BUDŻET I TERMINY]\nWykonawca: [WYKONAWCA]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj kolorów marki, fontów, kwot ani terminów – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Brief ma być konkretny: liczba materiałów, formaty i wymiary, liczba rund poprawek, kryteria akceptacji.\n3. Materiały rekrutacyjne: nazwy stanowisk neutralne płciowo, informacja o wynagrodzeniu lub przedziale zgodnie z jawnością wynagrodzeń (art. 18³ca KP); różnorodność w zdjęciach i ilustracjach, bez stockowych klisz.\n4. Prawa autorskie: przeniesienie praw lub licencja, pola eksploatacji, pliki źródłowe – oznacz [DO WERYFIKACJI] z prawnikiem, nie podawaj gotowych zapisów umownych.\n5. Zdjęcia pracowników tylko za ich zgodą na wizerunek; nie przekazuj wykonawcy danych osobowych ponad potrzebę.\n\nFORMAT WYNIKU:\nA) Brief w tabeli: tło | cel | odbiorcy | insight | przekaz | ton | elementy obowiązkowe | formaty i wymiary | lista materiałów | harmonogram | budżet | kryteria akceptacji.\nB) Teksty do grafik: 3 warianty nagłówka + podpis i wezwanie do działania.\nC) Lista „czego unikać”.\nD) 5 pytań do wykonawcy przed startem.\nE) Mail do wykonawcy z briefem.\nF) Lista „sprawdź przed wysłaniem”: założenia, luki, punkty do weryfikacji.", "polecenia": ["Skróć brief do jednej strony.", "Dodaj sekcję z inspiracjami do opisania słowami (bez linków).", "Przygotuj wersję briefu dla wideo zamiast grafik.", "Napisz 5 kolejnych wariantów nagłówka, krótszych.", "Przygotuj kryteria oceny koncepcji, które zaprezentuje agencja.", "Napisz mail z feedbackiem do pierwszej koncepcji na podstawie moich uwag.", "Dodaj ryzyka: gdzie brief może być źle zrozumiany.", "Przetłumacz brief na angielski dla zagranicznego wykonawcy.", "Przygotuj wersję B przekazu do testu w reklamach.", "Przygotuj listę plików, które muszę dostać po zakończeniu projektu."], "checklista": ["Kolory, fonty i logo zgadzają się z księgą znaku, a nie z założeniami AI.", "Budżet, terminy i liczba rund poprawek są jasno zapisane.", "Kwestie praw autorskich i licencji przejrzał prawnik przed podpisaniem umowy.", "Materiały rekrutacyjne mają neutralne płciowo nazwy stanowisk i informację o wynagrodzeniu.", "Na zdjęcia pracowników są zgody na wizerunek.", "Wykonawca nie dostaje danych osobowych pracowników ani kandydatów ponad niezbędne minimum.", "Kryteria akceptacji są mierzalne, a nie „ma się podobać”."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Zanim zaakceptujesz projekt, upewnij się, że umowa jasno określa, jakie prawa do materiałów otrzymuje firma."}, {"id": "7.09", "nazwa": "Newsletter wewnętrzny", "co_robi": "Projektuje strukturę newslettera wewnętrznego i pisze teksty do konkretnego wydania: tytuły, temat maila, sekcje stałe i bieżące, wersję skróconą na komunikator. Pilnuje, żeby dało się go przeczytać na telefonie w kilka minut.", "kiedy": "Gdy co miesiąc musisz wypuścić newsletter, materiały spływają w ostatniej chwili, a otwieralność spada, bo każde wydanie wygląda tak samo.", "brief": [{"pole": "Firma i odbiorcy", "opis": "Kto czyta i jak, np. „firma logistyczna, 300 osób: biuro + kierowcy, którzy czytają na telefonie w przerwie”."}, {"pole": "Częstotliwość i kanał", "opis": "Jak często i gdzie, np. „co miesiąc, mail + wydruk PDF na tablicach w bazach”."}, {"pole": "Tematy tego wydania", "opis": "Co ma się znaleźć, np. „nowy klient z branży spożywczej, wyniki BHP za kwartał, 3 jubileusze 10-lecia pracy, zmiana w karcie sportowej”."}, {"pole": "Stałe sekcje", "opis": "Co jest w każdym wydaniu, np. „słowo zarządu, nowe osoby w zespole, kalendarz, pytanie miesiąca”."}, {"pole": "Ton i długość", "opis": "Jak ma brzmieć, np. „luźno, po imieniu, maks. 3 minuty czytania”."}], "prompt": "Jesteś doświadczoną redaktorką komunikacji wewnętrznej w polskiej firmie z sektora MŚP. Przygotuj newsletter wewnętrzny, który ludzie naprawdę otwierają i czytają do końca.\n\nDANE:\nFirma i odbiorcy: [FIRMA I ODBIORCY]\nCzęstotliwość i kanał: [CZĘSTOTLIWOŚĆ I KANAŁ]\nTematy tego wydania: [TEMATY TEGO WYDANIA]\nStałe sekcje: [STAŁE SEKCJE]\nTon i długość: [TON I DŁUGOŚĆ]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj faktów, liczb, nazwisk, cytatów ani wydarzeń – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Dane osobowe: imiona, zdjęcia, jubileusze i powitania nowych osób publikuj tylko za zgodą zainteresowanych; nie podawaj dat urodzenia, informacji o zdrowiu, sytuacji rodzinnej ani powodów odejść.\n3. Zmiany w benefitach, wynagrodzeniach czy zasadach pracy opisuj tylko na podstawie przekazanych danych i oznacz [DO WERYFIKACJI] z kadrami.\n4. Pisz krótko, z nagłówkami, pod czytanie na telefonie: najważniejsze na górze, akapity do 3 zdań, jeden link lub działanie na sekcję.\n5. Język prosty, inkluzywny i neutralny płciowo; uwzględnij osoby bez komputera.\n\nFORMAT WYNIKU:\nA) Struktura wydania w tabeli: sekcja | cel | długość | kto dostarcza treść.\nB) 5 propozycji tytułu wydania + temat maila + preheader.\nC) Gotowe teksty wszystkich sekcji.\nD) Wersja skrócona na Teams, Slack lub SMS (maks. 5 punktów).\nE) Pomysł na sekcję interaktywną (quiz, pytanie miesiąca, ankieta) z treścią.\nF) Lista „sprawdź przed wysyłką”: zgody, założenia, luki, punkty do weryfikacji.", "polecenia": ["Skróć całe wydanie o 40%.", "Przepisz słowo zarządu, żeby brzmiało mniej oficjalnie.", "Przygotuj wersję do wydruku na tablicę (jedna strona A4).", "Napisz 3 warianty tematu maila do testu A/B.", "Zaproponuj stałe sekcje na kolejne 6 wydań.", "Przygotuj prośbę do menedżerów o materiały do następnego numeru.", "Przygotuj wzór zgody pracownika na publikację imienia i zdjęcia w newsletterze.", "Przetłumacz newsletter na angielski.", "Przygotuj wersję dla pracowników z Ukrainy prostym językiem polskim.", "Zaproponuj, jak zmierzyć, czy newsletter jest czytany."], "checklista": ["Osoby wymienione z imienia lub pokazane na zdjęciach zgodziły się na publikację.", "W tekście nie ma dat urodzenia, informacji o zdrowiu ani innych danych wrażliwych.", "Fakty, liczby i daty potwierdzili autorzy poszczególnych sekcji.", "Informacje o benefitach i zasadach pracy sprawdziły kadry.", "Wydanie czyta się wygodnie na telefonie, a linki działają.", "Pracownicy bez dostępu do maila dostają wersję drukowaną lub skróconą.", "Język jest neutralny płciowo i zrozumiały dla wszystkich grup pracowników."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Zanim wyślesz wydanie, sprawdź zgody na publikację imion i zdjęć – to najczęstsza wpadka w newsletterach wewnętrznych."}, {"id": "7.10", "nazwa": "Metryki komunikacji i employer brandingu", "co_robi": "Układa mapę wskaźników komunikacji wewnętrznej i employer brandingu, analizuje Twoje dane i przygotowuje krótki raport dla zarządu z rekomendacjami. Mówi też wprost, których danych brakuje i jak je zbierać.", "kiedy": "Gdy zarząd pyta „co nam dają te wszystkie posty i newslettery?”, a Ty masz rozproszone liczby z maila, LinkedIna, Pracuj.pl i GoWork i musisz z nich zrobić sensowny raport.", "brief": [{"pole": "Kanały i działania", "opis": "Co prowadzisz, np. „newsletter wewnętrzny, intranet, firmowy LinkedIn, kampania rekrutacyjna na Pracuj.pl, program poleceń”."}, {"pole": "Dostępne dane", "opis": "Liczby, które masz, np. „otwieralność newslettera 41%, 3200 obserwujących na LinkedIn, 180 aplikacji w kwartale, ocena GoWork 3,4/5”."}, {"pole": "Cele biznesowe", "opis": "Na co ma to pracować, np. „skrócić czas rekrutacji magazynierów, zwiększyć udział poleceń pracowniczych”."}, {"pole": "Okres i porównanie", "opis": "Jaki okres i do czego porównujesz, np. „Q3 2026 vs Q2 2026”."}, {"pole": "Odbiorca raportu", "opis": "Dla kogo, np. „zarząd – jedna strona, bez żargonu marketingowego”."}], "prompt": "Jesteś doświadczonym analitykiem HR i employer brandingu, który pomaga polskim firmom z sektora MŚP mierzyć efekty komunikacji wewnętrznej i rekrutacyjnej. Przeanalizuj moje dane i przygotuj raport z rekomendacjami.\n\nDANE:\nKanały i działania: [KANAŁY I DZIAŁANIA]\nDostępne dane: [DOSTĘPNE DANE]\nCele biznesowe: [CELE BIZNESOWE]\nOkres i porównanie: [OKRES I PORÓWNANIE]\nOdbiorca raportu: [ODBIORCA RAPORTU]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj liczb, benchmarków rynkowych ani trendów – luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Oddzielaj fakty od interpretacji. Przy małych próbach (np. kilkanaście aplikacji, kilka opinii) zaznacz, że wniosek jest niepewny. Korelacja to nie przyczyna.\n3. Łącz wskaźniki komunikacyjne (otwarcia, zaangażowanie, zasięgi) z biznesowymi (liczba i jakość aplikacji ze źródeł, czas rekrutacji, polecenia, rotacja, opinie np. na GoWork).\n4. RODO: pracuj tylko na danych zagregowanych; nie analizuj zachowań konkretnych pracowników i nie próbuj ustalać autorów anonimowych opinii.\n5. Raport dla odbiorcy ma być krótki, bez żargonu, z jasnym „co z tego wynika”.\n\nFORMAT WYNIKU:\nA) Mapa KPI w tabeli: obszar | wskaźnik | jak liczyć | źródło | częstotliwość | cel.\nB) Analiza danych: co rośnie, co spada, wnioski z poziomem pewności (wysoki/średni/niski).\nC) Brakujące dane i prosty sposób ich zbierania.\nD) Raport na jedną stronę dla odbiorcy.\nE) 3–5 rekomendacji z priorytetem i szacowanym nakładem pracy.\nF) Szablon prostego dashboardu w arkuszu (kolumny i wzory opisane słowami).\nG) Lista „sprawdź przed użyciem”: założenia, luki, punkty do weryfikacji.", "polecenia": ["Skróć raport do 5 punktów na slajd dla zarządu.", "Przygotuj wersję raportu na Teams lub Slack.", "Dodaj ryzyka: które wnioski mogą być błędne i dlaczego.", "Zaproponuj 3 wskaźniki, które warto zacząć mierzyć od przyszłego kwartału.", "Przygotuj ankietę pulse o komunikacji wewnętrznej (maks. 6 pytań).", "Przeanalizuj opinie z GoWork, które wkleję (bez danych autorów), i pogrupuj tematy.", "Przygotuj odpowiedzi firmy na 3 krytyczne opinie w portalu z opiniami.", "Policz koszt pozyskania aplikacji z każdego źródła na podstawie danych, które podam.", "Przetłumacz raport na angielski dla centrali.", "Przygotuj plan testu A/B dla tematów newslettera na kolejny kwartał."], "checklista": ["Wszystkie liczby w raporcie pochodzą z Twoich źródeł – AI nie dopisała benchmarków ani danych z pamięci.", "Wnioski z małych prób są oznaczone jako niepewne.", "Raport opiera się na danych zagregowanych, bez analizy konkretnych osób.", "Odpowiedzi na opinie w portalach nie ujawniają danych osobowych ani szczegółów zatrudnienia autorów.", "Rekomendacje mają właściciela, termin i sposób sprawdzenia efektu.", "Do AI nie trafiły dane osobowe kandydatów ani pracowników – tylko zestawienia."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Zanim pokażesz raport zarządowi, sprawdź, czy każda liczba ma źródło, które potrafisz wskazać."}]}], "bonusy": {"jawnosc": {"tytul": "Kit: jawność wynagrodzeń w rekrutacji i w firmie", "wstep": "Od 24.12.2025 obowiązuje art. 18³ca Kodeksu pracy, który zmienia sposób prowadzenia rekrutacji. Kandydatka lub kandydat musi otrzymać informację o wynagrodzeniu (początkowym albo jego przedziale), opartą na obiektywnych, neutralnych płciowo kryteriach — w ogłoszeniu o pracę, przed rozmową kwalifikacyjną albo przed zawarciem umowy. Ogłoszenia i nazwy stanowisk mają być neutralne płciowo, a pytanie kandydata o obecne lub poprzednie wynagrodzenie jest zakazane. To dopiero pierwszy krok: dyrektywa UE 2023/970 o przejrzystości wynagrodzeń (termin wdrożenia: 7.06.2026) idzie dalej — daje pracownikom prawo do informacji o poziomach wynagrodzeń, wymaga jasnych kryteriów ustalania wynagrodzeń i progresji oraz wprowadza raportowanie luki płacowej. Ten kit pomoże Ci uporządkować rekrutację już dziś i przygotować firmę na kolejne etapy. Sprawdź aktualny stan prawny — polska ustawa wdrażająca dyrektywę może się zmieniać, a szczegóły warto potwierdzić z prawnikiem lub kadrami.", "ogloszenie_szablon": "{Nazwa stanowiska w formie neutralnej płciowo, np. Specjalista/Specjalistka ds. {obszar} (K/M/X) albo Osoba na stanowisko {nazwa}}\n\n{Nazwa firmy} | {Miasto} / {praca zdalna / hybrydowa / stacjonarna} | {Dział}\n\nWynagrodzenie: {kwota od} – {kwota do} PLN {brutto / netto} miesięcznie, {umowa o pracę / umowa zlecenie / B2B (kwota netto + VAT)}\nPrzedział ustaliliśmy na podstawie obiektywnych kryteriów: zakresu odpowiedzialności, wymaganych umiejętności i doświadczenia oraz warunków pracy na tym stanowisku. Miejsce w przedziale zależy od {np. poziomu doświadczenia w obszarze X i samodzielności w zadaniu Y}.\n\nKim jesteśmy\n{2–3 zdania o firmie: czym się zajmujecie, ile osób liczy zespół, co jest dla Was ważne}.\n\nCzym się zajmiesz\n• {zadanie 1}\n• {zadanie 2}\n• {zadanie 3}\n• {zadanie 4}\n\nCzego oczekujemy\n• {wymaganie konieczne 1 — związane z pracą, mierzalne}\n• {wymaganie konieczne 2}\n• {wymaganie konieczne 3}\n\nMile widziane\n• {umiejętność dodatkowa 1}\n• {umiejętność dodatkowa 2}\n\nCo oferujemy\n• {forma zatrudnienia i wymiar etatu}\n• {benefity, np. prywatna opieka medyczna, karta sportowa, PPK, budżet szkoleniowy}\n• {elastyczność: godziny pracy, praca zdalna}\n• {ścieżka rozwoju / zasady podwyżek, jeśli są opisane w firmie}\n\nJak wygląda proces rekrutacji\n1. Analiza CV — odpowiemy w ciągu {liczba} dni roboczych.\n2. Krótka rozmowa telefoniczna lub online ({czas} min).\n3. {Zadanie praktyczne / rozmowa z managerem}.\n4. Decyzja i informacja zwrotna — także wtedy, gdy nie przejdziesz dalej.\n\nZapraszamy do aplikowania wszystkie osoby, niezależnie od płci, wieku, niepełnosprawności, pochodzenia, wyznania czy orientacji. Jeśli potrzebujesz dostosowań w procesie rekrutacji, napisz do nas: {adres e-mail}.\n\nNie prosimy o informację o Twoim obecnym ani poprzednim wynagrodzeniu.\n\nAplikuj do {data} przez {link / adres e-mail}. Prosimy o dołączenie zgody na przetwarzanie danych osobowych na potrzeby tej rekrutacji{, a jeśli chcesz — także przyszłych rekrutacji}. Klauzulę informacyjną RODO znajdziesz tutaj: {link}.\n\nWzór do weryfikacji — dostosuj do swojej firmy.", "checklista_18_3ca": ["Każde ogłoszenie zawiera wynagrodzenie lub jego przedział (z informacją brutto/netto i formą umowy) — a jeśli nie publikujesz go w ogłoszeniu, masz zapisaną procedurę, kto i kiedy przekazuje tę informację kandydatowi: przed rozmową kwalifikacyjną albo najpóźniej przed zawarciem umowy.", "Przedział wynagrodzenia wynika z obiektywnych, neutralnych płciowo kryteriów (zakres obowiązków, umiejętności, odpowiedzialność, warunki pracy) i potrafisz te kryteria wskazać na piśmie.", "Nazwy stanowisk są neutralne płciowo (forma żeńska i męska, oznaczenie K/M/X albo opis typu „osoba na stanowisko…”) — także w systemie ATS, na stronie kariery i na portalach typu Pracuj.pl, LinkedIn, justjoin.it, OLX Praca.", "Treść ogłoszeń nie zawiera sformułowań sugerujących preferowaną płeć, wiek czy sytuację rodzinną (np. „młody, dynamiczny zespół”, „dyspozycyjny kandydat”, „idealny dla studentki”).", "Formularze aplikacyjne, ATS i ankiety rekrutacyjne nie mają pola „obecne / oczekiwane wynagrodzenie na poprzednim stanowisku” ani pytań o historię wynagrodzeń — pytasz najwyżej o oczekiwania finansowe.", "Scenariusze rozmów i listy pytań zostały przejrzane: usunięte są pytania o obecne i poprzednie zarobki, stan cywilny, dzieci, ciążę, wiek, zdrowie, wyznanie.", "Rekruterzy, managerowie i osoby z zewnętrznych agencji przeszli krótkie szkolenie z nowych zasad i wiedzą, co odpowiedzieć, gdy kandydat sam zacznie mówić o swoich zarobkach.", "Umowy z agencjami rekrutacyjnymi i job boardami uwzględniają nowe wymogi (widełki, neutralne nazwy, brak pytań o historię wynagrodzeń).", "Kryteria oceny kandydatów są spisane przed startem rekrutacji i takie same dla wszystkich osób na danym etapie.", "Dokumentujesz proces: wersję ogłoszenia, datę i sposób przekazania informacji o wynagrodzeniu, kryteria oceny i uzasadnienie decyzji — z zachowaniem zasad RODO i okresów przechowywania.", "Oferta zatrudnienia mieści się w przedziale komunikowanym kandydatowi, a ewentualne odstępstwo ma pisemne, obiektywne uzasadnienie.", "Raz na kwartał robisz przegląd losowo wybranych ogłoszeń i formularzy; wątpliwe przypadki konsultujesz z prawnikiem lub kadrami."], "siatka_kroki": ["Zbierz dane: lista stanowisk, liczba osób, aktualne wynagrodzenia zasadnicze i dodatki, forma zatrudnienia, wymiar etatu, płeć (do analizy luki — przechowywana i przetwarzana zgodnie z RODO, w wąskim gronie). Do AI wklejaj wyłącznie dane zanonimizowane.", "Uporządkuj opisy stanowisk: dla każdego stanowiska spisz cel, główne zadania, wymagane kompetencje i zakres odpowiedzialności. Bez aktualnych opisów nie da się rzetelnie wartościować.", "Wybierz metodę wartościowania stanowisk (np. prostą metodę punktową) i oprzyj ją na czterech neutralnych płciowo kryteriach: umiejętności, wysiłek, odpowiedzialność, warunki pracy. Każde kryterium opisz w kilku poziomach.", "Oceń stanowiska w małym zespole (HR + co najmniej dwóch managerów z różnych obszarów). Oceniacie stanowisko, a nie osobę, która je zajmuje. Zapisz uzasadnienie punktacji.", "Pogrupuj stanowiska o podobnej liczbie punktów w kategorie (grade’y) — stanowiska w jednej kategorii to praca o tej samej lub jednakowej wartości, nawet jeśli są w różnych działach.", "Dla każdej kategorii ustal przedział min–mid–max, korzystając z danych wewnętrznych i rzetelnych raportów płacowych. Przedziały kolejnych kategorii mogą na siebie lekko zachodzić.", "Spisz zasady poruszania się w przedziale i awansu do wyższej kategorii (kryteria progresji): od czego zależy miejsce w widełkach, jak często są przeglądy, kto decyduje.", "Nanieś osoby na siatkę: sprawdź, kto jest poniżej minimum lub powyżej maksimum, i porównaj średnie wynagrodzenia kobiet i mężczyzn w każdej kategorii. Każdą różnicę opisz: czy ma obiektywne uzasadnienie?", "Przygotuj plan korekt (budżet, harmonogram, priorytety) dla nieuzasadnionych różnic i osób poniżej minimum. Plan zatwierdza zarząd.", "Zakomunikuj siatkę: managerom (jak z niej korzystać i jak rozmawiać o wynagrodzeniach), pracownikom (kryteria i zasady progresji), a widełki wykorzystuj w ogłoszeniach. Wpisz przegląd siatki do kalendarza — co najmniej raz w roku. Rozwiązania o skutkach prawnych (np. zmiany w regulaminie wynagradzania) skonsultuj z prawnikiem."], "pytania_zakazane": [{"zle": "Ile zarabia Pan/Pani obecnie? Ile zarabiał(a) Pan/Pani w poprzedniej pracy?", "dobrze": "Nie pytaj o historię wynagrodzeń. Podaj przedział przewidziany dla stanowiska i zapytaj: „Czy ten przedział odpowiada Pani/Pana oczekiwaniom?” albo „Jakie są Pani/Pana oczekiwania finansowe wobec tej roli?”."}, {"zle": "Proszę wpisać w formularzu ostatnie wynagrodzenie brutto.", "dobrze": "Usuń to pole z formularza i ATS. Jeśli potrzebujesz informacji do planowania budżetu, zastąp je polem „oczekiwania finansowe (opcjonalnie)”."}, {"zle": "Czy jest Pan/Pani mężatką / żonaty? Czy planuje Pani dzieci? Kto zajmuje się dziećmi, gdy chorują?", "dobrze": "Opisz wymagania stanowiska i zapytaj o nie wprost: „Ta rola wymaga dwóch dni w biurze w tygodniu i dyżurów raz w miesiącu — czy to dla Pani/Pana możliwe?”."}, {"zle": "Czy jest Pani w ciąży?", "dobrze": "Nie zadawaj tego pytania w żadnej formie. Oceniaj wyłącznie kompetencje i doświadczenie związane ze stanowiskiem."}, {"zle": "Ile ma Pan/Pani lat? W którym roku skończył(a) Pan/Pani szkołę?", "dobrze": "Pytaj o doświadczenie związane z rolą: „Proszę opowiedzieć o projekcie, w którym odpowiadał(a) Pan/Pani za…”. Jeśli przepisy wymagają minimalnego wieku (np. pełnoletności), zapytaj tylko o spełnienie tego warunku."}, {"zle": "Czy choruje Pan/Pani przewlekle? Ile dni zwolnienia miał(a) Pan/Pani w zeszłym roku?", "dobrze": "Zapytaj, czy kandydat potrzebuje dostosowań w procesie rekrutacji lub na stanowisku. Zdolność do pracy potwierdza badanie medycyny pracy, a nie rozmowa kwalifikacyjna."}, {"zle": "Jakiego jest Pan/Pani wyznania? Czy obchodzi Pan/Pani święta, przez które nie będzie Pan/Pani dostępny/a?", "dobrze": "Przedstaw grafik i zasady planowania urlopów i zapytaj, czy kandydat może pracować w takim systemie."}, {"zle": "Skąd Pan/Pani pochodzi? Czy polski to Pana/Pani język ojczysty?", "dobrze": "Jeśli język jest potrzebny w pracy, określ wymagany poziom i sprawdź go: „Na tym stanowisku prowadzi się rozmowy z klientami po polsku — porozmawiajmy chwilę o…”. Jeśli potrzebne jest prawo do pracy w Polsce, zapytaj tylko o to."}, {"zle": "Czy należy Pan/Pani do związku zawodowego albo partii politycznej?", "dobrze": "Nie pytaj o przynależność związkową ani poglądy polityczne. Skup się na kompetencjach i motywacji do pracy."}, {"zle": "Jak Pana/Pani partner(ka) zapatruje się na nową pracę i wyjazdy służbowe?", "dobrze": "Zapytaj bezpośrednio kandydata: „Ta rola wymaga około {liczba} wyjazdów w miesiącu — czy jest to dla Pani/Pana do zaakceptowania?”."}], "mapa_drogowa": [{"etap": "1. Rekrutacja zgodna z art. 18³ca KP (już obowiązuje)", "co_zrobic": "Widełki lub informacja o wynagrodzeniu dla każdego kandydata, neutralne płciowo nazwy stanowisk i ogłoszenia, usunięcie pytań o historię wynagrodzeń z formularzy, ATS i scenariuszy rozmów, szkolenie rekruterów."}, {"etap": "2. Inwentaryzacja danych płacowych", "co_zrobic": "Zbierz w jednym miejscu dane o wynagrodzeniach (zasadnicze, dodatki, premie, benefity) z podziałem na stanowiska i kategorie. Ustal, kto ma do nich dostęp, i zadbaj o zgodność z RODO."}, {"etap": "3. Wartościowanie stanowisk i siatka płac", "co_zrobic": "Zbuduj kategorie pracy o jednakowej wartości na podstawie kryteriów: umiejętności, wysiłek, odpowiedzialność, warunki pracy. Ustal przedziały min–mid–max (patrz: kroki budowy siatki)."}, {"etap": "4. Kryteria ustalania wynagrodzeń i progresji", "co_zrobic": "Spisz obiektywne, neutralne płciowo zasady: od czego zależy wysokość wynagrodzenia, podwyżka i awans. Dyrektywa 2023/970 przewiduje, że pracownicy mają mieć do nich łatwy dostęp. Sprawdź aktualny stan prawny, m.in. w zakresie ewentualnych ułatwień dla mniejszy
