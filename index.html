otuj wersję prostym językiem dla pracownika z Ukrainy."], "checklista": ["Każdy komunikat opiera się na konkretnej sytuacji z datą lub przykładem.", "W scenariuszu nie ma ocen osoby, uogólnień ani interpretacji intencji.", "Zaplanowano czas na wysłuchanie perspektywy pracownika.", "Ustalenia są konkretne: co, do kiedy, jak sprawdzimy.", "Wiesz, jak postąpić, jeśli pracownik zgłosi mobbing, dyskryminację lub problem zdrowotny.", "Do AI nie trafiły nazwiska ani dane wrażliwe — opis jest zanonimizowany (RODO).", "Jeśli rozmowa może prowadzić do decyzji kadrowych, plan omówiono z kadrami lub prawnikiem."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Scenariusz to podpórka, a nie tekst do recytowania — najważniejsze w rozmowie feedbackowej jest słuchanie."}, {"id": "2.09", "nazwa": "Indywidualny plan rozwoju (IPR) w modelu 70-20-10", "co_robi": "Tworzy indywidualny plan rozwoju z celami, działaniami w proporcji 70-20-10, terminami i wskaźnikami postępu. Plan jest realistyczny, dopasowany do budżetu i łatwy do monitorowania.", "kiedy": "Po ocenie rocznej, gdy w formularzu trzeba wpisać „plan rozwoju”, a menedżer ma pomysł tylko na „jakieś szkolenie”.", "brief": [{"pole": "Stanowisko i rola docelowa", "opis": "Obecna rola i kierunek, np. „starsza księgowa, za 18 miesięcy zastępczyni głównej księgowej”."}, {"pole": "Wnioski z oceny", "opis": "Mocne strony i obszary do rozwoju, np. „świetna merytorycznie; do rozwoju: delegowanie, prezentowanie wyników zarządowi”."}, {"pole": "Aspiracje pracownika", "opis": "Co mówi sam pracownik, np. „chce prowadzić zespół, interesuje się automatyzacją raportów”."}, {"pole": "Budżet i czas", "opis": "Zasoby, np. „do 3000 PLN na rok, 2 dni szkoleniowe w godzinach pracy”."}, {"pole": "Horyzont planu", "opis": "Na jak długo, np. „12 miesięcy, przegląd co kwartał”."}], "prompt": "Jesteś doświadczoną specjalistką ds. rozwoju pracowników w polskiej firmie, która układa praktyczne plany rozwojowe w modelu 70-20-10. Przygotuj indywidualny plan rozwoju (IPR), który da się realnie zrealizować.\n\nDANE:\nStanowisko i rola docelowa: [STANOWISKO I ROLA DOCELOWA]\nWnioski z oceny: [WNIOSKI Z OCENY]\nAspiracje pracownika: [ASPIRACJE PRACOWNIKA]\nBudżet i czas: [BUDŻET I CZAS]\nHoryzont planu: [HORYZONT PLANU]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj na odpowiedź. Nie wymyślaj budżetu, nazw kursów, cen ani dostawców. Luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Maksymalnie 3 cele rozwojowe, sformułowane według SMART i powiązane z wnioskami z oceny oraz aspiracjami pracownika.\n3. Działania rozłóż według 70-20-10: ok. 70% nauka w pracy (projekty, nowe zadania, zastępstwa), ok. 20% nauka od innych (mentoring, shadowing, feedback), ok. 10% formalne szkolenia. Pokaż proporcje.\n4. Każde działanie ma właściciela, termin i wskaźnik, po którym poznamy postęp.\n5. Szkolenia opisuj rodzajem i tematem, nie konkretną firmą. Jeśli szkolenie wymaga umowy lojalnościowej lub zwrotu kosztów, oznacz [DO WERYFIKACJI] z kadrami.\n6. Plan nie może zakładać pracy ponad normy czasu pracy ani zależeć od dyspozycyjności po godzinach — uwzględnij równe traktowanie osób pracujących na część etatu lub zdalnie.\n\nFORMAT WYNIKU:\nA) Cele rozwojowe (SMART) z uzasadnieniem.\nB) Tabela działań: cel, działanie, typ (70/20/10), właściciel, termin, wskaźnik, koszt.\nC) Harmonogram przeglądów postępu.\nD) Pytania do omówienia planu z pracownikiem.\nE) Lista „sprawdź przed użyciem”: założenia, luki, koszty do zatwierdzenia.", "polecenia": ["Ogranicz plan do działań bezkosztowych.", "Przygotuj wersję planu na 6 miesięcy zamiast 12.", "Zaproponuj 5 zadań projektowych rozwijających delegowanie.", "Przygotuj plan spotkań mentoringowych na pierwszy kwartał.", "Zrób tabelę do Excela do śledzenia postępu IPR.", "Napisz maila do pracownika z zaproszeniem do omówienia planu.", "Przygotuj wersję planu dla osoby pracującej w pełni zdalnie.", "Dodaj ryzyka realizacji planu i sposób ich ograniczenia.", "Przetłumacz plan na angielski.", "Przygotuj wersję prostym językiem dla pracownika z Ukrainy."], "checklista": ["Cele są powiązane z wnioskami z oceny i aspiracjami pracownika.", "Każde działanie ma właściciela, termin i wskaźnik.", "Proporcje 70-20-10 są zachowane, a plan nie opiera się tylko na szkoleniach.", "Koszty mieszczą się w budżecie i zostały zatwierdzone.", "Plan nie zakłada pracy po godzinach ani nie wyklucza osób na części etatu lub zdalnych — równe traktowanie.", "Plan omówiono i uzgodniono z pracownikiem, a nie tylko mu przekazano.", "Umowy lojalnościowe lub zwrot kosztów szkoleń sprawdziły kadry lub prawnik."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. IPR działa tylko wtedy, gdy pracownik współtworzy plan, a menedżer regularnie wraca do niego na spotkaniach 1:1."}, {"id": "2.10", "nazwa": "Raport i metryki procesu ocen", "co_robi": "Analizuje zanonimizowane dane z procesu ocen: rozkład ocen, stopień ukończenia i spójność między działami. Wskazuje różnice, które warto zbadać pod kątem równego traktowania, i przygotowuje raport dla zarządu.", "kiedy": "Po zamknięciu cyklu ocen, gdy zarząd pyta „jak poszło”, a Ty chcesz pokazać nie tylko liczby, ale też wnioski na kolejny rok.", "brief": [{"pole": "Zakres danych", "opis": "Czego dotyczą dane, np. „ocena roczna 2026, 180 pracowników, 14 menedżerów, 6 działów”."}, {"pole": "Dane z procesu", "opis": "Zanonimizowane zestawienia, np. „ukończone 162/180; rozkład ocen: 5 – 18%, 4 – 41%, 3 – 33%, 2 – 7%, 1 – 1%; w podziale na działy i płeć”."}, {"pole": "Terminy i ukończenie", "opis": "Jak przebiegał proces, np. „termin 31.01; 4 menedżerów oddało oceny po terminie; 18 rozmów się nie odbyło”."}, {"pole": "Odbiorca raportu", "opis": "Dla kogo, np. „zarząd, prezentacja 15 minut” albo „kierownicy działów”."}, {"pole": "Pytania do analizy", "opis": "Co chcesz sprawdzić, np. „czy oceny różnią się wg płci i trybu pracy; który dział zawyża oceny”."}], "prompt": "Jesteś doświadczoną analityczką HR w polskiej firmie, która przygotowuje raporty z procesów ocen dla zarządu. Przeanalizuj dane z cyklu ocen i przygotuj rzetelny raport z wnioskami.\n\nDANE:\nZakres danych: [ZAKRES DANYCH]\nDane z procesu: [DANE Z PROCESU]\nTerminy i ukończenie: [TERMINY I UKOŃCZENIE]\nOdbiorca raportu: [ODBIORCA RAPORTU]\nPytania do analizy: [PYTANIA DO ANALIZY]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj na odpowiedź. Nie wymyślaj liczb, benchmarków ani danych rynkowych. Luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Licz tylko na danych, które podałam, i pokaż sposób liczenia. Przy małych grupach (poniżej ok. 5 osób) nie pokazuj wyników, bo da się zidentyfikować ludzi — zgodnie z RODO.\n3. Policz co najmniej: stopień ukończenia ocen i rozmów, terminowość menedżerów, rozkład ocen ogółem i w działach, różnice między menedżerami.\n4. Różnice ocen według płci, wieku, trybu pracy lub wymiaru etatu traktuj jako sygnał do analizy w ramach równego traktowania, a nie jako dowód dyskryminacji. Wskaż możliwe wyjaśnienia i co sprawdzić, oznaczając [DO WERYFIKACJI].\n5. Jeśli oceny wpływają na wynagrodzenia, przypomnij o powiązaniu z przejrzystością wynagrodzeń (dyrektywa UE 2023/970, termin wdrożenia 7.06.2026 — sprawdź aktualny stan prawny).\n6. Wnioski formułuj ostrożnie i rzeczowo, bez wskazywania winnych.\n\nFORMAT WYNIKU:\nA) Najważniejsze wnioski w 5 punktach.\nB) Tabela metryk: wskaźnik, wartość, sposób liczenia, komentarz.\nC) Rozkład ocen w działach i różnice między menedżerami w tabeli.\nD) Sygnały do analizy pod kątem równego traktowania z listą rzeczy do sprawdzenia.\nE) Rekomendacje na kolejny cykl ocen.\nF) Lista „sprawdź przed użyciem”: założenia, luki, ryzyka interpretacji.", "polecenia": ["Skróć raport do jednej strony dla zarządu.", "Przygotuj 5 slajdów tekstowych do prezentacji wyników.", "Zaproponuj wykresy do każdej metryki i opisz, co mają pokazać.", "Przygotuj wersję raportu dla kierowników działów bez danych innych działów.", "Rozpisz plan pogłębionej analizy różnic ocen według płci.", "Wypisz 5 działań poprawiających terminowość menedżerów.", "Zrób tabelę do Excela z formułami dla każdej metryki.", "Dodaj ryzyka błędnej interpretacji danych i jak ich uniknąć.", "Przetłumacz podsumowanie na angielski dla właściciela spoza Polski.", "Przygotuj krótki komunikat dla pracowników o wynikach procesu, bez danych indywidualnych."], "checklista": ["Do AI trafiły tylko dane zagregowane lub zanonimizowane, bez nazwisk i PESEL (RODO).", "Wyniki małych grup są ukryte, żeby nie dało się zidentyfikować osób.", "Wszystkie liczby da się odtworzyć z danych źródłowych.", "Różnice według płci, wieku lub trybu pracy opisano jako sygnał do analizy, nie jako wniosek.", "Raport nie wskazuje winnych, tylko obszary do poprawy procesu.", "Odwołania do przejrzystości wynagrodzeń sprawdzono pod kątem aktualnego stanu prawnego.", "Jeśli z raportu wynikają decyzje płacowe lub kadrowe, wnioski zweryfikowały kadry lub prawnik."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Różnica w ocenach między grupami to pytanie, a nie odpowiedź — zanim wyciągniesz wnioski, sprawdź jej przyczyny razem z menedżerami."}]}, {"dzial_nr": 3, "dzial": "Szkolenia i rozwój", "opis": "Od diagnozy potrzeb i luk kompetencyjnych, przez ścieżki rozwoju, scenariusze i materiały szkoleniowe, aż po testy, ankiety, budżet i ROI. Opisujesz sytuację w zespole, a dostajesz gotowy plan, program albo raport do sprawdzenia i wdrożenia.", "skills": [{"id": "3.01", "nazwa": "Analiza potrzeb szkoleniowych", "co_robi": "Projektuje ankietę i scenariusz wywiadów do badania potrzeb szkoleniowych, a potem porządkuje zebrane odpowiedzi w listę priorytetów. Oddziela to, czego ludzie chcą, od tego, czego firma naprawdę potrzebuje do realizacji celów.", "kiedy": "Gdy planujesz szkolenia na kolejny rok albo zarząd pyta „czego właściwie nasi ludzie muszą się nauczyć?”, a Ty nie chcesz opierać planu na przeczuciach.", "brief": [{"pole": "Firma i zespoły", "opis": "Branża, wielkość, które działy badasz, np. „firma logistyczna, 120 osób; badamy magazyn (60 os.), obsługę klienta (15 os.) i kierowników zmian (8 os.)”."}, {"pole": "Cele biznesowe", "opis": "Na co szkolenia mają odpowiadać, np. „wdrożenie nowego WMS w II kwartale, spadek reklamacji o 20%, przygotowanie 3 następców na kierowników zmian”."}, {"pole": "Sygnały problemów", "opis": "Co już widać, np. „dużo błędów przy kompletacji, skargi na komunikację kierowników, wysoka rotacja nowych w pierwszych 3 miesiącach”."}, {"pole": "Dostępne źródła danych", "opis": "Z czego możesz korzystać, np. „wyniki ocen okresowych, raport reklamacji, rozmowy wyjściowe, ankieta zaangażowania z zeszłego roku”."}, {"pole": "Metoda badania", "opis": "Ankieta, wywiady, warsztat, np. „ankieta online dla wszystkich + 6 wywiadów z kierownikami po 30 minut”."}, {"pole": "Zebrane odpowiedzi", "opis": "Wklej zanonimizowane wyniki albo napisz „jeszcze nie zbierałam”, np. „42 ankiety: najczęściej Excel, obsługa trudnego klienta, delegowanie”."}], "prompt": "Jesteś doświadczoną specjalistką ds. szkoleń i rozwoju w polskiej firmie z sektora MŚP, która od lat prowadzi analizy potrzeb szkoleniowych powiązane z celami biznesowymi. Pomóż mi zaplanować i przeprowadzić analizę potrzeb szkoleniowych oraz ustalić priorytety.\n\nDANE:\nFirma i badane zespoły: [FIRMA I ZESPOŁY]\nCele biznesowe na najbliższy rok: [CELE BIZNESOWE]\nSygnały problemów: [SYGNAŁY PROBLEMÓW]\nDostępne źródła danych: [DOSTĘPNE ŹRÓDŁA DANYCH]\nMetoda badania: [METODA BADANIA]\nZebrane odpowiedzi: [ZEBRANE ODPOWIEDZI]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5 krótkich pytań i poczekaj na odpowiedź. Nie wymyślaj liczb, wyników ankiet, nazwisk ani danych firmy – luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Każdą potrzebę szkoleniową powiąż z konkretnym celem biznesowym lub problemem. Oddziel potrzeby szkoleniowe od problemów, których szkolenie nie rozwiąże (procesy, narzędzia, wynagrodzenia, obsada).\n3. Pytania ankiety mają być krótkie, neutralne i anonimowe; nie zbieraj danych wrażliwych ani danych pozwalających zidentyfikować osobę w małych zespołach.\n4. Jeśli odpowiedzi już są, licz tylko na podstawie tego, co podałam; nie dopisuj procentów z głowy.\n5. Szkolenia obowiązkowe (np. szkolenie BHP) wyodrębnij osobno jako niepodlegające priorytetyzacji i oznacz [DO WERYFIKACJI] z kadrami.\n\nFORMAT WYNIKU:\nA) Ankieta do skopiowania (8–12 pytań: skale, pytania zamknięte i 2 otwarte) z krótkim wstępem dla pracowników.\nB) Scenariusz wywiadu z kierownikiem (6–8 pytań + pytania pogłębiające).\nC) Tabela potrzeb: potrzeba | zespół | powiązany cel/problem | źródło danych | czy szkolenie to rozwiąże | priorytet (wysoki/średni/niski) | uzasadnienie.\nD) Top 5 priorytetów na najbliższe 12 miesięcy w 5 zdaniach dla zarządu.\nE) Lista „sprawdź przed użyciem”: założenia, luki i miejsca do potwierdzenia z kierownikami.", "polecenia": ["Skróć ankietę do 6 pytań, które da się wypełnić w 3 minuty.", "Przygotuj wersję ankiety dla pracowników z Ukrainy prostym językiem polskim.", "Napisz maila do kierowników z prośbą o udział w wywiadzie.", "Zrób z tabeli potrzeb wersję na jeden slajd dla zarządu.", "Dodaj kolumnę „szacowany wpływ na cel” w skali 1–5 z uzasadnieniem.", "Wskaż, które potrzeby lepiej rozwiązać mentoringiem lub instrukcją zamiast szkolenia.", "Przygotuj krótką wiadomość na Teams zachęcającą do wypełnienia ankiety.", "Pogrupuj potrzeby według kompetencji: twarde, miękkie, menedżerskie.", "Dodaj ryzyka i ograniczenia tej analizy.", "Przetłumacz ankietę na angielski dla zespołu międzynarodowego."], "checklista": ["Każdy priorytet ma powiązanie z celem biznesowym lub konkretnym problemem.", "Liczby i procenty pochodzą z rzeczywistych odpowiedzi, a nie z założeń AI.", "Ankieta jest anonimowa i nie pozwala zidentyfikować osób w małych zespołach.", "Do AI nie trafiły dane osobowe ani wrażliwe – odpowiedzi zostały zanonimizowane (RODO).", "Szkolenia obowiązkowe (BHP i inne wymagane przepisami) zostały potwierdzone z kadrami.", "Problemy niezwiązane z wiedzą (procesy, narzędzia) zostały przekazane właściwym osobom.", "Priorytety zostały skonsultowane z kierownikami zespołów przed przedstawieniem zarządowi."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Analiza jest tak dobra jak dane wejściowe: przy małej liczbie odpowiedzi traktuj priorytety jako hipotezę do potwierdzenia w rozmowach."}, {"id": "3.02", "nazwa": "Diagnoza luk kompetencyjnych", "co_robi": "Porównuje wymagania stanowiska z obecnym poziomem kompetencji zespołu i tworzy czytelną mapę luk. Wskazuje, które luki są krytyczne dla biznesu i jak je zamknąć: szkoleniem, mentoringiem, rekrutacją czy zmianą zadań.", "kiedy": "Przed planowaniem rozwoju zespołu, po reorganizacji albo gdy kierownik mówi „brakuje nam kompetencji”, ale nie umie powiedzieć dokładnie jakich.", "brief": [{"pole": "Stanowisko lub zespół", "opis": "Czyje kompetencje badasz, np. „zespół obsługi klienta, 9 osób: 7 konsultantów i 2 starsze konsultantki”."}, {"pole": "Wymagane kompetencje", "opis": "Lista kompetencji z oczekiwanym poziomem, np. „obsługa CRM – 4/5, rozwiązywanie reklamacji – 4/5, komunikacja pisemna – 3/5, angielski B1”."}, {"pole": "Obecny poziom zespołu", "opis": "Oceny zanonimizowane (osoba A, B, C…), np. „A: CRM 3, reklamacje 2, pisemna 4; B: CRM 4, reklamacje 4, pisemna 2…”."}, {"pole": "Źródło ocen", "opis": "Skąd pochodzą dane, np. „samoocena + ocena kierownika z oceny okresowej, marzec”."}, {"pole": "Plany biznesowe", "opis": "Co się zmieni, np. „od września obsługa klientów z Niemiec, nowy moduł CRM w listopadzie”."}], "prompt": "Jesteś doświadczonym HR business partnerem w polskiej firmie, specjalizującym się w zarządzaniu kompetencjami i planowaniu rozwoju zespołów. Przygotuj diagnozę luk kompetencyjnych i mapę luk.\n\nDANE:\nStanowisko lub zespół: [STANOWISKO LUB ZESPÓŁ]\nWymagane kompetencje i poziomy: [WYMAGANE KOMPETENCJE]\nObecny poziom zespołu: [OBECNY POZIOM ZESPOŁU]\nŹródło ocen: [ŹRÓDŁO OCEN]\nPlany biznesowe: [PLANY BIZNESOWE]\n\nZASADY:\n1. Jeśli brakuje istotnych danych (skala ocen, poziomy wymagane, liczba osób), zadaj mi maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj ocen, liczb ani danych osób – luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Pracuj wyłącznie na zanonimizowanych oznaczeniach osób (A, B, C). Nie proś o imiona, PESEL, dane o zdrowiu ani inne dane wrażliwe.\n3. Lukę licz jako różnicę: poziom wymagany minus poziom obecny. Wyróżnij luki krytyczne: duże i jednocześnie ważne dla planów biznesowych.\n4. Zaznacz, gdy ocena opiera się tylko na samoocenie – to sygnał do potwierdzenia.\n5. Nie formułuj wniosków o przydatności konkretnej osoby do pracy ani rekomendacji kadrowych; diagnoza służy rozwojowi, a decyzje personalne należą do mnie i kierownika.\n6. Rekomendacje dopasuj do realiów MŚP: najpierw tańsze formy (mentoring, wewnętrzny ekspert, e-learning), potem szkolenia zewnętrzne.\n\nFORMAT WYNIKU:\nA) Mapa luk: tabela osoby × kompetencje z wartością luki i oznaczeniem (brak luki / mała / duża).\nB) Podsumowanie na poziomie zespołu: średnia luka na kompetencję, liczba osób z dużą luką, kompetencje krytyczne.\nC) Rekomendacje: kompetencja | sposób zamknięcia luki | dla kogo | priorytet | szacowany czas.\nD) Kompetencje, których nie warto rozwijać szkoleniem (lepiej rekrutacja lub zmiana zadań) – z uzasadnieniem.\nE) Lista „sprawdź przed użyciem” z założeniami i miejscami do potwierdzenia.", "polecenia": ["Zrób z mapy luk heatmapę w formie tabeli z oznaczeniami kolorów do Excela.", "Przygotuj wersję dla zarządu na pół strony.", "Zaproponuj plan zamknięcia 3 krytycznych luk w 6 miesięcy.", "Wskaż osoby, które mogą być wewnętrznymi mentorami w danej kompetencji.", "Dodaj ryzyka, jeśli luk nie zamkniemy przed planowanymi zmianami.", "Przygotuj krótką wiadomość dla kierownika z wnioskami na Slack.", "Opisz każdy poziom skali 1–5 dla każdej kompetencji językiem zachowań.", "Przygotuj formularz samooceny kompetencji do powtórzenia za pół roku.", "Porównaj luki między stanowiskiem konsultanta i starszego konsultanta.", "Przetłumacz mapę luk i rekomendacje na angielski."], "checklista": ["Dane osób są zanonimizowane – do AI nie trafiły imiona ani dane wrażliwe (RODO).", "Skala ocen jest jednolita dla wszystkich osób i kompetencji.", "Oceny oparte wyłącznie na samoocenie zostały potwierdzone z kierownikiem.", "Wymagane poziomy wynikają z opisu stanowiska, a nie z założeń AI.", "Wnioski nie różnicują osób ze względu na płeć, wiek, pochodzenie ani inne cechy chronione.", "Mapa luk nie jest używana jako podstawa decyzji kadrowych bez dodatkowej weryfikacji.", "Rekomendacje są realne do wykonania w budżecie i czasie zespołu."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Mapa luk to narzędzie rozwojowe: jeśli miałaby wpływać na wynagrodzenia lub zatrudnienie, skonsultuj sposób jej użycia z kadrami lub prawnikiem."}, {"id": "3.03", "nazwa": "Ścieżki rozwoju", "co_robi": "Projektuje ścieżki rozwoju dla stanowisk i ról: onboardingową, specjalistyczną i menedżerską. Rozpisuje etapy, wymagane kompetencje, formy nauki i kryteria przejścia na kolejny poziom.", "kiedy": "Gdy pracownicy pytają „jak mogę się tu rozwijać?”, odchodzą przez brak perspektyw albo chcesz uporządkować awanse tak, żeby były przejrzyste i sprawiedliwe.", "brief": [{"pole": "Rola wyjściowa", "opis": "Stanowisko, od którego zaczyna się ścieżka, np. „młodszy specjalista ds. księgowości, 0–2 lata doświadczenia”."}, {"pole": "Rodzaj ścieżki", "opis": "Onboardingowa, specjalistyczna, menedżerska lub wszystkie, np. „specjalistyczna do eksperta i menedżerska do kierownika zespołu”."}, {"pole": "Struktura stanowisk", "opis": "Jakie poziomy istnieją, np. „młodszy specjalista → specjalista → starszy specjalista → kierownik zespołu (4 os.)”."}, {"pole": "Kluczowe kompetencje", "opis": "Co liczy się w tej roli, np. „znajomość ustawy o rachunkowości, Excel zaawansowany, kontakt z klientem, samodzielne zamknięcie miesiąca”."}, {"pole": "Zasoby rozwojowe", "opis": "Czym dysponujesz, np. „budżet 2 000 zł na osobę rocznie, platforma e-learningowa, 2 doświadczone mentorki, dofinansowanie studiów podyplomowych”."}, {"pole": "Zasady awansów", "opis": "Jak dziś wygląda awans, np. „decyduje dyrektor po ocenie okresowej, brak spisanych kryteriów” albo „nie wiem”."}], "prompt": "Jesteś doświadczoną specjalistką ds. rozwoju i zarządzania talentami w polskiej firmie z sektora MŚP. Zaprojektuj przejrzyste ścieżki rozwoju dla opisanej roli.\n\nDANE:\nRola wyjściowa: [ROLA WYJŚCIOWA]\nRodzaj ścieżki: [RODZAJ ŚCIEŻKI]\nStruktura stanowisk: [STRUKTURA STANOWISK]\nKluczowe kompetencje: [KLUCZOWE KOMPETENCJE]\nZasoby rozwojowe: [ZASOBY ROZWOJOWE]\nObecne zasady awansów: [ZASADY AWANSÓW]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj stanowisk, stawek, budżetów ani zasad firmy – luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Kryteria przejścia na kolejny poziom mają być obiektywne, mierzalne i neutralne płciowo; nazwy stanowisk zapisuj w formie neutralnej lub w obu formach.\n3. Ścieżka specjalistyczna ma być równorzędna z menedżerską – awans nie musi oznaczać zarządzania ludźmi.\n4. Nie podawaj wynagrodzeń ani widełek z pamięci. Jeśli ścieżka ma być powiązana z płacą, oznacz to [DO WERYFIKACJI] z kadrami i regulaminem wynagradzania oraz przypomnij o zasadach jawności wynagrodzeń.\n5. Formy rozwoju dobieraj w proporcji ok. 70/20/10 (praktyka, relacje, szkolenia formalne) i dopasuj do podanych zasobów.\n6. Zmiana stanowiska może wymagać porozumienia zmieniającego – zaznacz to jako [DO WERYFIKACJI] z kadrami.\n\nFORMAT WYNIKU:\nA) Schemat ścieżki: poziomy w kolejności, osobno ścieżka specjalistyczna i menedżerska.\nB) Tabela dla każdego poziomu: oczekiwane kompetencje | zakres odpowiedzialności | formy rozwoju | kryteria przejścia | typowy czas na poziomie.\nC) Ścieżka onboardingowa na pierwsze 90 dni (jeśli wybrana): tydzień/miesiąc | cel | działania | kto wspiera.\nD) Gotowy opis ścieżki do intranetu dla pracowników (ciepły, konkretny język).\nE) Lista „sprawdź przed użyciem” z założeniami i punktami do potwierdzenia z kadrami.", "polecenia": ["Przygotuj jednostronicową grafikę ścieżki w formie tekstowej do przeniesienia do Canvy.", "Rozpisz ścieżkę onboardingową na plan dzień po dniu na pierwszy tydzień.", "Dodaj przykładowy indywidualny plan rozwoju dla osoby na poziomie specjalisty.", "Napisz wersję dla kierowników z instrukcją, jak rozmawiać o ścieżce z pracownikiem.", "Skróć opis do intranetu do 150 słów.", "Przygotuj wersję prostym językiem dla pracowników z Ukrainy.", "Dodaj ryzyka wprowadzenia ścieżek i sposoby ich ograniczenia.", "Zaproponuj kryteria przejścia oparte wyłącznie na mierzalnych wskaźnikach.", "Przygotuj prezentację ścieżek dla zarządu w 5 slajdach.", "Przetłumacz opis ścieżki na angielski."], "checklista": ["Kryteria awansu są obiektywne, mierzalne i jednakowe dla wszystkich.", "Nazwy stanowisk i opisy są neutralne płciowo.", "Ścieżka nie obiecuje awansu ani podwyżki, których firma nie może zagwarantować.", "Powiązanie z wynagrodzeniem sprawdzone z regulaminem wynagradzania i zasadami jawności wynagrodzeń.", "Zmiany stanowisk i zakresów obowiązków zweryfikowane z kadrami (porozumienie zmieniające).", "Zasoby rozwojowe (budżet, mentorzy, czas) są realnie dostępne.", "Treść zweryfikowana przez Ciebie, kierowników i kadry przed publikacją dla pracowników."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Opublikowana ścieżka rozwoju buduje oczekiwania pracowników, więc publikuj tylko kryteria, których firma faktycznie będzie przestrzegać."}, {"id": "3.04", "nazwa": "Scenariusz szkolenia", "co_robi": "Tworzy kompletny scenariusz szkolenia godzina po godzinie: cele, moduły, metody, ćwiczenia, przerwy i potrzebne materiały. Dba o to, żeby uczestnicy ćwiczyli, a nie tylko słuchali.", "kiedy": "Gdy masz poprowadzić szkolenie wewnętrzne za dwa tygodnie, wiesz, czego ludzie mają się nauczyć, ale brakuje Ci czasu na ułożenie programu.", "brief": [{"pole": "Temat szkolenia", "opis": "O czym jest szkolenie, np. „udzielanie feedbacku dla nowych kierowników zmian”."}, {"pole": "Uczestnicy", "opis": "Kto i ilu, z jakim doświadczeniem, np. „10 kierowników zmian, większość awansowana z magazynu w ostatnim roku, bez szkoleń menedżerskich”."}, {"pole": "Cele szkolenia", "opis": "Co uczestnicy mają umieć po szkoleniu, np. „przeprowadzić rozmowę korygującą według modelu, przygotować się do rozmowy w 10 minut”."}, {"pole": "Czas i forma", "opis": "Długość i tryb, np. „1 dzień, 9:00–16:00, stacjonarnie w sali konferencyjnej” albo „2 × 2 h online na Teams”."}, {"pole": "Prowadzący i zasoby", "opis": "Kto prowadzi i co jest dostępne, np. „HR generalistka, rzutnik, flipchart, możliwość pracy w parach”."}], "prompt": "Jesteś doświadczonym trenerem biznesu i projektantem szkoleń w polskiej firmie, który prowadzi warsztaty dla dorosłych metodami aktywnymi. Przygotuj scenariusz szkolenia godzina po godzinie.\n\nDANE:\nTemat szkolenia: [TEMAT SZKOLENIA]\nUczestnicy: [UCZESTNICY]\nCele szkolenia: [CELE SZKOLENIA]\nCzas i forma: [CZAS I FORMA]\nProwadzący i zasoby: [PROWADZĄCY I ZASOBY]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj danych firmy, statystyk ani przepisów – luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Cele zapisz w formie efektów uczenia się: „po szkoleniu uczestnik potrafi…”, mierzalnie.\n3. Stosuj cykl Kolba: doświadczenie – refleksja – teoria – zastosowanie. Co najmniej połowa czasu to ćwiczenia, case'y, odgrywanie ról lub dyskusja.\n4. Bloki teorii nie dłuższe niż 15–20 minut. Uwzględnij przerwy i energizery dopasowane do formy (stacjonarnie lub online).\n5. Case'y i przykłady osadź w realiach podanej firmy i polskiego miejsca pracy; nie używaj prawdziwych nazwisk ani danych pracowników.\n6. Jeśli temat dotyczy przepisów (Kodeks pracy, BHP, RODO), nie podawaj artykułów ani terminów z pamięci – oznacz [DO WERYFIKACJI] z kadrami/prawnikiem.\n\nFORMAT WYNIKU:\nA) Cele szkolenia (3–5 efektów uczenia się).\nB) Agenda w tabeli: godzina | moduł | cel modułu | metoda | opis aktywności | materiały | czas.\nC) Szczegółowe instrukcje do 3 najważniejszych ćwiczeń (polecenie dla uczestników, przebieg, pytania do omówienia).\nD) Lista materiałów i przygotowań przed szkoleniem.\nE) Plan B: co skrócić, jeśli zabraknie 30 minut.\nF) Lista „sprawdź przed użyciem” z założeniami.", "polecenia": ["Przerób scenariusz na wersję online 2 × 2 godziny na Teams.", "Skróć szkolenie do 3 godzin, zachowując najważniejsze ćwiczenia.", "Napisz 3 dodatkowe case'y z życia magazynu do odgrywania ról.", "Przygotuj zaproszenie na szkolenie dla uczestników do wysłania mailem.", "Dodaj 5 energizerów pasujących do tematu.", "Przygotuj zadanie przedszkoleniowe na 15 minut.", "Dodaj zadanie wdrożeniowe na 2 tygodnie po szkoleniu.", "Dostosuj scenariusz dla grupy z różnym poziomem znajomości polskiego.", "Zrób wersję agendy do wysłania kierownikom uczestników.", "Przetłumacz agendę na angielski."], "checklista": ["Cele są mierzalne i da się je sprawdzić testem lub obserwacją.", "Ćwiczenia zajmują co najmniej połowę czasu szkolenia.", "Czasy modułów sumują się do faktycznej długości szkolenia z przerwami.", "Case'y nie zawierają prawdziwych nazwisk ani danych pracowników.", "Treści prawne i BHP zweryfikowane z kadrami lub prawnikiem.", "Materiały i sala (lub narzędzie online) są dostępne w dniu szkolenia.", "Przykłady i język są inkluzywne i wolne od stereotypów."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Przeprowadź próbę najtrudniejszego ćwiczenia z jedną osobą – czasy z agendy AI często są zbyt optymistyczne."}, {"id": "3.05", "nazwa": "Materiały szkoleniowe", "co_robi": "Przygotowuje treść slajdów prezentacji, skrypt dla trenera i handout dla uczestników do jednego szkolenia. Wszystko spójne ze sobą i gotowe do przeniesienia do PowerPointa, Canvy lub Worda.", "kiedy": "Gdy scenariusz szkolenia jest gotowy, ale zostały Ci jeszcze slajdy, notatki prowadzącego i materiał do rozdania, a szkolenie jest w przyszłym tygodniu.", "brief": [{"pole": "Temat i cele", "opis": "Temat i efekty uczenia się, np. „onboarding dla nowych pracowników biura – po szkoleniu uczestnik zna procedury, narzędzia i osoby kontaktowe”."}, {"pole": "Agenda lub scenariusz", "opis": "Wklej agendę albo listę modułów, np. „1. Kim jesteśmy 2. Jak działamy 3. Narzędzia IT 4. BHP i bezpieczeństwo informacji 5. Pytania”."}, {"pole": "Kluczowe treści", "opis": "Fakty, procedury, informacje do przekazania, np. „godziny pracy 8–16, urlop zgłaszany w systemie HR, helpdesk IT pod nr wewn. 200”."}, {"pole": "Odbiorcy", "opis": "Kto będzie słuchał, np. „nowi pracownicy biura, różny wiek, część po studiach, część z wieloletnim doświadczeniem”."}, {"pole": "Rodzaj materiałów", "opis": "Co potrzebujesz, np. „prezentacja ok. 15 slajdów, skrypt trenera, handout na 2 strony A4”."}], "prompt": "Jesteś doświadczoną specjalistką ds. szkoleń i projektantką materiałów edukacyjnych w polskiej firmie. Przygotuj spójny komplet materiałów szkoleniowych.\n\nDANE:\nTemat i cele: [TEMAT I CELE]\nAgenda lub scenariusz: [AGENDA LUB SCENARIUSZ]\nKluczowe treści do przekazania: [KLUCZOWE TREŚCI]\nOdbiorcy: [ODBIORCY]\nPotrzebne materiały: [RODZAJ MATERIAŁÓW]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj procedur, numerów, nazwisk, statystyk ani przepisów – luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Slajdy: jeden slajd – jedna myśl, tytuł w formie wniosku, maksymalnie 5 krótkich punktów, propozycja grafiki lub ikony.\n3. Skrypt trenera: naturalny język mówiony, pytania do sali, przejścia między slajdami, orientacyjny czas na slajd.\n4. Handout: to, co uczestnik ma zabrać i do czego wrócić – kluczowe zasady, kroki, kontakty, miejsce na notatki; bez powtarzania całych slajdów.\n5. Treści dotyczące BHP, RODO lub Kodeksu pracy oznacz [DO WERYFIKACJI] z kadrami/prawnikiem – nie podawaj artykułów ani terminów z pamięci.\n6. Język prosty, inkluzywny i neutralny płciowo; bez żargonu, którego odbiorcy mogą nie znać.\n\nFORMAT WYNIKU:\nA) Prezentacja: tabela slajd nr | tytuł | treść (punkty) | propozycja grafiki.\nB) Skrypt trenera: dla każdego slajdu 3–6 zdań do powiedzenia + pytanie do uczestników + czas.\nC) Handout gotowy do skopiowania do Worda (nagłówki, punkty, ramka „najważniejsze”).\nD) Lista „sprawdź przed użyciem”: miejsca z założeniami, lukami i treściami do weryfikacji.", "polecenia": ["Skróć prezentację do 8 slajdów.", "Napisz handout w wersji prostym językiem dla pracowników z Ukrainy.", "Dodaj do skryptu trenera 3 anegdoty lub przykłady rozluźniające atmosferę.", "Przygotuj quiz na 5 pytań na koniec prezentacji.", "Zamień handout na checklistę pierwszego tygodnia pracy.", "Zaproponuj spójną kolorystykę i układ slajdów.", "Przepisz skrypt na wersję do nagrania wideo na 7 minut.", "Dodaj notatki dla zastępczego trenera, który zna temat słabiej.", "Przygotuj wersję prezentacji na spotkanie online z ankietami na żywo.", "Przetłumacz slajdy i handout na angielski."], "checklista": ["Procedury, numery, kontakty i godziny zgadzają się z aktualnymi danymi firmy.", "Treści BHP, RODO i prawne zweryfikowane z kadrami, specjalistą BHP lub prawnikiem.", "Slajdy nie zawierają danych osobowych pracowników ani poufnych danych firmy.", "Grafiki i zdjęcia mają licencję pozwalającą na użycie w firmie.", "Język jest neutralny płciowo i zrozumiały dla wszystkich odbiorców.", "Skrypt mieści się w czasie przewidzianym w agendzie.", "Materiały zweryfikowane przez Ciebie lub eksperta merytorycznego przed rozdaniem."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Szczególnie dokładnie sprawdź treści, które uczestnicy zabiorą ze sobą w handoucie – błąd w procedurze będzie powielany latami."}, {"id": "3.06", "nazwa": "Microlearning", "co_robi": "Zamienia temat szkolenia w serię krótkich lekcji, maili lub quizów do przyswojenia w 3–5 minut dziennie. Układa harmonogram wysyłki i pilnuje, żeby każda porcja kończyła się jednym konkretnym działaniem.", "kiedy": "Gdy ludzie nie mają czasu na całodniowe szkolenie, chcesz utrwalić wiedzę po warsztacie albo wdrożyć nowy proces bez zabierania zespołu z pracy.", "brief": [{"pole": "Temat", "opis": "Czego mają się nauczyć, np. „bezpieczeństwo informacji: phishing, hasła, czyste biurko”."}, {"pole": "Odbiorcy", "opis": "Kto będzie się uczył, np. „80 pracowników biurowych i 20 handlowców w terenie, głównie na telefonach”."}, {"pole": "Kanał", "opis": "Jak dotrą lekcje, np. „mail co rano o 8:30” albo „wiadomości na Teams” albo „platforma e-learningowa”."}, {"pole": "Liczba i rytm lekcji", "opis": "Ile porcji i jak często, np. „10 lekcji, 2 tygodnie, codziennie w dni robocze”."}, {"pole": "Kluczowe informacje", "opis": "Fakty firmy, które muszą się znaleźć, np. „podejrzane maile zgłaszamy na adres bezpieczeństwa IT, hasło zmieniamy co 90 dni”."}], "prompt": "Jesteś doświadczoną projektantką e-learningu i microlearningu w polskiej firmie. Przygotuj serię krótkich lekcji, które pracownicy przerobią w kilka minut dziennie.\n\nDANE:\nTemat: [TEMAT]\nOdbiorcy: [ODBIORCY]\nKanał dostarczenia: [KANAŁ]\nLiczba i rytm lekcji: [LICZBA I RYTM LEKCJI]\nKluczowe informacje firmy: [KLUCZOWE INFORMACJE]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj procedur, adresów, liczb ani przepisów – luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Jedna lekcja = jedna myśl, maksymalnie 150–200 słów lub 3–5 minut. Każda kończy się jednym konkretnym działaniem albo pytaniem sprawdzającym.\n3. Zaczynaj od sytuacji z życia pracownika, potem zasada, potem przykład. Bez wykładów i bez straszenia.\n4. Rozłóż materiał tak, żeby wracał w powtórkach (powtórka po 2–3 lekcjach i quiz na koniec).\n5. Tytuły maili/wiadomości krótkie i zachęcające do otwarcia, bez clickbaitu.\n6. Treści prawne (RODO, BHP, Kodeks pracy) oznacz [DO WERYFIKACJI] z kadrami/prawnikiem.\n\nFORMAT WYNIKU:\nA) Harmonogram: lekcja nr | dzień | temat | cel | format (tekst, quiz, mini-case).\nB) Pełna treść każdej lekcji gotowa do wklejenia: tytuł/temat wiadomości, treść, działanie na dziś.\nC) Quiz końcowy: 8–10 pytań z kluczem odpowiedzi.\nD) Wiadomość zapowiadająca serię od HR.\nE) Lista „sprawdź przed użyciem” z założeniami i treściami do weryfikacji.", "polecenia": ["Skróć każdą lekcję do 80 słów, żeby mieściła się na ekranie telefonu.", "Przerób lekcje na wiadomości na Teams z emoji w umiarkowanej ilości.", "Dodaj do każdej lekcji jedno pytanie zamknięte z odpowiedzią.", "Przygotuj wersję prostym językiem dla pracowników z Ukrainy.", "Napisz przypomnienie dla osób, które nie otworzyły trzech ostatnich lekcji.", "Zrób z lekcji scenariusze 60-sekundowych filmików.", "Przygotuj wersję B tytułów maili do testu otwieralności.", "Dodaj krótką ankietę na koniec serii: co było najbardziej przydatne.", "Rozpisz serię na 4 tygodnie po 2 lekcje tygodniowo.", "Przetłumacz całą serię na angielski."], "checklista": ["Procedury, adresy i kontakty w lekcjach są aktualne i sprawdzone w firmie.", "Treści prawne i BHP zweryfikowane z kadrami lub prawnikiem.", "Każda lekcja mieści się w 3–5 minutach czytania.", "Klucz odpowiedzi do quizu jest jednoznaczny i poprawny.", "Seria nie zbiera danych osobowych ponad to, co konieczne (RODO).", "Harmonogram nie koliduje ze szczytem pracy zespołów.", "Język jest zrozumiały i neutralny płciowo."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Zanim wyślesz całą serię, przetestuj 2–3 lekcje na kilku osobach z grupy docelowej i popraw to, czego nie zrozumiały."}, {"id": "3.07", "nazwa": "Test wiedzy i ocena efektów uczenia się", "co_robi": "Tworzy test wiedzy sprawdzający cele szkolenia: pytania różnego typu, klucz odpowiedzi i kryteria zaliczenia. Może też przygotować zadanie praktyczne z arkuszem obserwacji, gdy liczy się umiejętność, a nie tylko wiedza.", "kiedy": "Gdy po szkoleniu musisz pokazać, że ludzie faktycznie się nauczyli, a nie tylko podpisali listę obecności – albo gdy test ma potwierdzić gotowość do samodzielnej pracy.", "brief": [{"pole": "Temat i cele szkolenia", "opis": "Efekty uczenia się, np. „obsługa reklamacji: uczestnik zna terminy wewnętrzne, rozpoznaje typ reklamacji, poprawnie wypełnia formularz”."}, {"pole": "Materiał źródłowy", "opis": "Wklej treść szkolenia, procedurę lub handout, z których mają pochodzić pytania."}, {"pole": "Typ testu", "opis": "Rodzaj i forma, np. „test online w Formsach, 15 pytań, jednokrotny wybór + 2 krótkie case'y”."}, {"pole": "Uczestnicy", "opis": "Kto rozwiązuje, np. „12 nowych konsultantów po 2 tygodniach wdrożenia”."}, {"pole": "Próg zaliczenia", "opis": "Twoje oczekiwanie albo „zaproponuj”, np. „80%, dwie próby, druga po powtórce materiału”."}], "prompt": "Jesteś doświadczonym specjalistą ds. szkoleń i ewaluacji w polskiej firmie, który projektuje testy wiedzy i ocenę efektów uczenia się. Przygotuj test sprawdzający cele szkolenia.\n\nDANE:\nTemat i cele szkolenia: [TEMAT I CELE SZKOLENIA]\nMateriał źródłowy: [MATERIAŁ ŹRÓDŁOWY]\nTyp testu: [TYP TESTU]\nUczestnicy: [UCZESTNICY]\nPróg zaliczenia: [PRÓG ZALICZENIA]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5 krótkich pytań i poczekaj. Pytania twórz wyłącznie na podstawie podanego materiału – nie dodawaj faktów, liczb ani przepisów spoza niego. Luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Każde pytanie przypisz do konkretnego celu szkolenia. Każdy cel ma mieć co najmniej 2 pytania.\n3. Pytania jednoznaczne, bez podchwytliwych sformułowań i podwójnych zaprzeczeń; dystraktory wiarygodne, podobnej długości.\n4. Mieszaj poziomy: zapamiętanie, zrozumienie, zastosowanie w sytuacji z pracy.\n5. Kryteria zaliczenia mają być jasne, jednakowe dla wszystkich i znane uczestnikom z góry. Jeśli wynik testu miałby wpływać na zatrudnienie lub wynagrodzenie, oznacz to [DO WERYFIKACJI] z kadrami/prawnikiem.\n6. Język prosty, zrozumiały także dla osób, dla których polski nie jest pierwszym językiem.\n\nFORMAT WYNIKU:\nA) Mapa testu: cel szkolenia | liczba pytań | poziom.\nB) Test gotowy do wklejenia do formularza (numeracja, odpowiedzi a–d).\nC) Klucz odpowiedzi z krótkim uzasadnieniem i odwołaniem do fragmentu materiału.\nD) Zadanie praktyczne lub case z arkuszem oceny (kryterium | spełnione/częściowo/nie).\nE) Kryteria zaliczenia i zasady poprawki.\nF) Lista „sprawdź przed użyciem”.", "polecenia": ["Przygotuj drugą, równoważną wersję testu na poprawkę.", "Dodaj 3 pytania otwarte z kryteriami oceny odpowiedzi.", "Zamień test na format do importu w Microsoft Forms lub Google Forms.", "Uprość język pytań dla pracowników z Ukrainy.", "Przygotuj krótki test wstępny do porównania wiedzy przed i po szkoleniu.", "Dodaj informację zwrotną do każdej błędnej odpowiedzi.", "Sprawdź, czy któreś pytania nie są zbyt łatwe lub podchwytliwe.", "Przygotuj instrukcję dla uczestników przed testem.", "Zrób arkusz w tabeli do zbiorczego zestawienia wyników grupy.", "Przetłumacz test i klucz na angielski."], "checklista": ["Każde pytanie wynika z materiału szkolenia i ma jedną poprawną odpowiedź.", "Klucz odpowiedzi sprawdzony przez eksperta merytorycznego.", "Kryteria zaliczenia są jednakowe dla wszystkich i znane uczestnikom przed testem.", "Wyniki są przechowywane zgodnie z RODO i dostępne tylko uprawnionym osobom.", "Test nie dyskryminuje osób ze względu na język, wiek ani inne cechy chronione.", "Skutki niezaliczenia (np. dla okresu próbnego) zweryfikowane z kadrami lub prawnikiem.", "Test został sprawdzony na 1–2 osobach przed użyciem w całej grupie."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Test wiedzy pokazuje, co ktoś wie, a nie jak pracuje – przy ważnych decyzjach łącz go z obserwacją w pracy i opinią przełożonego."}, {"id": "3.08", "nazwa": "Ankieta poszkoleniowa (ocena reakcji)", "co_robi": "Przygotowuje krótką ankietę poszkoleniową sprawdzającą reakcję uczestników i deklarowane zastosowanie wiedzy, a potem analizuje wyniki. Wyciąga wnioski dla trenera, organizatora i zarządu.", "kiedy": "Zaraz po szkoleniu, gdy chcesz wiedzieć, czy było warto, co poprawić i czy firma ma powtarzać współpracę z trenerem lub dostawcą.", "brief": [{"pole": "Szkolenie", "opis": "Temat, forma, prowadzący, np. „Zarządzanie czasem, 1 dzień stacjonarnie, trener zewnętrzny”."}, {"pole": "Cele szkolenia", "opis": "Co uczestnicy mieli wynieść, np. „planowanie tygodnia, priorytetyzacja zadań, ograniczanie przerywników”."}, {"pole": "Liczba uczestników", "opis": "Ile osób i z jakich działów, np. „14 osób z działu sprzedaży i administracji”."}, {"pole": "Wyniki ankiety", "opis": "Wklej zanonimizowane wyniki albo napisz „ankieta jeszcze nie przeprowadzona”, np. „średnia ocena trenera 4,6/5, 9 komentarzy otwartych…”."}, {"pole": "Do czego posłużą wnioski", "opis": "Np. „decyzja o powtórce szkolenia dla kolejnej grupy i raport kwartalny dla zarządu”."}], "prompt": "Jesteś doświadczoną specjalistką ds. szkoleń w polskiej firmie, która mierzy efektywność szkoleń, zaczynając od poziomu reakcji w modelu Kirkpatricka. Przygotuj ankietę poszkoleniową i analizę wyników.\n\nDANE:\nSzkolenie: [SZKOLENIE]\nCele szkolenia: [CELE SZKOLENIA]\nLiczba uczestników: [LICZBA UCZESTNIKÓW]\nWyniki ankiety: [WYNIKI ANKIETY]\nDo czego posłużą wnioski: [DO CZEGO POSŁUŻĄ WNIOSKI]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj wyników, procentów ani cytatów – luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Ankieta ma być krótka (maksymalnie 10 pytań, do 3 minut), anonimowa i obejmować: przydatność treści, trenera, organizację, deklarowane zastosowanie w pracy oraz NPS szkolenia.\n3. Pytania nie mogą prosić o dane pozwalające zidentyfikować osobę w małej grupie (np. stanowisko w 2-osobowym dziale).\n4. Analizując wyniki, podaj liczbę odpowiedzi i zaznacz, gdy jest ich za mało na mocne wnioski. Komentarze otwarte pogrupuj w tematy, bez przytaczania fragmentów, które mogą wskazać autora.\n5. Oddziel opinię uczestników od rzeczywistego efektu – ocena reakcji nie dowodzi zmiany zachowań w pracy.\n\nFORMAT WYNIKU:\nA) Ankieta do skopiowania (skale 1–5, NPS 0–10, 2 pytania otwarte) z krótkim wstępem.\nB) Jeśli są wyniki: tabela pytanie | średnia | rozkład | komentarz.\nC) Tematy z komentarzy otwartych: temat | liczba wzmianek | wniosek.\nD) 3 mocne strony, 3 obszary do poprawy, rekomendacja: powtórzyć / zmodyfikować / zrezygnować.\nE) Podsumowanie dla zarządu w 5 zdaniach.\nF) Lista „sprawdź przed użyciem”.", "polecenia": ["Skróć ankietę do 5 pytań.", "Przygotuj wersję ankiety do wypełnienia na telefonie przez kod QR na sali.", "Napisz informację zwrotną dla trenera: konkretną i życzliwą.", "Przygotuj maila do uczestników z podziękowaniem i prośbą o wypełnienie ankiety.", "Dodaj pytanie follow-up do wysłania uczestnikom po 30 dniach.", "Porównaj wyniki tego szkolenia z poprzednim, które Ci wkleję.", "Zrób z wniosków wersję na Slack dla kierowników uczestników.", "Przygotuj wersję ankiety prostym językiem dla pracowników z Ukrainy.", "Dodaj wykres w formie tabeli do przeniesienia do Excela.", "Przetłumacz ankietę na angielski."], "checklista": ["Ankieta jest anonimowa, a w małych grupach nie da się zidentyfikować autorów odpowiedzi.", "Wyniki i procenty pochodzą z rzeczywistych odpowiedzi, a nie z założeń AI.", "Do AI nie trafiły dane osobowe uczestników (RODO – anonimizacja).", "Przy małej liczbie odpowiedzi wnioski są oznaczone jako orientacyjne.", "Informacja zwrotna dla trenera jest rzeczowa i nie zawiera cytatów wskazujących autora.", "Rekomendacja o powtórzeniu szkolenia uwzględnia także budżet i cele biznesowe.", "Wnioski zweryfikowane przez Ciebie przed wysłaniem do zarządu."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Wysoka ocena szkolenia to dobry znak, ale nie dowód efektu: do decyzji budżetowych dołóż pomiar zmiany zachowań i wyników."}, {"id": "3.09", "nazwa": "Budżet szkoleniowy", "co_robi": "Układa roczny plan i budżet szkoleniowy: priorytety, harmonogram, koszty i warianty na różne kwoty. Oddziela szkolenia obowiązkowe od rozwojowych i pokazuje zarządowi, co dostanie za każdy wariant.", "kiedy": "Jesienią, gdy zarząd prosi o plan szkoleń na przyszły rok, a Ty masz listę potrzeb, kilka ofert i pytanie „ile to będzie kosztować i co możemy wyciąć?”.", "brief": [{"pole": "Firma i liczba pracowników", "opis": "Wielkość i struktura, np. „firma produkcyjna, 85 osób: 60 produkcja, 15 biuro, 10 kadra kierownicza”."}, {"pole": "Kwota budżetu", "opis": "Dostępna kwota lub „do zaproponowania”, np. „ok. 60 000 zł netto na rok”."}, {"pole": "Potrzeby szkoleniowe", "opis": "Lista z analizy potrzeb, np. „Excel dla biura, szkolenie menedżerskie dla 10 kierowników, uprawnienia na wózki widłowe dla 4 osób”."}, {"pole": "Szkolenia obowiązkowe", "opis": "Co musi się odbyć, np. „szkolenie BHP wstępne dla nowych osób, okresowe BHP, uprawnienia UDT” – kwoty tylko z ofert."}, {"pole": "Oferty i koszty", "opis": "Ceny, które już znasz z ofert, np. „szkolenie menedżerskie – oferta A 18 000 zł netto za grupę, oferta B 12 500 zł netto”."}, {"pole": "Priorytety zarządu", "opis": "Na czym zarządowi zależy, np. „mniej błędów jakościowych, przygotowanie następców, wdrożenie ERP w III kwartale”."}], "prompt": "Jesteś doświadczonym HR business partnerem w polskiej firmie z sektora MŚP, który co roku przygotowuje plan i budżet szkoleniowy dla zarządu. Przygotuj roczny plan budżetu szkoleniowego z wariantami.\n\nDANE:\nFirma i liczba pracowników: [FIRMA I LICZBA PRACOWNIKÓW]\nKwota budżetu: [KWOTA BUDŻETU]\nPotrzeby szkoleniowe: [POTRZEBY SZKOLENIOWE]\nSzkolenia obowiązkowe: [SZKOLENIA OBOWIĄZKOWE]\nOferty i znane koszty: [OFERTY I KOSZTY]\nPriorytety zarządu: [PRIORYTETY ZARZĄDU]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj cen, stawek, kwot dofinansowań ani wymogów prawnych – używaj tylko kosztów, które podałam; brakujące oznacz [DO UZUPEŁNIENIA], szacunki [ZAŁOŻENIE].\n2. Szkolenia obowiązkowe (w tym szkolenie BHP wstępne i okresowe oraz wymagane uprawnienia) umieść w osobnej pozycji, której nie wolno wyciąć. Zakres i terminy oznacz [DO WERYFIKACJI] z kadrami i specjalistą BHP – nie podawaj ich z pamięci.\n3. Każdą pozycję rozwojową powiąż z priorytetem zarządu i oceń wpływ (wysoki/średni/niski).\n4. Rozróżniaj kwoty netto i brutto; dolicz koszty pośrednie (czas pracy uczestników, dojazdy, sala) jako osobną kolumnę z oznaczeniem [ZAŁOŻENIE].\n5. Możliwe źródła dofinansowania (np. publiczne fundusze szkoleniowe) wymień tylko jako kierunek do sprawdzenia – [DO WERYFIKACJI], bez kwot i terminów.\n\nFORMAT WYNIKU:\nA) Tabela budżetu: pozycja | grupa | liczba osób | koszt bezpośredni | koszty pośrednie | kwartał | priorytet | obowiązkowe tak/nie.\nB) Trzy warianty: minimalny (tylko obowiązkowe + top 2), podstawowy, rozszerzony – z sumą i tym, co zarząd dostaje w każdym.\nC) Harmonogram kwartalny.\nD) Uzasadnienie dla zarządu w 6–8 zdaniach.\nE) Lista „sprawdź przed użyciem”: założenia, brakujące oferty, pozycje do weryfikacji.", "polecenia": ["Zrób tabelę budżetu w formacie do wklejenia do Excela.", "Pokaż, co wyciąć, jeśli budżet zostanie obcięty o 30%.", "Przygotuj prezentację budżetu dla zarządu w 5 slajdach.", "Dodaj ryzyka rezygnacji z każdej pozycji rozwojowej.", "Zaproponuj tańsze alternatywy: szkolenia wewnętrzne, e-learning, mentoring.", "Napisz zapytanie ofertowe do 3 firm szkoleniowych.", "Rozbij budżet na działy dla kierowników.", "Przygotuj krótkie podsumowanie budżetu na Teams dla zarządu.", "Dodaj kolumnę z kosztem na jednego uczestnika.", "Przetłumacz wariant podstawowy na angielski dla właściciela spoza Polski."], "checklista": ["Wszystkie kwoty pochodzą z ofert lub danych firmy, a szacunki są oznaczone jako założenia.", "Szkolenia obowiązkowe (BHP wstępne, okresowe, uprawnienia) potwierdzone z kadrami i specjalistą BHP.", "Kwoty netto i brutto są rozróżnione i zsumowane poprawnie.", "Każda pozycja rozwojowa ma powiązanie z priorytetem biznesowym.", "Dostęp do szkoleń jest planowany według równych, obiektywnych kryteriów dla wszystkich grup pracowników.", "Dofinansowania sprawdzone w aktualnych źródłach, a nie przyjęte z odpowiedzi AI.", "Budżet zweryfikowany przez Ciebie i księgowość przed przedstawieniem zarządowi."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Nie wpisuj do budżetu kwot ani wymogów szkoleń obowiązkowych z pamięci AI – zawsze bierz je z aktualnych ofert i od specjalisty BHP."}, {"id": "3.10", "nazwa": "ROI i efektywność szkoleń", "co_robi": "Ocenia efektywność szkolenia na czterech poziomach modelu Kirkpatricka i – jeśli są dane – liczy ROI. Dobiera wskaźniki, porządkuje dane i przygotowuje rzetelny raport dla zarządu.", "kiedy": "Gdy zarząd pyta „co nam dało to szkolenie za 40 tysięcy?” albo chcesz obronić budżet szkoleniowy na przyszły rok konkretnymi danymi.", "brief": [{"pole": "Szkolenie lub program", "opis": "Co oceniasz, np. „program rozwoju kierowników zmian, 6 modułów, 10 osób, styczeń–czerwiec”."}, {"pole": "Koszty programu", "opis": "Koszty bezpośrednie i pośrednie, np. „trener 24 000 zł netto, sala i catering 3 000 zł, 120 godzin pracy uczestników”."}, {"pole": "Cele i oczekiwane efekty", "opis": "Co miało się zmienić, np. „spadek rotacji w zespołach kierowników o połowę, mniej błędów kompletacji”."}, {"pole": "Dane przed i po", "opis": "Zanonimizowane wskaźniki, np. „rotacja 6 mies. przed: 18%, po: 11%; błędy kompletacji 2,1% → 1,4%; ankieta reakcji 4,5/5”."}, {"pole": "Inne czynniki", "opis": "Co jeszcze mogło wpłynąć, np. „podwyżki w marcu, nowy system WMS w kwietniu”."}], "prompt": "Jesteś doświadczonym specjalistą ds. ewaluacji szkoleń i analityki HR w polskiej firmie, pracującym na modelu Kirkpatricka i metodzie ROI Phillipsa. Oceń efektywność szkolenia i przygotuj raport dla zarządu.\n\nDANE:\nSzkolenie lub program: [SZKOLENIE LUB PROGRAM]\nKoszty programu: [KOSZTY PROGRAMU]\nCele i oczekiwane efekty: [CELE I OCZEKIWANE EFEKTY]\nDane przed i po: [DANE PRZED I PO]\nInne czynniki wpływające na wyniki: [INNE CZYNNIKI]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj liczb, kosztów, wartości pieniężnych ani wyników – luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Oceń cztery poziomy: reakcja, uczenie się, zachowanie, wyniki. Dla każdego wskaż wskaźnik, dane, którymi dysponuję, i dane, których brakuje.\n3. ROI licz tylko wtedy, gdy korzyści da się wyrazić w złotych na podstawie moich danych: ROI = (korzyści netto ÷ koszty) × 100%. Każde przeliczenie na pieniądze pokaż krok po kroku i oznacz założenia.\n4. Uwzględnij inne czynniki: oszacuj udział szkolenia ostrożnie i zaznacz, że to szacunek. Nie przypisuj szkoleniu całej poprawy.\n5. Pracuj na danych zagregowanych i zanonimizowanych; nie oceniaj pojedynczych osób.\n6. Ton raportu: rzeczowy, bez przesady – lepiej pokazać ostrożny wynik niż wynik, którego nie da się obronić.\n\nFORMAT WYNIKU:\nA) Tabela Kirkpatricka: poziom | wskaźnik | wynik | źródło danych | ocena | czego brakuje.\nB) Obliczenie ROI krok po kroku (lub informacja, jakich danych brakuje, by je policzyć).\nC) Wnioski: co zadziałało, co nie, co zmienić w kolejnej edycji.\nD) Raport dla zarządu na 1 stronę: cel, koszt, efekty, ROI lub ocena jakościowa, rekomendacja.\nE) Plan pomiaru na przyszłość: jakie dane zbierać przed kolejnym szkoleniem.\nF) Lista „sprawdź przed użyciem” z założeniami.", "polecenia": ["Przygotuj raport w 5 slajdach dla zarządu.", "Policz ROI w trzech wariantach: ostrożnym, realistycznym i optymistycznym.", "Skróć raport do 5 zdań na Teams dla prezesa.", "Dodaj ryzyka i ograniczenia tej oceny.", "Zaproponuj grupę kontrolną lub inne podejście do kolejnej edycji.", "Przygotuj ankietę dla kierowników o zmianie zachowań po 3 miesiącach.", "Zrób tabelę wskaźników do comiesięcznego monitorowania w Excelu.", "Porównaj efektywność dwóch szkoleń, których dane Ci wkleję.", "Napisz wersję raportu dla uczestników programu z podziękowaniem.", "Przetłumacz raport dla zarządu na angielski."], "checklista": ["Wszystkie liczby pochodzą z danych firmy, a założenia są wyraźnie oznaczone.", "Przeliczenia na złotówki są pokazane krok po kroku i dają się sprawdzić.", "Wpływ innych czynników został uwzględniony, a udział szkolenia oszacowany ostrożnie.", "Dane są zagregowane i zanonimizowane – do AI nie trafiły dane osobowe (RODO).", "Raport nie służy do oceny pojedynczych pracowników.", "Koszty obejmują także czas pracy uczestników.", "Wynik ROI zweryfikowany przez Ciebie i finanse przed przedstawieniem zarządowi."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. ROI szkolenia zawsze opiera się na założeniach – pokaż je zarządowi otwarcie, bo to buduje wiarygodność bardziej niż wysoki procent."}]}, {"dzial_nr": 4, "dzial": "Kultura i atmosfera w pracy", "opis": "Badania zaangażowania, eNPS, wartości, rytuały zespołowe, kanały zgłoszeń i offboarding – wszystko, co pozwala usłyszeć ludzi i zadbać o atmosferę. Podajesz dane i kontekst, dostajesz gotowe kwestionariusze, analizy, procedury do weryfikacji i raporty dla zarządu.", "skills": [{"id": "4.01", "nazwa": "Badanie zaangażowania i atmosfery — kwestionariusz", "co_robi": "Projektuje kompletny kwestionariusz badania zaangażowania i atmosfery w pracy: obszary, pytania ze skalą, pytania otwarte i komunikat zapraszający. Pilnuje anonimowości, minimalnej wielkości grup w raportach i zgodności z RODO.", "kiedy": "Gdy zarząd pyta „jak ludzie się u nas czują?”, rotacja rośnie albo chcesz pierwszy raz zrobić rzetelne badanie zamiast rozmów na korytarzu.", "brief": [{"pole": "Firma i zespoły", "opis": "Branża, liczba osób, struktura, np. „firma logistyczna, 140 osób: magazyn 90, biuro 35, kierowcy 15”."}, {"pole": "Cel badania", "opis": "Co chcesz się dowiedzieć, np. „dlaczego odchodzą magazynierzy po pół roku i jak oceniane są kierowniczki zmian”."}, {"pole": "Obszary do zbadania", "opis": "Tematy, które Cię interesują, np. „relacje z przełożonym, obciążenie pracą, wynagrodzenie, rozwój, komunikacja z zarządem”."}, {"pole": "Długość i forma", "opis": "Ile czasu i jakim narzędziem, np. „maks. 10 minut, Microsoft Forms, część osób wypełnia na telefonie w przerwie”."}, {"pole": "Przekroje wyników", "opis": "Po czym chcesz dzielić wyniki, np. „dział i staż pracy – bez płci i wieku”."}, {"pole": "Wcześniejsze badania", "opis": "Czy coś już było, np. „badanie w 2024 r., 40% zwrotów, ludzie bali się, że ankieta nie jest anonimowa”."}], "prompt": "Jesteś doświadczoną specjalistką ds. badań opinii pracowników i HR w polskiej firmie z sektora MŚP. Przygotuj kwestionariusz badania zaangażowania i atmosfery w pracy, który ludzie naprawdę wypełnią szczerze.\n\nDANE:\nFirma i zespoły: [FIRMA I ZESPOŁY]\nCel badania: [CEL BADANIA]\nObszary do zbadania: [OBSZARY DO ZBADANIA]\nDługość i forma: [DŁUGOŚĆ I FORMA]\nPrzekroje wyników: [PRZEKROJE WYNIKÓW]\nWcześniejsze badania: [WCZEŚNIEJSZE BADANIA]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj liczb ani danych firmy; luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Anonimowość: nie pytaj o imię, e-mail, wiek ani płeć, chyba że jest to absolutnie konieczne. Przekroje dobierz tak, by żadna grupa w raporcie nie liczyła mniej niż 5 osób – jeśli jakiś przekrój to łamie, zaproponuj łączenie grup.\n3. Pytania krótkie, jednoznaczne, jedno zagadnienie w pytaniu, bez sugerowania odpowiedzi. Skala 1–5 z opisanymi krańcami plus opcja „nie wiem / nie dotyczy”.\n4. Język prosty, zrozumiały także dla pracowników fizycznych i osób, dla których polski nie jest pierwszym językiem.\n5. Zgodność z RODO opisz ogólnie (administrator, cel, minimalizacja danych) i oznacz [DO WERYFIKACJI] z osobą odpowiedzialną za ochronę danych.\n6. Zmieść się w zadanym czasie wypełniania; podaj szacowany czas.\n\nFORMAT WYNIKU:\nA) Tabela: obszar | pytanie | skala | po co to pytanie.\nB) 2–3 pytania otwarte na koniec.\nC) Gotowy komunikat zapraszający do badania (e-mail i krótka wersja na tablicę lub komunikator) z jasną informacją o anonimowości.\nD) Krótka nota informacyjna o przetwarzaniu danych do uzupełnienia.\nE) Lista „sprawdź przed wysyłką”: założenia, luki i ryzyka identyfikacji osób.", "polecenia": ["Skróć kwestionariusz tak, żeby dało się go wypełnić w 5 minut.", "Dodaj 3 pytania o relację z bezpośrednim przełożonym.", "Przeredaguj pytania prostszym językiem dla pracowników magazynu.", "Przygotuj wersję po ukraińsku i po angielsku dla pracowników z zagranicy.", "Sprawdź, które pytania są sugerujące, i popraw je.", "Napisz przypomnienie o badaniu na trzeci dzień zbierania odpowiedzi.", "Przygotuj krótką prezentację dla kierowników: po co badanie i jak o nim mówić zespołom.", "Zaproponuj harmonogram badania od ogłoszenia do prezentacji wyników.", "Dopisz sekcję o pracy zdalnej i hybrydowej.", "Zrób wersję wiadomości na Teams lub Slack z linkiem do ankiety."], "checklista": ["W ankiecie nie ma pytań, które pozwalają zidentyfikować konkretną osobę.", "Żaden przekrój wyników nie tworzy grupy mniejszej niż 5 osób.", "Nie zbierasz danych wrażliwych (zdrowie, poglądy, przynależność związkowa) ani danych zbędnych dla celu badania – RODO, minimalizacja danych.", "Pytania są neutralne i nie sugerują odpowiedzi.", "Ustawienia narzędzia nie zapisują e-maili ani adresów IP respondentów.", "Komunikat jasno mówi, kto zobaczy wyniki i kiedy zostaną przedstawione.", "Nota o przetwarzaniu danych została zweryfikowana przez Ciebie lub osobę odpowiedzialną za ochronę danych."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Anonimowość to obietnica, której trzeba dotrzymać: sprawdź ustawienia narzędzia ankietowego, zanim wyślesz link."}, {"id": "4.02", "nazwa": "Analiza wyników badania i plan działań", "co_robi": "Zamienia zestawienie wyników badania zaangażowania w czytelne wnioski: mocne strony, obszary ryzyka, priorytety i konkretny plan działań z właścicielami i terminami. Oddziela fakty z danych od interpretacji.", "kiedy": "Gdy masz już eksport wyników z ankiety, a za tydzień musisz pokazać zarządowi, co z tego wynika i co firma zrobi dalej.", "brief": [{"pole": "Wyniki liczbowe", "opis": "Średnie lub odsetki odpowiedzi pozytywnych na obszar, np. „relacje w zespole 4,2; wynagrodzenie 2,6; komunikacja z zarządem 2,9; rozwój 3,1”."}, {"pole": "Frekwencja i grupy", "opis": "Ile osób wzięło udział i w jakich grupach, np. „98 z 140 osób (70%), magazyn 60, biuro 30, kierowcy 8”."}, {"pole": "Porównanie", "opis": "Wyniki z poprzedniego badania lub różnice między działami, np. „w 2024 r. komunikacja 3,4; magazyn wyraźnie niżej niż biuro”."}, {"pole": "Kontekst firmy", "opis": "Co działo się w ostatnich miesiącach, np. „zmiana systemu grafików, podwyżki tylko dla biura, nowy dyrektor operacyjny”."}, {"pole": "Zasoby na działania", "opis": "Na co realnie Cię stać, np. „budżet ok. 20 tys. zł na rok, 2 godziny miesięcznie czasu kierowników”."}], "prompt": "Jesteś doświadczonym HR business partnerem w polskiej firmie, który potrafi z wyników badania zaangażowania wyciągnąć rzeczowe wnioski i przełożyć je na wykonalny plan.\n\nDANE:\nWyniki liczbowe: [WYNIKI LICZBOWE]\nFrekwencja i grupy: [FREKWENCJA I GRUPY]\nPorównanie: [PORÓWNANIE]\nKontekst firmy: [KONTEKST FIRMY]\nZasoby na działania: [ZASOBY NA DZIAŁANIA]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj wyników, odsetków ani przyczyn; luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Oddzielaj wyraźnie: co mówią dane, a co jest Twoją hipotezą do sprawdzenia w rozmowach z zespołami.\n3. Nie interpretuj wyników grup poniżej 5 osób – zaznacz, że są zbyt małe.\n4. Oceń, czy frekwencja pozwala na wnioski dla całej firmy; jeśli jest niska, napisz to wprost.\n5. Wybierz maksymalnie 3 priorytety. Kryteria: wpływ na zaangażowanie i rotację, skala problemu, wykonalność przy podanych zasobach.\n6. Działania mają być konkretne (kto, co, do kiedy, jak zmierzymy efekt), a nie hasła typu „poprawić komunikację”.\n7. Jeśli któreś działanie dotyka wynagrodzeń, regulaminów lub czasu pracy, oznacz je [DO WERYFIKACJI] z kadrami lub prawnikiem.\n\nFORMAT WYNIKU:\nA) Podsumowanie w 5 zdaniach dla zarządu.\nB) Tabela: obszar | wynik | zmiana lub różnica | ocena (mocna strona / do obserwacji / ryzyko).\nC) 3 priorytety z uzasadnieniem.\nD) Plan działań: działanie | właściciel | termin | miernik sukcesu.\nE) Propozycja, jak oddać wyniki pracownikom (spotkania, komunikat).\nF) Lista „sprawdź przed prezentacją”: hipotezy, założenia i luki.", "polecenia": ["Zrób z tego 5 slajdów dla zarządu w punktach.", "Napisz komunikat do wszystkich pracowników z podziękowaniem i głównymi wnioskami.", "Przygotuj scenariusz 45-minutowego spotkania z zespołem o wynikach.", "Dodaj ryzyka, jeśli nic nie zrobimy z wynikami.", "Rozpisz plan działań na kwartały z kamieniami milowymi.", "Przygotuj pytania do warsztatu z zespołem magazynu, żeby zrozumieć niski wynik.", "Skróć plan do 3 działań, które da się zrobić bez budżetu.", "Przygotuj wersję dla kierowników z ich rolą w planie.", "Przetłumacz podsumowanie na angielski dla właściciela spoza Polski.", "Zaproponuj, jak za pół roku sprawdzić, czy działania zadziałały."], "checklista": ["Każdy wniosek wynika z danych, a hipotezy są wyraźnie oznaczone jako hipotezy.", "Nie pokazujesz wyników grup mniejszych niż 5 osób.", "Priorytetów jest najwyżej 3 i każdy ma właściciela oraz termin.", "Plan jest realny przy budżecie i czasie, którym naprawdę dysponujesz.", "Komunikat do pracowników nie obiecuje rzeczy, na które zarząd się nie zgodził.", "Działania dotyczące wynagrodzeń, regulaminów lub czasu pracy zweryfikowane przez Ciebie z kadrami lub prawnikiem.", "Do AI nie wklejasz danych pozwalających zidentyfikować pojedyncze osoby – RODO."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Najgorsze, co może się stać po badaniu, to cisza: ustal z zarządem termin pokazania wyników, zanim zaczniesz analizę."}, {"id": "4.03", "nazwa": "Analiza komentarzy otwartych z ankiety", "co_robi": "Porządkuje setki komentarzy z pytań otwartych: grupuje je w tematy, liczy częstotliwość, ocenia wydźwięk i wybiera reprezentatywne cytaty bez danych pozwalających rozpoznać autora. Pokazuje, jak przed wklejeniem zanonimizować tekst.", "kiedy": "Gdy po badaniu masz arkusz z kilkuset wpisami typu „co byś zmienił/zmieniła w firmie” i nie masz czasu czytać ich po kilka razy.", "brief": [{"pole": "Pytanie otwarte", "opis": "Treść pytania, na które odpowiadali ludzie, np. „Co jedna rzecz poprawiłaby Twoją codzienną pracę?”."}, {"pole": "Komentarze", "opis": "Wklej komentarze PO anonimizacji (usuń imiona, nazwiska, nazwy małych zespołów, opisy zdarzeń, po których można kogoś rozpoznać), np. „grafik dostajemy w piątek wieczorem; kierowniczka zmiany nie słucha; brak szkoleń na wózki”."}, {"pole": "Liczba odpowiedzi", "opis": "Ile komentarzy wklejasz i z ilu ankiet, np. „212 komentarzy z 98 ankiet”."}, {"pole": "Na czym Ci zależy", "opis": "Do czego potrzebujesz analizy, np. „chcę wiedzieć, co najbardziej boli magazyn i co pokazać zarządowi”."}], "prompt": "Jesteś doświadczonym analitykiem HR w polskiej firmie, specjalizującym się w analizie jakościowej odpowiedzi z badań pracowniczych. Przeanalizuj komentarze z pytania otwartego.\n\nDANE:\nPytanie otwarte: [PYTANIE OTWARTE]\nKomentarze: [KOMENTARZE]\nLiczba odpowiedzi: [LICZBA ODPOWIEDZI]\nCel analizy: [NA CZYM CI ZALEŻY]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj komentarzy ani liczb; luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Najpierw sprawdź komentarze pod kątem danych osobowych lub szczegółów, po których można rozpoznać autora albo osobę opisaną (imiona, nazwiska, unikalne stanowiska, konkretne zdarzenia, dane o zdrowiu). Wypisz, które fragmenty trzeba jeszcze zanonimizować, i w dalszej analizie ich nie cytuj.\n3. Pogrupuj komentarze w 5–10 tematów. Jeden komentarz może należeć do kilku tematów. Podaj liczbę i odsetek wzmianek.\n4. Dla każdego tematu oceń wydźwięk: pozytywny, negatywny, mieszany.\n5. Cytaty wybieraj reprezentatywne, krótkie i przeredagowane tak, by nie dało się rozpoznać autora (styl, gwara, szczegóły). Nie cytuj komentarzy obraźliwych wobec konkretnych osób.\n6. Sygnały poważne (możliwy mobbing, dyskryminacja, zagrożenie bezpieczeństwa) wypisz osobno i oznacz [DO WERYFIKACJI] – to sprawy do procedury, nie do raportu.\n\nFORMAT WYNIKU:\nA) Fragmenty wymagające dodatkowej anonimizacji.\nB) Tabela: temat | liczba wzmianek | odsetek | wydźwięk | 1–2 cytaty po anonimizacji.\nC) 3 najważniejsze wnioski w punktach.\nD) Sygnały poważne do dalszego wyjaśnienia.\nE) Lista „sprawdź przed użyciem”: założenia i niepewne przypisania do tematów.", "polecenia": ["Połącz podobne tematy, żeby zostało maksymalnie 6.", "Pokaż tylko komentarze z sugestiami rozwiązań, pogrupowane tematycznie.", "Zrób wykres słupkowy tematów w formie tabeli do Excela.", "Przeredaguj cytaty jeszcze bardziej neutralnie, żeby nie było widać stylu autora.", "Napisz akapit z wnioskami do raportu dla zarządu.", "Porównaj tematy z wynikami liczbowymi, które Ci podam.", "Wypisz 5 rzeczy, które można poprawić od razu i bez kosztów.", "Przygotuj wersję wniosków dla kierowników bez cytatów.", "Sprawdź jeszcze raz, czy w tabeli nie zostały dane osobowe.", "Przetłumacz tematy i wnioski na angielski."], "checklista": ["Komentarze zostały zanonimizowane PRZED wklejeniem do AI – bez imion, nazwisk, PESEL, danych o zdrowiu i opisów, po których można kogoś rozpoznać (RODO).", "Żaden cytat w raporcie nie pozwala odgadnąć autora ani osoby opisanej.", "Liczby wzmianek zgadzają się z liczbą wklejonych komentarzy.", "Sygnały możliwego mobbingu lub dyskryminacji przekazane do właściwej procedury, a nie tylko opisane w raporcie.", "Tematy są nazwane neutralnie, bez ocen konkretnych osób.", "Wnioski zweryfikowane przez Ciebie na próbce oryginalnych komentarzy."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Anonimizacja to Twoje zadanie przed wklejeniem: AI pomoże wskazać ryzykowne fragmenty, ale nie powinna dostawać danych, których nie potrzebuje."}, {"id": "4.04", "nazwa": "Pulse survey — krótkie badania cykliczne", "co_robi": "Projektuje system krótkich, regularnych badań nastrojów: zestaw 5–8 pytań, rotację pytań, rytm wysyłki i sposób pokazywania trendów. Dzięki temu widzisz zmiany na bieżąco, a nie raz w roku.", "kiedy": "Gdy duże badanie roczne to za mało, w firmie dużo się zmienia (reorganizacja, nowy szef, praca hybrydowa) i chcesz trzymać rękę na pulsie bez męczenia ludzi.", "brief": [{"pole": "Firma i zespoły", "opis": "Wielkość i struktura, np. „software house, 60 osób, 6 zespołów projektowych, praca hybrydowa”."}, {"pole": "Co chcesz śledzić", "opis": "Najważniejsze tematy, np. „obciążenie pracą, nastrój po reorganizacji, współpraca z nowym CTO”."}, {"pole": "Częstotliwość", "opis": "Jak często możesz badać, np. „co 2 tygodnie albo raz w miesiącu – ludzie narzekają na nadmiar ankiet”."}, {"pole": "Narzędzie", "opis": "Czym wyślesz ankietę, np. „Google Forms przez Slack” albo „moduł w systemie HR”."}, {"pole": "Kto dostaje wyniki", "opis": "Komu i jak pokażesz dane, np. „zarząd co miesiąc, liderzy zespołów tylko wyniki zbiorcze swojego zespołu”."}], "prompt": "Jesteś doświadczoną specjalistką HR w polskiej firmie, która prowadzi programy pulse survey i wie, jak utrzymać wysoką frekwencję bez zmęczenia ankietami.\n\nDANE:\nFirma i zespoły: [FIRMA I ZESPOŁY]\nCo chcesz śledzić: [CO CHCESZ ŚLEDZIĆ]\nCzęstotliwość: [CZĘSTOTLIWOŚĆ]\nNarzędzie: [NARZĘDZIE]\nOdbiorcy wyników: [KTO DOSTAJE WYNIKI]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj liczb ani danych firmy; luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Jedna ankieta to maksymalnie 5–8 pytań i do 2 minut wypełniania, w tym jedno pytanie otwarte.\n3. Zaproponuj 3–4 pytania stałe (do śledzenia trendu) i pulę pytań rotacyjnych na kolejne edycje.\n4. Anonimowość: wyniki zespołu pokazuj dopiero od 5 odpowiedzi; nie zbieraj danych identyfikujących ani wrażliwych (RODO, minimalizacja danych).\n5. Każda edycja musi kończyć się informacją zwrotną dla pracowników „co usłyszeliśmy i co robimy” – inaczej frekwencja spadnie.\n6. Częstotliwość dopasuj do tego, ile firma realnie jest w stanie zrobić z wynikami.\n\nFORMAT WYNIKU:\nA) Pytania stałe ze skalą i uzasadnieniem.\nB) Pula 12 pytań rotacyjnych pogrupowanych tematycznie.\nC) Kalendarz na 6 miesięcy: data | pytania | komunikat.\nD) Szablon krótkiego raportu z trendem (tabela do wypełnienia).\nE) Gotowe komunikaty: zaproszenie, przypomnienie, „co usłyszeliśmy”.\nF) Lista „sprawdź przed startem”: założenia i ryzyka.", "polecenia": ["Skróć ankietę do 3 pytań na tygodniowy check-in.", "Dodaj pytania o dobrostan i ryzyko wypalenia, bez pytań o zdrowie.", "Przygotuj komunikat na Slack lub Teams z emoji i linkiem.", "Napisz instrukcję dla liderów, jak rozmawiać z zespołem o wynikach pulsu.", "Zaproponuj, co robić, gdy frekwencja spadnie poniżej 50%.", "Przygotuj pytania specjalne na okres reorganizacji.", "Zrób szablon arkusza do śledzenia trendu w Excelu.", "Przetłumacz ankietę na angielski dla osób spoza Polski.", "Dodaj pytanie eNPS i zaplanuj, jak często je zadawać.", "Przygotuj wersję B zaproszenia do testu, która lepiej zachęca do udziału."], "checklista": ["Ankieta zajmuje naprawdę nie więcej niż 2 minuty – sprawdzone na sobie.", "Wyniki zespołów pokazujesz dopiero od 5 odpowiedzi.", "Narzędzie nie zbiera imion, e-maili ani danych wrażliwych – RODO.", "Po każdej edycji jest zaplanowany komunikat zwrotny do pracowników.", "Liderzy wiedzą, czego nie robić z wynikami (szukać autorów, karać zespół).", "Kalendarz nie koliduje z dużym badaniem rocznym i okresem ocen.", "Zasady programu zweryfikowane przez Ciebie i zaakceptowane przez zarząd."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Pulse ma sens tylko wtedy, gdy firma reaguje na wyniki: lepiej badać rzadziej i za każdym razem coś zmienić."}, {"id": "4.05", "nazwa": "eNPS — pomiar, obliczenie i komunikacja", "co_robi": "Pomaga poprawnie zadać pytanie eNPS, policzyć wynik, zinterpretować go w kontekście firmy i przygotować komunikację wyników dla zarządu i pracowników. Dobiera też pytanie pogłębiające „dlaczego”.", "kiedy": "Gdy zarząd chce „jednej liczby” o tym, czy ludzie polecają firmę jako pracodawcę, albo masz już wyniki eNPS i nie wiesz, czy -5 to katastrofa, czy norma.", "brief": [{"pole": "Rozkład odpowiedzi", "opis": "Ile osób zaznaczyło każdą ocenę 0–10 albo liczby grup, np. „promotorzy 31, pasywni 42, krytycy 27 – razem 100 osób”."}, {"pole": "Firma i moment pomiaru", "opis": "Kontekst, np. „sieć 12 sklepów, 180 osób, pomiar po sezonie świątecznym i zmianie grafików”."}, {"pole": "Poprzednie wyniki", "opis": "Wcześniejsze pomiary, np. „eNPS +8 rok temu” albo „pierwszy pomiar”."}, {"pole": "Komentarze do wyniku", "opis": "Zanonimizowane odpowiedzi na pytanie „dlaczego”, np. „dobra atmosfera w zespole; za niskie stawki; grafik zmieniany z dnia na dzień”."}, {"pole": "Odbiorcy komunikacji", "opis": "Komu przedstawisz wynik, np. „zarząd na spotkaniu miesięcznym i wszyscy pracownicy w aplikacji wewnętrznej”."}], "prompt": "Jesteś doświadczonym analitykiem HR w polskiej firmie, który regularnie mierzy eNPS i tłumaczy jego wyniki zarządowi i pracownikom bez przesady w żadną stronę.\n\nDANE:\nRozkład odpowiedzi: [ROZKŁAD ODPOWIEDZI]\nFirma i moment pomiaru: [FIRMA I MOMENT POMIARU]\nPoprzednie wyniki: [POPRZEDNIE WYNIKI]\nKomentarze: [KOMENTARZE DO WYNIKU]\nOdbiorcy: [ODBIORCY KOMUNIKACJI]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj liczb, benchmarków ani danych firmy; luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Podaj standardowe brzmienie pytania eNPS (skala 0–10) i pytania pogłębiającego.\n3. Licz jawnie: promotorzy 9–10, pasywni 7–8, krytycy 0–6; eNPS = odsetek promotorów minus odsetek krytyków. Pokaż obliczenie krok po kroku.\n4. Przy małych liczbach odpowiedzi zaznacz, że wynik jest niestabilny, a zmiana o kilka punktów może być przypadkowa.\n5. Nie podawaj „średnich rynkowych” z pamięci. Jeśli porównanie z rynkiem jest potrzebne, oznacz je [DO WERYFIKACJI] ze źródłem.\n6. Interpretuj wynik razem z komentarzami i kontekstem, nie jako samodzielną ocenę.\n7. Nie licz eNPS dla grup poniżej 5 osób.\n\nFORMAT WYNIKU:\nA) Obliczenie eNPS krok po kroku.\nB) Interpretacja w 5 zdaniach: co wynik mówi, a czego nie mówi.\nC) Tabela tematów z komentarzy: temat | promotorzy | krytycy.\nD) Gotowy komunikat dla zarządu i osobny dla pracowników.\nE) 3 propozycje działań na kolejny kwartał.\nF) Lista „sprawdź przed użyciem”: założenia i ograniczenia wyniku.", "polecenia": ["Policz eNPS osobno dla działów, które Ci podam, z pominięciem grup poniżej 5 osób.", "Napisz komunikat dla pracowników w wersji na tablicę ogłoszeń.", "Przygotuj jeden slajd dla zarządu z wynikiem i trendem.", "Zaproponuj 3 pytania pogłębiające do rozmów z krytykami w zespołach.", "Wyjaśnij prostym językiem, czym eNPS różni się od średniej ocen.", "Przygotuj odpowiedź na pytanie zarządu: dlaczego wynik jest ujemny.", "Dodaj ryzyka nadinterpretacji wyniku.", "Zrób szablon w Excelu do liczenia eNPS z formułami opisanymi słownie.", "Przetłumacz komunikat dla zarządu na angielski.", "Napisz wersję komunikatu dla pracowników z Ukrainy prostym językiem."], "checklista": ["Obliczenie sprawdzone ręcznie: odsetek promotorów minus odsetek krytyków.", "Liczba odpowiedzi jest podana obok wyniku.", "Nie podajesz wyników dla grup mniejszych niż 5 osób.", "Porównania z rynkiem mają sprawdzone źródło albo zostały usunięte.", "Komentarze były zanonimizowane przed wklejeniem do AI – RODO.", "Komunikat do pracowników zawiera informację, co firma zrobi z wynikiem.", "Treść komunikatu do pracowników zatwierdzona przez Ciebie i zarząd."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. eNPS to sygnał, a nie diagnoza: najwięcej mówi trend i to, co ludzie piszą w uzasadnieniach."}, {"id": "4.06", "nazwa": "Misja, wizja i wartości — warsztat i definicje", "co_robi": "Projektuje warsztat, na którym zespół sam wypracowuje misję, wizję i wartości firmy, a potem zamienia ogólne hasła w definicje z konkretnymi zachowaniami. Dzięki temu wartości da się wykorzystać w rekrutacji, onboardingu i ocenach.", "kiedy": "Gdy wartości wiszą na ścianie, ale nikt ich nie pamięta, albo firma urosła z 15 do 80 osób i właściciel chce spisać, „o co nam właściwie chodzi”.", "brief": [{"pole": "Firma i historia", "opis": "Kim jesteście i skąd przychodzicie, np. „rodzinna firma produkcyjna z Podkarpacia, 30 lat na rynku, 85 osób, drugie pokolenie przejmuje zarządzanie”."}, {"pole": "Obecne wartości", "opis": "Co już jest spisane lub mówione, np. „jakość, rodzinna atmosfera, innowacyjność – nikt nie wie, co to znaczy w praktyce”."}, {"pole": "Uczestnicy warsztatu", "opis": "Kto weźmie udział, np. „zarząd 3 os., kierownicy 6 os., 6 osób z produkcji i biura wybranych przez zespoły”."}, {"pole": "Czas i forma", "opis": "Ile masz czasu i gdzie, np. „jeden dzień 9:00–15:00 stacjonarnie w sali konferencyjnej”."}, {"pole": "Przykłady zachowań", "opis": "Sytuacje, które pokazują kulturę dobrze lub źle, np. „brygadzista został po godzinach, żeby dokończyć zamówienie; dział sprzedaży obiecuje terminy bez konsultacji z produkcją”."}], "prompt": "Jesteś doświadczoną facylitatorką i konsultantką ds. kultury organizacyjnej, która pracuje z polskimi firmami z sektora MŚP. Zaprojektuj warsztat wypracowania misji, wizji i wartości oraz pomóż zamienić wartości w opisy zachowań.\n\nDANE:\nFirma i historia: [FIRMA I HISTORIA]\nObecne wartości: [OBECNE WARTOŚCI]\nUczestnicy: [UCZESTNICY WARSZTATU]\nCzas i forma: [CZAS I FORMA]\nPrzykłady zachowań: [PRZYKŁADY ZACHOWAŃ]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj maksymalnie 5 krótkich pytań i poczekaj. Nie wymyślaj historii firmy, liczb ani cytatów; luki oznaczaj [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE].\n2. Warsztat ma opierać się na prawdziwych historiach z firmy, a nie na liście modnych słów.\n3. Maksymalnie 3–5 wartości. Każda ma: nazwę, jednozdaniową definicję, 3 zachowania „tak robimy” i 2 zachowania „tak nie robimy”, opisane tak, żeby dało się je zaobserwować.\n4. Misja: 1–2 zdania o tym, po co firma istnieje. Wizja: gdzie chce być za kilka lat. Bez korporacyjnego żargonu.\n5. Zaproponuj, jak zebrać głos pracowników spoza warsztatu (krótka ankieta lub rozmowy).\n6. Wartości nie mogą prowadzić do dyskryminacji ani wykluczać osób z jakiejkolwiek grupy – zwróć uwagę na sformułowania typu „młody zespół” czy „dyspozycyjność 24/7”.\n\nFORMAT WYNIKU:\nA) Scenariusz warsztatu: blok | czas | cel | ćwiczenie | materiały.\nB) Pytania do facylitacji dla każdego bloku.\nC) Szablon karty wartości (do wypełnienia na warsztacie).\nD) Przykładowa karta jednej wartości na bazie podanych zachowań, oznaczona jako propozycja.\nE) Plan wdrożenia wartości: rekrutacja, onboarding, ocena okresowa, komunikacja.\nF) Lista „sprawdź przed warsztatem”.", "polecenia": ["Skróć warsztat do 3 godzin bez utraty najważniejszych ćwiczeń.", "Przygotuj wersję warsztatu online na Teams z tablicą do pracy zespołowej.", "Napisz zaproszenie na warsztat dla uczestników.", "Zaproponuj 5 pytań rekrutacyjnych sprawdzających dopasowanie do naszych wartości.", "Przeredaguj misję tak, żeby brzmiała naturalnie, a nie jak slogan.", "Przygotuj krótką ankietę dla całej firmy o tym, co nas wyróżnia.", "Pokaż, jak wpleść wartości w ocenę okresową bez oceniania charakteru.", "Napisz komunikat ogłaszający wartości wszystkim pracownikom.", "Przygotuj wersję wartości prostym językiem dla pracowników produkcji.", "Przetłumacz misję, wizję i wartości na angielski."], "checklista": ["Każda wartość ma opisane zachowania, które da się zaobserwować.", "Wartości wynikają z prawdziwych historii firmy, a nie z listy haseł.", "Sformułowania nie dyskryminują i nie wykluczają żadnej grupy (wiek, płeć, rodzicielstwo, niepełnosprawność) – równe traktowanie.", "Wartości nie sugerują pracy ponad normy czasu pracy wynikające z Kodeksu pracy.", "Zarząd zgadza się z wartościami i jest gotów sam się według nich zachowywać.", "Jest plan, jak wartości trafią do rekrutacji, onboardingu i ocen.", "Ostateczne brzmienie zatwierdzone przez Ciebie i zarząd przed ogłoszeniem."], "uwaga": "Wynik to szkic do weryfikacji — decyzja należy do Ciebie. Wartości działają tylko wtedy, gdy zarząd i kierownicy pierwsi pokazują je w codziennych decyzjach."}, {"id": "4.07", "nazwa": "Rytuały zespołowe", "co_robi": "Projektuje zestaw prostych, powtarzalnych rytuałów, które budują atmosferę: powitania nowych osób, podziękowania, retrospektywy, celebrowanie sukcesów i pożegnania. Dopasowuje je do pracy zmianowej, zdalnej lub biurowej i do budżetu.", "kiedy": "Gdy zespół się rozjechał (praca hybrydowa, zmiany, nowe osoby), ludzie znają się tylko z maili, a Ty chcesz coś zmienić bez kosztownych imprez integracyjnych.", "brief": [{"pole": "Zespół i tryb pracy", "opis": "Kto i jak pracuje, np. „dział obsługi klienta, 25 osób, praca zmianowa, połowa zdalnie z różnych miast”."}, {"pole": "Problem do rozwiązania", "opis": "Co chcesz poprawić, np. „nowe osoby czują się samotne, nikt nie mówi dziękuję, sukcesy przechodzą bez echa”."}, {"pole": "Istniejące zwyczaje", "opis": "Co już działa lub nie działa, np. „poniedziałkowe spotkanie na Teams – ludzie mają wyłączone kamery; tort
